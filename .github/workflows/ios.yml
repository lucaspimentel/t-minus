name: ios

# Builds the iOS app (ios/, Capacitor) and uploads it to TestFlight. Manual: Actions → ios → Run
# workflow. Every run renders the Live Activity and widget previews (ios/Previews) as the
# live-activity-previews artifact; `upload` off stops there. Web and server changes reach the app
# through its remote URL, so a build is needed only for native changes or before a TestFlight
# build expires (90 days). See IOS.md.
#
# Signing without a Mac: the archive is signed ad hoc (it carries App.entitlements, no profile);
# the export re-signs it for App Store Connect with automatic signing and the App Store Connect API
# key, which creates the distribution certificate and profile in Apple's cloud as needed.
# Secrets: ASC_KEY_P8 (the .p8 contents), ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Build and upload to TestFlight (off renders the previews only)
        type: boolean
        default: true

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Live Activity and widget previews
        run: |
          mkdir -p "$RUNNER_TEMP/previews"
          swiftc -parse-as-library ios/App/Shared/RideState.swift ios/App/Shared/WidgetData.swift ios/App/TMinusWidgets/RideViews.swift ios/App/TMinusWidgets/LeaveWidgetViews.swift ios/Previews/Render.swift -o "$RUNNER_TEMP/render"
          "$RUNNER_TEMP/render" "$RUNNER_TEMP/previews"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-activity-previews
          path: ${{ runner.temp }}/previews/
          retention-days: 30

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: inputs.upload
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: inputs.upload
      - run: npx cap sync ios
        if: inputs.upload

      - name: API key
        if: inputs.upload
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Archive
        if: inputs.upload
        run: |
          xcodebuild archive -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES PROVISIONING_PROFILE_SPECIFIER=
          codesign -d --entitlements - --xml "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"

      - name: Export and check the entitlements
        if: inputs.upload
        run: |
          export_ipa() { # $1: export | upload
            cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$1</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
            xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
              -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
              -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          }
          export_ipa export
          unzip -q "$RUNNER_TEMP/export/App.ipa" -d "$RUNNER_TEMP/ipa"
          codesign -d --entitlements - --xml "$RUNNER_TEMP/ipa/Payload/App.app" | tee "$RUNNER_TEMP/entitlements.plist"
          grep -q 'aps-environment' "$RUNNER_TEMP/entitlements.plist" || { echo "::error::The signed app has no aps-environment entitlement"; exit 1; }
          test -d "$RUNNER_TEMP/ipa/Payload/App.app/PlugIns/TMinusWidgets.appex" || { echo "::error::The Live Activity extension is not embedded"; exit 1; }
          # The widget reads the app's request from the App Group: both need it.
          grep -q 'group.net.lucasp.tminus' "$RUNNER_TEMP/entitlements.plist" || { echo "::error::The signed app has no App Group"; exit 1; }
          codesign -d --entitlements - --xml "$RUNNER_TEMP/ipa/Payload/App.app/PlugIns/TMinusWidgets.appex" | grep -q 'group.net.lucasp.tminus' || { echo "::error::The signed extension has no App Group"; exit 1; }
          export_ipa upload

      - name: Collect logs
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          find "$TMPDIR" -maxdepth 2 -name '*.xcdistributionlogs' -exec cp -R {} "$RUNNER_TEMP/logs/" \; 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: ios-logs
          path: ${{ runner.temp }}/logs/
          retention-days: 14
