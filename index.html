<html lang="en">

<style>
  :root {
    color-scheme: light dark; /* native controls (time pickers, checkboxes) follow the theme */
    --bg: #f5f5f3; --card: #ffffff; --text: #1c1f24; --muted: #6b7078; --border: #dcdde0;
    --green: #1f8a4c; --amber: #b86e00; --red: #c62828; --accent: #ed8b00;
    --alert-bg: #fff4e0; --alert-border: #f0c070;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417; --card: #1c1f24; --text: #eceef1; --muted: #9aa0a8; --border: #2e333a;
      --green: #4cc47f; --amber: #f0a830; --red: #ff6b6b; --accent: #ed8b00;
      --alert-bg: #2e2515; --alert-border: #6b5220;
    }
  }
  * { box-sizing: border-box; }
  /* No double-tap zoom (iOS Safari ignores user-scalable=no for pinch zoom). */
  html { touch-action: manipulation; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    /* 10px below the notch/status bar: iOS blurs content right under it. */
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px max(16px, env(safe-area-inset-bottom));
  }
  main { max-width: 480px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .toggle { display: flex; flex-wrap: wrap; flex: 1; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .toggle button {
    flex: 1 1 auto; padding: 10px 6px; border: 0; background: var(--card); color: var(--muted);
    font: inherit; font-size: 14px; cursor: pointer;
  }
  .toggle button[aria-pressed="true"] { background: var(--accent); color: #1c1f24; font-weight: 600; }
  .toggle select {
    flex: 1; min-width: 0; padding: 10px; border: 0; background: var(--card); color: var(--text);
    font: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .icon-btn {
    width: 44px; height: 44px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--card); color: var(--text); font-size: 20px; cursor: pointer;
  }
  .status { font-size: 13px; color: var(--muted); margin: 0 0 12px; min-height: 18px; }
  .status.stale { color: var(--red); }
  .alerts { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 8px; }
  .alerts li {
    background: var(--alert-bg); border: 1px solid var(--alert-border); border-radius: 10px;
    padding: 8px 12px; font-size: 14px;
  }
  .alerts b { font-size: 12px; letter-spacing: .03em; }
  .rows { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .row {
    background: var(--card); border: 1px solid var(--border); border-left: 6px solid var(--border);
    border-radius: 12px; padding: 12px 14px;
  }
  .row.green { border-left-color: var(--green); }
  .row.amber { border-left-color: var(--amber); }
  .row.red { border-left-color: var(--red); }
  .big {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0 8px;
    font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  /* The countdown never breaks; if a long leave-by time ("Thu 5:31am") doesn't fit beside it,
     the time drops to the next line, still right-aligned. */
  .big > span { white-space: nowrap; }
  .big .at { font-size: 20px; font-weight: 600; margin-left: auto; }
  .green .big { color: var(--green); }
  .amber .big { color: var(--amber); }
  .red .big { color: var(--red); }
  .row.missed { border-left-color: var(--muted); }
  .missed .big { color: var(--muted); font-size: 20px; }
  .none .big { color: var(--muted); font-size: 20px; }
  .detail { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .dot {
    display: inline-block; width: .7em; height: .7em; border-radius: 50%; margin-right: .35em;
    vertical-align: baseline; box-shadow: 0 0 0 1px rgb(0 0 0 / .25);
  }
  .tag { white-space: nowrap; }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase;
    padding: 1px 6px; border-radius: 6px; border: 1px solid var(--border); margin-left: 6px; vertical-align: 2px;
  }
  .badge.live { border-color: var(--green); color: var(--green); }
  .row { cursor: pointer; }
  /* Expanded row: steps under a divider, joined by a rail through the route dots. */
  .timeline { position: relative; border-top: 1px solid var(--border); margin-top: 8px; padding-top: 6px; }
  .timeline::before {
    content: ''; position: absolute; left: 4px; top: 14px; bottom: 10px; width: 2px; background: var(--border);
  }
  .step { position: relative; padding: 3px 0 3px 22px; font-variant-numeric: tabular-nums; }
  .step.walk { font-size: 13px; color: var(--muted); }
  .step.leg { font-size: 14px; }
  .step.leg .dot { position: absolute; left: 0; top: calc(3px + .4em); margin: 0; }
  .empty { color: var(--muted); padding: 16px 0; }
  .enroute-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: -4px 0 12px; font-size: 14px; color: var(--muted); }
  .enroute-bar button {
    padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); color: var(--text); font: inherit; font-size: 14px; cursor: pointer;
  }
  .en-status { flex: 1 1 0; min-width: 0; }
  .row.enroute { border-left-color: var(--border); }
  .enroute .big { color: var(--text); }
  .row.enroute.catch { border-left-color: var(--green); }
  .catch .big { color: var(--green); }
  .version { color: var(--muted); font-size: 12px; text-align: center; margin-top: 20px; }
  .empty button { margin-top: 8px; }
  /* Setup view (setup.js) */
  .setup button {
    padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font: inherit; font-size: 14px; cursor: pointer;
  }
  .setup button.primary { background: var(--accent); color: #1c1f24; border-color: var(--accent); font-weight: 600; }
  .setup button.danger { color: var(--red); }
  .setup button:disabled { opacity: .5; }
  .setup-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    /* Sticks below the status bar, with the same 10px gap as the page top. */
    position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); padding: 10px 0; margin-top: -6px; z-index: 1;
  }
  .setup .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 14px 14px; margin-bottom: 12px;
  }
  .field { display: block; margin: 10px 0 0; font-size: 14px; color: var(--muted); }
  .field input { margin-top: 4px; }
  .check { display: flex; gap: 8px; align-items: center; margin: 10px 0 0; font-size: 14px; }
  .setup .check input { width: auto; margin: 0; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .setup input, .setup textarea, .setup select {
    width: 100%; font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px;
  }
  .setup textarea { height: 240px; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; margin-top: 8px; }
  .leg-item { border-top: 1px solid var(--border); margin-top: 10px; padding-top: 10px; }
  .leg-text { font-size: 14px; margin-bottom: 6px; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .trip-btns, .io { margin-top: 12px; }
  .setup button.add { width: 100%; margin: 10px 0 0; }
  .setup .list { display: grid; gap: 6px; margin-top: 10px; }
  .setup button.item { text-align: left; width: 100%; }  .setup .item + .item { margin-top: 0; }
  .setup .list.trips { margin: 0; }
  .setup .section { margin: 20px 0 6px; }
  .trip-row { display: flex; gap: 6px; }
  .trip-row .item { flex: 1; min-width: 0; padding: 10px 12px; }
  .trip-row .item .muted { margin: 2px 0 0; overflow-wrap: anywhere; }
  .muted { color: var(--muted); font-size: 14px; margin: 4px 0 8px; }
  .msg { font-size: 13px; margin-top: 6px; white-space: pre-wrap; }
  .msg.err { color: var(--red); }
</style>
</head>
<body>
<main>
  <div id="app">
    <header>
      <div class="toggle" id="toggle" role="group" aria-label="Trip"></div>
      <button class="icon-btn" id="refresh" aria-label="Refresh" title="Refresh">&#x21bb;</button>
      <button class="icon-btn" id="open-setup" aria-label="Setup" title="Setup">&#x2699;</button>
    </header>
    <p class="status" id="status">Loading…</p>
    <div class="enroute-bar" id="enroute" hidden></div>
    <p class="status stale" id="loadfail" hidden>The app failed to start, probably a partial update.
      <button id="reload" type="button">Reload</button></p>
    <ul class="alerts" id="alerts"></ul>
    <ul class="rows" id="rows"></ul>
    <footer class="version">Version 2026-10-01 · 34f0940a6c</footer>
  </div>
  <section id="setup" class="setup" hidden></section>
</main>

<script>
  // Shown if the module below never starts (e.g. a stale cached core.js after a deploy).
  setTimeout(() => {
    if (window.appStarted) return;
    document.getElementById('status').hidden = true;
    document.getElementById('loadfail').hidden = false;
    document.getElementById('reload').onclick = () => location.reload();
  }, 5000);
</script>
<script type="module">
import {
  validateConfig, tripShape, commuteEntities, pickTrip, scheduleWindow, nextServiceWindow, fillRows,
  departureCount, stopSlackMinutes, wakeMinutes, keepAwake, mergeTrips, legVehicles, rememberLive, withRemembered, averageHeadway, pickTimingLeg, tripRows,
  rowState, timelineSteps, startEnRoute, withTarget, enRouteActive, enRouteStatus, pollIntervalMs,
  filterAlerts, expandStops, childToParentMap, formatTime, countdownLabel,
} from './core.js?v=bc52e6a0cf';
import { openSetup } from './setup.js?v=581259f4de';

const API = 'https://api-v3.mbta.com';
const KEY_CONFIG = 'mbta-leave-by:config';
const KEY_OVERRIDE = 'mbta-leave-by:trip-override';
const KEY_LAST_TRIP = 'mbta-leave-by:last-trip';
// "Leaving now" / "At the stop" per trip index: { [idx]: { name, kind, at, atStop, key, dep } }.
const KEY_EN_ROUTE = 'mbta-leave-by:en-route';
const SCHEDULE_TTL = 15 * 60_000;
const ALERT_TTL = 5 * 60_000;
const NEXT_DAY_TTL = 60 * 60_000;

const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

// Saved configs in the old two-commute format fail validation and are ignored.
function loadConfig() {
  const saved = store.get(KEY_CONFIG);
  return saved && validateConfig(saved).length === 0 ? saved : null;
}

store.del('mbta-leave-by:direction'); // override key from the old format
let config = loadConfig();
let tripIdx = config ? pickTrip(Date.now(), config, store.get(KEY_OVERRIDE), store.get(KEY_LAST_TRIP)) : 0;
// Per-trip cache, one doc per transit leg:
// { predictions: [doc], schedules: {docs, date, coversEndOfService, at}, alerts: {doc, at},
//   nextDay: {docs, date, at} (next service day's schedules, fetched once today's run out),
//   timing: index of the transit leg leave-by is based on,
//   lastLive: last live times per leg (rememberLive), for rides that just left }
let cache = {};
// Previous timing leg per trip, for the hysteresis in pickTimingLeg.
const lastTiming = new Map();
let lastOk = null;
let lastError = null;
let notice = null; // e.g. "Saved, but couldn't verify stops"
let setupView = null; // open setup view (setup.js), if any
let pollTimer = null;
let inFlight = false;
let pending = false;

// ---------- API ----------

async function api(path, params) {
  const qs = new URLSearchParams(params);
  if (config?.apiKey) qs.set('api_key', config.apiKey);
  const res = await fetch(`${API}${path}?${qs}`, { headers: { Accept: 'application/vnd.api+json' } });
  if (res.status === 429) throw new Error('Rate limited (429)');
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

const tripFields = {
  'fields[prediction]': 'arrival_time,departure_time,schedule_relationship',
  'fields[schedule]': 'arrival_time,departure_time',
  include: 'stop',
  'fields[stop]': 'parent_station',
};

function legQuery(leg) {
  return { 'filter[route]': leg.route, 'filter[direction_id]': leg.direction_id, 'filter[stop]': `${leg.stop},${leg.alight}`, ...tripFields };
}

async function fetchSchedules(trip, w) {
  const win = { 'filter[date]': w.date, 'filter[min_time]': w.minTime, 'filter[max_time]': w.maxTime };
  const docs = await Promise.all(tripShape(trip).transit.map(l => api('/schedules', { ...legQuery(l), ...win })));
  return { docs, date: w.date, coversEndOfService: !!w.coversEndOfService, at: Date.now() };
}

function fetchPredictions(trip) {
  return Promise.all(tripShape(trip).transit.map(l => api('/predictions', legQuery(l))));
}

async function fetchAlerts(trip) {
  const { routes } = commuteEntities(trip);
  const doc = await api('/alerts', {
    'filter[route]': [...routes].join(','),
    'filter[datetime]': 'NOW',
    'fields[alert]': 'effect,header,short_header,severity,active_period,informed_entity',
  });
  return { doc, at: Date.now() };
}

// Timing leg from schedules only (predictions would make it flicker), with hysteresis.
function updateTiming(idx, trip, c) {
  const { transit } = tripShape(trip);
  const headways = transit.map((l, i) => averageHeadway(legVehicles(mergeTrips(null, c.schedules?.docs[i]), l)));
  c.timing = pickTimingLeg(headways, lastTiming.get(idx), trip.timingLeg);
  lastTiming.set(idx, c.timing);
}

async function refresh({ force = false } = {}) {
  if (!config) { render(); return; }
  if (setupView) return;
  if (inFlight) { pending = true; return; }
  inFlight = true;
  clearTimeout(pollTimer);
  const idx = tripIdx;
  const trip = config.trips[idx];
  const c = (cache[idx] ??= {});
  const now = Date.now();
  try {
    const tasks = [fetchPredictions(trip).then(p => {
      c.predictions = p;
      c.lastLive = rememberLive(c.lastLive, tripShape(trip).transit.map((l, i) => legVehicles(mergeTrips(p[i], null), l)), Date.now());
    })];
    if (force || !c.schedules || now - c.schedules.at > SCHEDULE_TTL) {
      // Look further ahead when more departures are shown (60-min midday headways).
      // 30 min back keeps a just-missed ride (shown up to 10 min after it leaves) in the data.
      const w = scheduleWindow(now, 30, Math.max(360, 90 * departureCount(config)));
      tasks.push(fetchSchedules(trip, w).then(s => { c.schedules = s; updateTiming(idx, trip, c); }));
    }
    if (force || !c.alerts || now - c.alerts.at > ALERT_TTL) {
      tasks.push(fetchAlerts(trip).then(a => { c.alerts = a; }));
    }
    await Promise.all(tasks);
    // Once today's service is running out, fetch the next service day's morning schedule.
    const next = nextServiceWindow(now);
    if (c.schedules?.coversEndOfService &&
        rowsFor(trip, c.timing, c.predictions, c.schedules?.docs, now, c.lastLive).length < departureCount(config) &&
        (!c.nextDay || c.nextDay.date !== next.date || now - c.nextDay.at > NEXT_DAY_TTL)) {
      c.nextDay = await fetchSchedules(trip, next);
    }
    lastOk = Date.now();
    lastError = null;
  } catch (e) {
    lastError = e.message || String(e);
  } finally {
    inFlight = false;
  }
  render();
  if (pending) { pending = false; return refresh(); }
  schedulePoll();
}

function schedulePoll() {
  clearTimeout(pollTimer);
  if (document.hidden || !config) return;
  pollTimer = setTimeout(() => refresh(), pollIntervalMs(currentRows(Date.now()), Date.now()));
}

// ---------- compute + render ----------

function rowsFor(trip, timing, predictionDocs, scheduleDocs, now, lastLive = null, enRoute = null) {
  if (!predictionDocs && !scheduleDocs) return [];
  const vehicles = withRemembered(
    tripShape(trip).transit.map((l, i) => legVehicles(mergeTrips(predictionDocs?.[i], scheduleDocs?.[i]), l)), lastLive);
  return tripRows(trip, vehicles, timing ?? 0, now, stopSlackMinutes(config), departureCount(config), enRoute);
}

// Today's rows, topped up from the next service day. Days are computed separately
// because GTFS trip ids repeat across days.
// En route state of the shown trip (dropped if the trip at that index was renamed/replaced).
function enRouteState() {
  const s = (store.get(KEY_EN_ROUTE) ?? {})[tripIdx];
  return s && config?.trips[tripIdx]?.name === s.name ? s : null;
}
function setEnRoute(state) {
  const all = store.get(KEY_EN_ROUTE) ?? {};
  if (state) all[tripIdx] = { ...state, name: config.trips[tripIdx].name };
  else delete all[tripIdx];
  store.set(KEY_EN_ROUTE, all);
}

function currentRows(now, enRoute = enRouteState()) {
  if (!config) return [];
  const trip = config.trips[tripIdx];
  const c = cache[tripIdx];
  if (!c) return [];
  const count = departureCount(config);
  const today = rowsFor(trip, c.timing, c.predictions, c.schedules?.docs, now, c.lastLive, enRoute);
  // The mode ends once its ride left 10 min ago (or 30 min after the tap).
  if (enRoute && !enRouteActive(enRoute, today, now)) { setEnRoute(null); return currentRows(now, null); }
  if (today.length >= count || !c.nextDay || !c.schedules?.coversEndOfService) return today;
  return fillRows(today, rowsFor(trip, c.timing, null, c.nextDay.docs, now), count);
}

function currentAlerts(now) {
  const c = cache[tripIdx];
  if (!config || !c?.alerts) return [];
  const { routes, stops } = commuteEntities(config.trips[tripIdx]);
  const parents = childToParentMap(...(c.predictions ?? []), ...(c.schedules?.docs ?? []));
  return filterAlerts(c.alerts.doc, routes, expandStops(stops, parents), now);
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function badge(source) {
  return el('span', `badge ${source}`, source);
}

// Two trips: side-by-side buttons. More: a dropdown. Rebuilt only when the trips or the
// selection change, so a periodic render doesn't close an open dropdown.
let toggleKey = null;
function renderToggle() {
  const t = $('toggle');
  const trips = config?.trips ?? [];
  const key = JSON.stringify([trips.map(x => x.name), tripIdx]);
  if (key === toggleKey) return;
  toggleKey = key;
  t.hidden = trips.length < 2;
  if (trips.length > 2) {
    const select = el('select');
    select.setAttribute('aria-label', 'Trip');
    select.append(...trips.map((trip, i) => {
      const o = el('option', null, trip.name);
      o.value = String(i);
      o.selected = i === tripIdx;
      return o;
    }));
    select.onchange = () => setTrip(Number(select.value), true);
    t.replaceChildren(select);
    return;
  }
  t.replaceChildren(...trips.map((trip, i) => {
    const b = el('button', null, trip.name);
    b.setAttribute('aria-pressed', String(i === tripIdx));
    b.onclick = () => setTrip(i, true);
    return b;
  }));
}

// Route color dot (stored on the leg at save time; none for configs saved before that).
function dot(color) {
  if (!color) return '';
  const d = el('span', 'dot');
  d.style.background = `#${color}`;
  return d;
}

function renderRow(r, now, isCatch) {
  const state = rowState(now, r);
  if (state === 'hidden') return null;
  const li = el('li', `row ${state}${isCatch ? ' catch' : ''}`);
  const head = el('div', 'big');
  // Red counts down to (and shows) the last chance; leave-by has already passed. Missed and
  // en route count to/from the first departure.
  const firstLeg = state === 'missed' || state === 'enroute';
  const target = state === 'red' ? r.lastChance : firstLeg ? r.firstDep : r.leaveBy;
  head.append(el('span', null, countdownLabel(state, target - now, r.legs[0].label)), el('span', 'at', formatTime(target, now)));
  li.append(head);
  const key = rowKey(r);
  const expanded = expandedRows.has(key);
  li.setAttribute('aria-expanded', String(expanded));
  li.onclick = () => {
    if (!expandedRows.delete(key)) expandedRows.add(key);
    render();
  };
  if (!expanded) {
    // Collapsed: the timing leg (the first leg on missed and en-route rows) with its badge, and
    // arrival. Tap to expand.
    const shown = r.legs[firstLeg ? 0 : r.timingIdx];
    const summary = el('div', 'detail');
    summary.append(dot(shown.color), `${shown.label} ${formatTime(shown.dep, now)}`, badge(shown.source), ` → ${formatTime(r.eta, now)}`);
    li.append(summary);
    return li;
  }
  // Expanded: the timeline replaces the summary (walks, legs with their badges, transfers).
  const timeline = el('div', 'timeline');
  for (const s of timelineSteps(r, config.trips[tripIdx], stopSlackMinutes(config), now)) {
    if (s.kind === 'walk') { timeline.append(el('div', 'step walk', s.text)); continue; }
    const line = el('div', 'step leg');
    line.append(dot(s.leg.color), `${s.leg.label} ${formatTime(s.leg.dep, now)} → ${formatTime(s.leg.arr, now)}`, badge(s.leg.source));
    timeline.append(line);
  }
  li.append(timeline);
  return li;
}

// Rows expanded by a tap, by row key (the timing vehicle's trip id; next-day ids repeat).
const expandedRows = new Set();
const rowKey = r => `${r.key}${r.nextDay ? '@next' : ''}`;

function render() {
  const now = Date.now();
  renderToggle();

  const status = $('status');
  syncWakeLock(!!config && keepAwake(currentRows(now), now, wakeMinutes(config)));
  if (!config) {
    status.className = 'status';
    status.textContent = 'No trips set up yet.';
    $('alerts').replaceChildren();
    const li = el('li', 'empty');
    const btn = el('button', null, 'Set up a trip');
    btn.onclick = showSetup;
    li.append(btn);
    $('rows').replaceChildren(li);
    return;
  }
  if (lastError) {
    status.className = 'status stale';
    status.textContent = lastOk
      ? `Stale (${lastError}) · last updated ${formatTime(lastOk)}`
      : `Error: ${lastError}`;
  } else {
    status.className = notice ? 'status stale' : 'status';
    status.textContent = [lastOk ? `Updated ${formatTime(lastOk)}` : 'Loading…', notice].filter(Boolean).join(' · ');
  }

  $('alerts').replaceChildren(...currentAlerts(now).map(a => {
    const li = el('li');
    li.append(el('b', null, a.effect.replaceAll('_', ' ')), el('div', null, a.header));
    return li;
  }));

  const current = currentRows(now);
  renderEnRoute(now, current.length > 0);
  // En route, the first reachable ride is the one being headed for.
  const catchRow = current.find(r => rowState(now, r) === 'enroute');
  const rows = current.map(r => renderRow(r, now, r === catchRow)).filter(Boolean);
  if (rows.length) $('rows').replaceChildren(...rows);
  else $('rows').replaceChildren(el('li', 'empty', lastOk ? 'No upcoming departures found.' : ''));
}

// "Leaving now" / "At the stop" bar, rebuilt only when its content changes.
let enRouteKey = null;
function renderEnRoute(now, hasRows) {
  const s = enRouteState();
  const text = s ? enRouteStatus(s, now) : '';
  const key = JSON.stringify([tripIdx, hasRows, s?.kind, text]);
  if (key === enRouteKey) return;
  enRouteKey = key;
  const bar = $('enroute');
  bar.hidden = !hasRows && !s;
  const btn = (label, onclick) => {
    const b = el('button', null, label);
    b.type = 'button';
    b.onclick = onclick;
    return b;
  };
  bar.replaceChildren(...(s
    ? [el('span', 'en-status', text), s.kind === 'leaving' && btn('At the stop', () => goEnRoute('stop')),
      btn('Cancel', () => { setEnRoute(null); render(); schedulePoll(); })].filter(Boolean)
    : [btn('Leaving now', () => goEnRoute('leaving')), btn('At the stop', () => goEnRoute('stop'))]));
}

function goEnRoute(kind) {
  const now = Date.now();
  const s = startEnRoute(kind, now, tripShape(config.trips[tripIdx]).walkBefore, enRouteState());
  setEnRoute(withTarget(s, currentRows(now, s)));
  render();
  schedulePoll(); // polls every 60 s while en route
}

// Screen Wake Lock: keeps the screen on near leave-by (keepAwake). The OS drops the lock while
// the page is hidden; the next render re-requests it. Errors (unsupported, Low Power Mode) are
// ignored.
let wakeLock = null;
let wakeWanted = false;
let wakeRequesting = false;
function syncWakeLock(want) {
  wakeWanted = want;
  if (!navigator.wakeLock) return;
  if (want && (!wakeLock || wakeLock.released) && !wakeRequesting) {
    wakeRequesting = true;
    navigator.wakeLock.request('screen')
      .then(l => { wakeLock = l; if (!wakeWanted) syncWakeLock(false); })
      .catch(() => {})
      .finally(() => { wakeRequesting = false; });
  } else if (!want && wakeLock && !wakeLock.released) {
    wakeLock.release().catch(() => {});
    wakeLock = null;
  }
}
// Some browsers only grant the lock after a user gesture.
document.addEventListener('pointerdown', () => syncWakeLock(wakeWanted));

// A manual choice holds until the next trip window starts (see pickTrip).
function setTrip(i, manual) {
  if (manual) store.set(KEY_OVERRIDE, { index: i, setAt: Date.now() });
  if (i === tripIdx) return;
  tripIdx = i;
  store.set(KEY_LAST_TRIP, i);
  render();
  refresh();
}

// ---------- setup ----------

// Polling and rendering pause while setup is open; saving there replaces the config.
function showSetup() {
  if (setupView) return;
  clearTimeout(pollTimer);
  $('app').hidden = true;
  setupView = openSetup({
    root: $('setup'),
    config,
    api,
    timingFor: i => cache[i]?.timing ?? null,
    onClose: closeSetup,
    // Each trip saves on its own while setup stays open.
    onSave(cfg, warning) {
      config = cfg;
      store.set(KEY_CONFIG, config);
      store.del(KEY_OVERRIDE);
      store.del(KEY_EN_ROUTE);
      cache = {};
      lastTiming.clear();
      lastOk = null;
      notice = warning;
      tripIdx = pickTrip(Date.now(), config, null, store.get(KEY_LAST_TRIP));
    },
  });
}

function closeSetup() {
  setupView?.close();
  setupView = null;
  $('app').hidden = false;
  render();
  refresh({ force: !cache[tripIdx] });
}

$('open-setup').onclick = showSetup;

// ---------- timers ----------

$('refresh').onclick = () => refresh({ force: true });

setInterval(() => {
  if (document.hidden || setupView) return;
  // Switch trips when a trip window starts (a manual override expires at that point).
  const t = config ? pickTrip(Date.now(), config, store.get(KEY_OVERRIDE), store.get(KEY_LAST_TRIP)) : tripIdx;
  if (t !== tripIdx) setTrip(t, false);
  else render();
}, 1000);

document.addEventListener('visibilitychange', () => {
  if (document.hidden) clearTimeout(pollTimer);
  else if (!setupView) refresh();
});

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

window.appStarted = true;
render();
if (config) refresh({ force: true });
else showSetup(); // first run: nothing to show until a trip is set up
</script>
</body>
</html>
