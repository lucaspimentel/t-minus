<script type="module">
import {
  validateConfig, tripShape, commuteEntities, pickTrip, pickByLocation, scheduleWindow, nextServiceWindow, fillRows,
  departureCount, stopSlackMinutes, wakeMinutes, keepAwake, keepAwakeRiding, mergeTrips, legVehicles, rememberLive, tripVehicles, legTime, sourceText, averageHeadway, pickTimingLeg, tripRows,
  rowState, timelineSteps, stopNames, startEnRoute, tripStarted, pinTarget, advanceEnRoute, enRouteActive, enRouteStatus, pollIntervalMs, dataAgeText, retryDelayMs, rateLimitDelayMs, pullOffset, PULL_READY, PULL_HOLD, pageVersion, isNewerPage,
  unpinTarget, onVehicle, vehicleLabel, lineLabel, toward, NO_TRIPS_HELP, legRoutes, trackLegs, ridePhase, canUndoBoarding, replanFrom, rideHeadline, rideStops, rideStopsQuery, shownStops, transferOutlook, outlookText, otherVehicles, connectionChoices, vehicleNoun, previousRides, switchLeg,
  filterAlerts, expandStops, childToParentMap, formatTime, formatCountdown, countdownLabel, statusProblem, rowAriaLabel, legQuery, HEADS_UP_MIN, headsUpDue,
} from './core.js?v=284f86c38a';
import { openSetup } from './setup.js?v=a60289da69';

const API = 'https://api-v3.mbta.com';
const KEY_CONFIG = 't-minus:config';
const KEY_OVERRIDE = 't-minus:trip-override';
const KEY_LAST_TRIP = 't-minus:last-trip';
// "Leaving now" / "At the stop" per trip index: { [idx]: { name, kind, at, atStop, key, dep } }.
const KEY_EN_ROUTE = 't-minus:en-route';
const SCHEDULE_TTL = 15 * 60_000;
const ALERT_TTL = 5 * 60_000;
const NEXT_DAY_TTL = 60 * 60_000;

const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

// Saved configs in the old two-commute format fail validation and are ignored.
function loadConfig() {
  const saved = store.get(KEY_CONFIG);
  return saved && validateConfig(saved).length === 0 ? saved : null;
}

store.del('t-minus:direction'); // override key from the old format
// The stored config (it may have no trips, keeping the settings); `config` is set only with trips.
let savedConfig = loadConfig();
// A one-off trip from "Go somewhere else…" (auto-route): { trip, at }. Shown after the saved trips,
// never written into the saved config, until removed (✕), saved, replaced, or its ride ends.
const KEY_ONE_OFF = 't-minus:one-off';
function loadOneOff() {
  const o = store.get(KEY_ONE_OFF);
  return o?.trip && validateConfig({ trips: [o.trip] }).length === 0 ? o : null;
}
let oneOff = loadOneOff();
// The trips shown: the saved ones, then the one-off; null with neither.
function withOneOff(saved) {
  const trips = [...(saved?.trips ?? []), ...(oneOff ? [oneOff.trip] : [])];
  return trips.length ? { ...saved, trips } : null;
}
let config = withOneOff(savedConfig);
const oneOffIdx = () => (oneOff && config ? config.trips.length - 1 : -1);
// pickTrip, but the one-off while it exists, unless another trip was picked by hand since.
function chooseTrip(now, override, near = -1) {
  if (oneOff && !(override && override.setAt >= oneOff.at && override.index !== oneOffIdx())) return oneOffIdx();
  return pickTrip(now, config, override, store.get(KEY_LAST_TRIP), near);
}
let tripIdx = config ? chooseTrip(Date.now(), store.get(KEY_OVERRIDE)) : 0;
// Per-trip cache, one doc per transit leg:
// { predictions: [doc], schedules: {docs, date, coversEndOfService, at}, alerts: {doc, at},
//   nextDay: {docs, date, at} (next service day's schedules, fetched once today's run out),
//   timing: index of the transit leg leave-by is based on,
//   lastLive: last live times per leg (rememberLive), for rides that just left,
//   lastOk / lastError: this trip's last successful fetch time (the data's, from a stale proxy
//   copy; then mbtaDown) and last error }
let cache = {};
// Previous timing leg per trip, for the hysteresis in pickTimingLeg.
const lastTiming = new Map();
let loading = null; // { idx, since }: a fetch for a trip with no data yet ("Still loading…")
let notice = null; // e.g. "Saved, but couldn't verify stops"
let setupView = null; // open setup view (setup.js), if any
let pollTimer = null;
let inFlight = false;
const SPIN_MS = 800; // one turn of the refresh icon (#refresh.busy animation)
let spinStart = 0;
let idleWaiters = []; // called once the refresh icon stops (whenIdle)
let pending = false;

// ---------- API ----------

// The server's MBTA proxy first (its key and shared cache); the MBTA directly, with the saved key
// if any, after an error or PROXY_TIMEOUT_MS. A 503 or 404 (proxy off, busy, or an older server)
// skips the proxy for PROXY_OFF_MS.
const PROXY_TIMEOUT_MS = 2000;
const PROXY_OFF_MS = 10 * 60_000;
let proxyOffUntil = 0;
// While a refresh runs: { age } (ms), the oldest stale copy the proxy served ("MBTA down").
let proxyAge = null;

async function viaProxy(path, params) {
  if (!SERVER_API || Date.now() < proxyOffUntil) return null;
  try {
    const res = await fetch(`${SERVER_API}/mbta${path}?${new URLSearchParams(params)}`, { signal: AbortSignal.timeout(PROXY_TIMEOUT_MS) });
    if (res.status === 503 || res.status === 404) proxyOffUntil = Date.now() + PROXY_OFF_MS;
    if (!res.ok) return null;
    const doc = await res.json();
    const age = Number(res.headers.get('x-data-age')) * 1000;
    if (age > 0 && proxyAge) proxyAge.age = Math.max(proxyAge.age, age);
    return doc;
  } catch { return null; }
}

async function api(path, params) {
  const doc = await viaProxy(path, params);
  if (doc) return doc;
  const qs = new URLSearchParams(params);
  if (config?.apiKey) qs.set('api_key', config.apiKey);
  const res = await fetch(`${API}${path}?${qs}`, { headers: { Accept: 'application/vnd.api+json' } });
  if (res.status === 429) throw Object.assign(new Error('Rate limited (429)'), { rateLimited: true });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function fetchSchedules(trip, w) {
  const win = { 'filter[date]': w.date, 'filter[min_time]': w.minTime, 'filter[max_time]': w.maxTime };
  const docs = await Promise.all(tripShape(trip).transit.map(l => api('/schedules', { ...legQuery(l), ...win })));
  return { docs, date: w.date, coversEndOfService: !!w.coversEndOfService, at: Date.now() };
}

function fetchPredictions(trip) {
  return Promise.all(tripShape(trip).transit.map(l => api('/predictions', legQuery(l))));
}

// The ridden vehicle's remaining stops (predictions for its trip) and position.
function fetchRideStops(tripId) {
  return api('/predictions', rideStopsQuery(tripId));
}

// The leg being ridden on the shown trip, if any: { leg, idx }.
function ridingLeg(now) {
  const s = enRouteState();
  if (!s?.ride || !config) return null;
  const phase = ridePhase(s.ride, tripShape(config.trips[tripIdx]).walkAfter, now);
  return phase.kind === 'riding' ? { leg: s.ride.legs[phase.leg], idx: phase.leg } : null;
}

async function fetchAlerts(trip) {
  const { routes } = commuteEntities(trip);
  const doc = await api('/alerts', {
    'filter[route]': [...routes].join(','),
    'filter[datetime]': 'NOW',
    'fields[alert]': 'effect,header,short_header,severity,active_period,informed_entity',
  });
  return { doc, at: Date.now() };
}

// Timing leg from schedules only (predictions would make it flicker), with hysteresis.
function updateTiming(idx, trip, c) {
  const { transit } = tripShape(trip);
  const headways = transit.map((l, i) => averageHeadway(legVehicles(mergeTrips(null, c.schedules?.docs[i]), l)));
  c.timing = pickTimingLeg(headways, lastTiming.get(idx), trip.timingLeg);
  lastTiming.set(idx, c.timing);
}

async function refresh({ force = false } = {}) {
  if (!config) { render(); return; }
  if (setupView) return;
  if (inFlight) { pending = true; return; }
  inFlight = true;
  clearTimeout(pollTimer);
  const idx = tripIdx;
  const trip = config.trips[idx];
  const c = (cache[idx] ??= {});
  const now = Date.now();
  if (!$('refresh').classList.contains('busy')) spinStart = now;
  $('refresh').classList.add('busy');
  if (!c.lastOk) loading = { idx, since: now };
  const served = (proxyAge = { age: 0 });
  try {
    const tasks = [fetchPredictions(trip).then(p => {
      c.predictions = p;
      c.lastLive = rememberLive(c.lastLive, tripShape(trip).transit.map((l, i) => legVehicles(mergeTrips(p[i], null), l)), Date.now());
    })];
    if (force || !c.schedules || now - c.schedules.at > SCHEDULE_TTL) {
      // Look further ahead when more departures are shown (60-min midday headways).
      // 30 min back keeps a just-missed ride (shown up to 5 min after it leaves) in the data.
      const w = scheduleWindow(now, 30, Math.max(360, 90 * departureCount(config)));
      tasks.push(fetchSchedules(trip, w).then(s => { c.schedules = s; updateTiming(idx, trip, c); }));
    }
    if (force || !c.alerts || now - c.alerts.at > ALERT_TTL) {
      tasks.push(fetchAlerts(trip).then(a => { c.alerts = a; }));
    }
    // While riding: one more request for the vehicle's remaining stops (a failure only hides them).
    const riding = ridingLeg(now);
    if (riding) {
      const tripId = riding.leg.tripId;
      tasks.push(fetchRideStops(tripId)
        .then(doc => { c.rideStops = { tripId, doc, at: Date.now() }; })
        .catch(() => { c.rideStops = { tripId, doc: null, at: Date.now() }; }));
    }
    await Promise.all(tasks);
    // Once today's service is running out, fetch the next service day's morning schedule.
    const next = nextServiceWindow(now);
    if (c.schedules?.coversEndOfService &&
        rowsFor(trip, c.timing, c.predictions, c.schedules?.docs, now, c.lastLive).length < departureCount(config) &&
        (!c.nextDay || c.nextDay.date !== next.date || now - c.nextDay.at > NEXT_DAY_TTL)) {
      c.nextDay = await fetchSchedules(trip, next);
    }
    // A stale copy from the proxy (the MBTA is down): the data's own time.
    c.lastOk = Date.now() - served.age;
    c.mbtaDown = served.age > 0;
    c.lastError = null;
    c.failures = 0;
    c.rateLimited = false;
  } catch (e) {
    c.lastError = e.message || String(e);
    c.failures = (c.failures ?? 0) + 1;
    c.rateLimited = !!e.rateLimited;
  } finally {
    proxyAge = null;
    inFlight = false;
    loading = null;
    // Stops only at the end of a full turn (SPIN_MS, as in the CSS), so it never snaps back.
    const spun = Date.now() - spinStart;
    setTimeout(() => {
      if (inFlight) return;
      $('refresh').classList.remove('busy');
      for (const cb of idleWaiters.splice(0)) cb();
    }, Math.max(1, Math.ceil(spun / SPIN_MS)) * SPIN_MS - spun);
  }
  render();
  if (pending) { pending = false; return refresh(); }
  schedulePoll();
}

// Runs cb once refreshing is over (after any queued refresh), as the header ↻ stops.
function whenIdle(cb) {
  if ($('refresh').classList.contains('busy')) idleWaiters.push(cb);
  else cb();
}

function schedulePoll() {
  clearTimeout(pollTimer);
  if (document.hidden || !config) return;
  const now = Date.now();
  const normal = pollIntervalMs(currentRows(now), now, !!enRouteState()?.ride);
  // After an error: back off from 10 s (or wait for the rate limit's reset).
  const c = cache[tripIdx];
  const delay = !c?.lastError ? normal : c.rateLimited ? rateLimitDelayMs(now) : retryDelayMs(c.failures, normal);
  if (c) c.retryAt = c.lastError ? now + delay : null;
  pollTimer = setTimeout(() => refresh(), delay);
}

// ---------- compute + render ----------

function rowsFor(trip, timing, predictionDocs, scheduleDocs, now, lastLive = null, enRoute = null, count = departureCount(config)) {
  if (!predictionDocs && !scheduleDocs) return [];
  const { transit } = tripShape(trip);
  const vehicles = tripVehicles(transit, transit.map((l, i) => mergeTrips(predictionDocs?.[i], scheduleDocs?.[i])), lastLive, now);
  return tripRows(trip, vehicles, timing ?? 0, now, stopSlackMinutes(config), count, enRoute);
}

// En route state of the shown trip (dropped if the trip at that index was renamed/replaced).
function enRouteState() {
  const s = (store.get(KEY_EN_ROUTE) ?? {})[tripIdx];
  return s && config?.trips[tripIdx]?.name === s.name ? s : null;
}
// Returns the reminders a start of the trip cancelled ({ [remKey]: rem }; see restoreReminders).
function setEnRoute(state) {
  const all = store.get(KEY_EN_ROUTE) ?? {};
  const removed = tripStarted(state) && !tripStarted(all[tripIdx]) ? cancelTripReminders(tripIdx) : {};
  // Stop alerts follow a ride: none without one; a replaced or ended one is deleted on the server.
  if (state && !state.ride && state.alert) state = withoutAlert(state);
  const prevAlert = all[tripIdx]?.alert?.id;
  if (prevAlert && prevAlert !== state?.alert?.id) pushApi('DELETE', `/rides/${prevAlert}`).catch(() => {});
  if (state) all[tripIdx] = { ...state, name: config.trips[tripIdx].name };
  else delete all[tripIdx];
  store.set(KEY_EN_ROUTE, all);
  return removed;
}

// A restored state (Undo) re-posts its ride: the server's copy was deleted.
function withoutAlert(state) {
  if (!state?.alert) return state;
  const { alert: _, ...rest } = state;
  return rest;
}

// Today's rows, topped up from the next service day. Days are computed separately
// because GTFS trip ids repeat across days. En route (before boarding), rows follow the
// at-stop time.
function currentRows(now, enRoute = enRouteState(), extra = extraRows) {
  if (!config) return [];
  const trip = config.trips[tripIdx];
  const c = cache[tripIdx];
  if (!c) return [];
  const count = departureCount(config) + extra;
  // Rows follow the at-stop time only after "Leaving now" / "At the stop" (not plain tracking).
  const en = enRoute?.ride || enRoute?.kind === 'track' ? null : enRoute;
  const today = rowsFor(trip, c.timing, c.predictions, c.schedules?.docs, now, c.lastLive, en, count);
  // En route, the next service day's rides don't apply (you're heading out now).
  if (en || today.length >= count || !c.nextDay || !c.schedules?.coversEndOfService) return today;
  return fillRows(today, rowsFor(trip, c.timing, null, c.nextDay.docs, now), count);
}

// Advances the en-route state (boarding, live leg times) and ends it when it's over. Returns
// the active state, or null.
function syncEnRoute(now) {
  let s = enRouteState();
  if (!s || !config) return null;
  const before = JSON.stringify(s);
  const trip = config.trips[tripIdx];
  const { transit, walkAfter } = tripShape(trip);
  const c = cache[tripIdx];
  if (!s.ride) s = advanceEnRoute(s, currentRows(now, s), now);
  if (s.ride && c) {
    const maps = transit.map((l, i) => mergeTrips(c.predictions?.[i], c.schedules?.docs[i]));
    let ride = { ...s.ride, legs: trackLegs(s.ride.legs, transit, maps, c.lastLive) };
    // A connection that no longer works is re-planned; what was missed shows until boarding.
    const phase = ridePhase(ride, walkAfter, now);
    const o = transferOutlook(ride, phase, rideVehicles(), tripShape(trip).transfers, now);
    if (o?.missedDep != null) ride = { ...ride, legs: o.legs, missed: { leg: o.leg, dep: o.missedDep } };
    else if (o?.earlier) ride = { ...ride, legs: o.legs };
    if (ride.missed && (phase.leg > ride.missed.leg || (phase.kind === 'riding' && phase.leg === ride.missed.leg))) {
      const { missed: _, ...rest } = ride;
      ride = rest;
    }
    s = { ...s, ride };
  }
  if (!enRouteActive(s, walkAfter, now)) {
    setEnRoute(null);
    if (s.ride && tripIdx === oneOffIdx()) setTimeout(() => removeOneOff(false)); // its ride is over
    return null;
  }
  if (JSON.stringify(s) !== before) setEnRoute(s);
  return s;
}

// Per-leg vehicles of the shown trip (predictions + schedules, remembered live times).
function rideVehicles() {
  const c = cache[tripIdx];
  const { transit } = tripShape(config.trips[tripIdx]);
  return tripVehicles(transit, transit.map((l, i) => mergeTrips(c?.predictions?.[i], c?.schedules?.docs[i])), c?.lastLive, Date.now());
}

function currentAlerts(now) {
  const c = cache[tripIdx];
  if (!config || !c?.alerts) return [];
  const { routes, stops } = commuteEntities(config.trips[tripIdx]);
  const parents = childToParentMap(...(c.predictions ?? []), ...(c.schedules?.docs ?? []));
  return filterAlerts(c.alerts.doc, routes, expandStops(stops, parents), now);
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

// LIVE / SCHEDULED, or "every 6 min" (styled as scheduled) on a subway leg with no predictions.
function badge(leg) {
  return el('span', `badge ${leg.source}`, sourceText(leg));
}

// Two trips: side-by-side buttons. More: a dropdown. Rebuilt only when the trips or the
// selection change, so a periodic render doesn't close an open dropdown.
let toggleKey = null;
function renderToggle() {
  const t = $('toggle');
  const trips = config?.trips ?? [];
  const key = JSON.stringify([trips.map(x => x.name), tripIdx, oneOffIdx()]);
  if (key === toggleKey) return;
  toggleKey = key;
  t.hidden = trips.length < 2;
  if (trips.length > 2) {
    const select = el('select');
    select.setAttribute('aria-label', 'Trip');
    select.append(...trips.map((trip, i) => {
      const o = el('option', null, i === oneOffIdx() ? `${trip.name} (one-off)` : trip.name);
      o.value = String(i);
      o.selected = i === tripIdx;
      return o;
    }));
    select.onchange = () => setTrip(Number(select.value), true);
    t.replaceChildren(select);
    return;
  }
  t.replaceChildren(...trips.map((trip, i) => {
    const b = el('button', null, trip.name);
    b.setAttribute('aria-pressed', String(i === tripIdx));
    b.onclick = () => setTrip(i, true);
    return b;
  }));
}

// Route color dot (stored on the leg at save time; none for configs saved before that).
function dot(color) {
  if (!color) return '';
  const d = el('span', 'dot');
  d.style.background = `#${color}`;
  return d;
}

// Expand/collapse hint at a row's bottom-right (the row has aria-expanded).
function chevron(ch) {
  const c = el('span', 'chev', ch);
  c.setAttribute('aria-hidden', 'true');
  return c;
}

// `gone`: a missed row's ride from previousRides once its first vehicle has left ("I got on").
// A previous ride (`prev`) is drawn the same way: "Missed · left 3 min ago", its first departure,
// the timeline from boarding, and "I got on" in the expanded footer.
function renderRow(r, now, isCatch, pinnedKey = null, gone = null, prev = false) {
  const state = prev ? 'prev' : rowState(now, r);
  if (state === 'hidden') return null;
  const tracked = pinnedKey != null && isCatch;
  const li = el('li', `row ${state}${isCatch ? ' catch' : ''}${tracked ? ' tracked' : ''}`);
  const head = el('div', 'big');
  // Red counts down to (and shows) the last chance; leave-by has already passed. Missed and
  // en route count to/from the first departure.
  const firstLeg = state === 'missed' || state === 'enroute' || prev;
  const target = state === 'red' ? r.lastChance : firstLeg ? r.firstDep : r.leaveBy;
  const key = prev ? `prev:${r.key}` : rowKey(r);
  const reminder = prev ? null : reminderFor(r, now);
  const label = countdownLabel(prev ? 'missed' : state, target - now, vehicleLabel(r.legs[0]));
  if (prev) gone = r;
  head.append(el('span', null, label), el('span', 'at', formatTime(target, now)));
  // The head (and the collapsed summary) is the row's expand button; a tap anywhere on the row
  // still toggles it (the button's click bubbles to the row).
  const expanded = expandedRows.has(key);
  const toggle = el('button', 'row-toggle');
  toggle.type = 'button';
  toggle.dataset.focus = `row:${key}`;
  toggle.setAttribute('aria-expanded', String(expanded));
  const lastLeg = r.legs[r.legs.length - 1];
  toggle.setAttribute('aria-label', rowAriaLabel(label, formatTime(target, now), legTime(lastLeg, r.eta, now), !!reminder));
  toggle.append(head);
  li.append(toggle);
  li.onclick = () => {
    if (!expandedRows.delete(key)) expandedRows.add(key);
    render();
  };
  if (!expanded) {
    // Collapsed: the live/scheduled badge of the timing leg (the first leg on missed and
    // en-route rows), and the arrival under the leave time. Tap to expand for the legs.
    const shown = r.legs[firstLeg ? 0 : r.timingIdx];
    // Leg strip: the timeline's rail and dots, laid out horizontally.
    const strip = el('div', 'strip');
    for (const leg of r.legs) {
      const stop = el('span', 'stop');
      stop.append(dot(leg.color), leg.label);
      strip.append(el('span', 'seg'), stop);
    }
    strip.append(el('span', 'seg'));
    toggle.append(strip);
    const summary = el('div', 'detail summary');
    summary.append(badge(shown));
    // A reminder is set: a bell beside the badge (the header has no room to spare).
    if (reminder) {
      const bell = el('span', 'bell');
      bell.innerHTML = BELL_SVG;
      bell.setAttribute('role', 'img');
      bell.setAttribute('aria-label', 'Reminder set');
      summary.append(bell);
    }
    summary.append(el('span', 'arrive', `arrive ${legTime(lastLeg, r.eta, now)}`), chevron('▾'));
    toggle.append(summary);
    return li;
  }
  // Expanded: the timeline replaces the summary (walks, legs with their badges, transfers).
  li.append(renderTimeline(timelineSteps(prev ? { ...r, enRoute: true } : r, config.trips[tripIdx], stopSlackMinutes(config), now, tripStopNames()), now, { key }));
  // Footer: "Track this trip" (not next-day rows, nor rides already gone) and the ▴ hint.
  const foot = el('div', 'row-foot');
  if (!r.nextDay && r.firstDep > now) {
    const b = el('button', `track-btn${tracked ? ' tracking' : ''}`, tracked ? 'Tracking ✕' : 'Track this trip');
    b.type = 'button';
    b.dataset.focus = `track:${key}`;
    if (tracked) b.setAttribute('aria-label', 'Stop tracking');
    b.onclick = e => {
      e.stopPropagation();
      if (tracked) return unpinTracking();
      setEnRoute(pinTarget(enRouteState(), r, Date.now()));
      render();
      schedulePoll();
    };
    foot.append(b);
  }
  if (gone) {
    const b = gotOnButton(gone, now);
    b.addEventListener('click', e => e.stopPropagation());
    foot.append(b);
  }
  // "Notify me": a push at leave-by (and a heads-up before), once the push server exists.
  let hint = null;
  if (SERVER_API && !r.nextDay && (reminder || r.leaveBy > now)) {
    const b = el('button', `track-btn${reminder ? ' on' : ''}`);
    b.type = 'button';
    b.innerHTML = BELL_SVG;
    const times = reminder && (reminder.headsUp ? [r.leaveBy - HEADS_UP_MIN * 60_000, r.leaveBy] : [r.leaveBy]);
    b.append(reminder ? `${times.map(t => formatTime(t, now)).join(' · ')} ✕` : 'Notify me');
    b.dataset.focus = `notify:${key}`;
    if (reminder) b.setAttribute('aria-label', 'Cancel the reminder');
    b.disabled = !pushSupported || reminderBusy === key;
    b.onclick = e => {
      e.stopPropagation();
      if (reminder) unnotify(reminderKey(r)); else notify(r);
    };
    foot.append(b);
    if (!pushSupported) hint = el('div', 'push-hint', 'Add to Home Screen to get notifications.');
  }
  foot.append(chevron('▴'));
  li.append(foot);
  if (hint) li.append(hint);
  return li;
}

// ---------- leave-time reminders ----------

// The app's server API (server/, on Railway, which also serves this page; same origin). On
// localhost, tests can override it in storage; '' hides "Notify me".
const pushOverride = location.hostname === 'localhost' ? store.get('t-minus:push-server') : null;
const SERVER_API = pushOverride ?? '/api';
// iOS has push only in the Home Screen app.
const pushSupported = 'PushManager' in window && 'serviceWorker' in navigator && 'Notification' in window;
// Set reminders: { ["<trip>/<row key>"]: { id, leaveBy, headsUp, timingIdx, key } }, until their
// leave-by passes.
const KEY_REMINDERS = 't-minus:reminders';
let reminders = store.get(KEY_REMINDERS) ?? {};
let reminderBusy = null; // the row key while a request is in flight
const BELL_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';

const reminderKey = r => `${tripIdx}/${rowKey(r)}`;
// The row's reminder, while its leave-by is still ahead.
function reminderFor(r, now) {
  const rem = reminders[reminderKey(r)];
  return rem && r.leaveBy > now ? rem : null;
}
function saveReminders() {
  const now = Date.now();
  reminders = Object.fromEntries(Object.entries(reminders).filter(([, rem]) => rem.leaveBy + 30 * 60_000 > now));
  store.set(KEY_REMINDERS, reminders);
}

async function pushApi(method, path, body) {
  const res = await fetch(`${SERVER_API}${path}`, {
    method, ...(body && { headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }),
  });
  if (method === 'DELETE' && res.status === 404) return null; // already sent or expired
  if (!res.ok) throw new Error((await res.json().catch(() => null))?.error ?? `HTTP ${res.status}`);
  return res.status === 204 ? null : res.json();
}

// Setup's "Show nearby" from the push server ({ routes: [{ id, meters }] }, a few KB instead of
// up to ~230 KB of schedules); setup falls back to the MBTA when this fails or takes over 3 s.
// Auto-route's /stops and /plan (the first call after a deploy waits for the network: ~15 s).
async function planFromServer(path, params) {
  const res = await fetch(`${SERVER_API}${path}?${new URLSearchParams(params)}`, { signal: AbortSignal.timeout(30_000) });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function nearbyFromServer({ lat, lon }) {
  const res = await fetch(`${SERVER_API}/nearby?lat=${lat}&lon=${lon}`, { signal: AbortSignal.timeout(3000) });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

const base64UrlBytes = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));

// This device's push subscription (JSON). Call it straight from a tap: permission is asked
// before the first await, while the tap still counts as a user gesture (iOS requires one).
async function pushSubscription() {
  const permission = Notification.requestPermission();
  if (await permission !== 'granted') throw new Error('notifications are off for this app in Settings');
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    const { publicKey } = await pushApi('GET', '/vapid');
    sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: base64UrlBytes(publicKey) });
  }
  return sub.toJSON();
}

// Stop alerts: every tracked ride is posted to the server (which pushes before each drop-off)
// once notifications are allowed, and updated when its vehicles change.
let rideAlertBusy = false;
let rideAlertRetryAt = 0;
const stopAlertsAvailable = () => !!SERVER_API && pushSupported;
async function syncRideAlert(s, now) {
  if (!stopAlertsAvailable() || Notification.permission !== 'granted' || rideAlertBusy || now < rideAlertRetryAt) return;
  const tripIds = s.ride.legs.map(l => l.tripId).join(',');
  if (s.alert?.tripIds === tripIds) return;
  const idx = tripIdx;
  rideAlertBusy = true;
  try {
    const ride = { legs: s.ride.legs, boardedAt: s.ride.boardedAt };
    let id = s.alert?.id;
    if (id && await pushApi('PUT', `/rides/${id}`, { ride }).then(() => true, e => { if (/Not found/.test(e.message)) return false; throw e; }) === false) id = null;
    if (!id) {
      const trip = config.trips[idx];
      ({ id } = await pushApi('POST', '/rides', { subscription: await pushSubscription(), trip, tripName: trip.name, ride }));
    }
    // Still the same ride: remember the alert (else the server's copy is dropped).
    const cur = enRouteState();
    if (idx === tripIdx && cur?.ride && cur.ride.boardedAt === s.ride.boardedAt) setEnRoute({ ...cur, alert: { id, tripIds } });
    else pushApi('DELETE', `/rides/${id}`).catch(() => {});
  } catch {
    rideAlertRetryAt = Date.now() + 60_000;
  } finally {
    rideAlertBusy = false;
  }
}

// "Turn on stop alerts" (once per device): the permission prompt, then the ride is posted.
async function turnOnStopAlerts() {
  try {
    await pushSubscription();
    rideAlertRetryAt = 0;
  } catch (e) {
    showToast(`Stop alerts: ${e.message}`, 'Retry', turnOnStopAlerts);
  }
  render();
}

async function notify(r) {
  const key = rowKey(r);
  const remKey = reminderKey(r);
  const trip = config.trips[tripIdx];
  const subscription = pushSubscription();
  reminderBusy = key;
  render();
  try {
    const { id, headsUp } = await pushApi('POST', '/reminders', {
      subscription: await subscription, trip, tripName: trip.name, stopSlackMinutes: stopSlackMinutes(config),
      timingIdx: r.timingIdx, key: r.key, leaveBy: r.leaveBy,
    });
    reminders[remKey] = { id, leaveBy: r.leaveBy, headsUp, timingIdx: r.timingIdx, key: r.key };
    saveReminders();
  } catch (e) {
    showToast(`Couldn't set the reminder: ${e.message}`, 'Retry', () => notify(r));
  }
  reminderBusy = null;
  render();
}

// Setup's "Send test notification": the server sends one in 10 s.
async function testPush() {
  try {
    const subscription = await pushSubscription();
    await pushApi('POST', '/test-push', { subscription });
    showToast('Test notification in 10 s. Lock the phone to check.');
  } catch (e) {
    showToast(`Couldn't send the test: ${e.message}`, 'Retry', testPush);
  }
}

// Starting a trip (Leaving now, At the stop, I got on, boarding; not Track this trip, see
// tripStarted) cancels its reminders, silently; returns them for Undo.
function cancelTripReminders(idx) {
  const removed = Object.fromEntries(Object.entries(reminders).filter(([k]) => k.startsWith(`${idx}/`)));
  if (!Object.keys(removed).length) return removed;
  for (const k of Object.keys(removed)) delete reminders[k];
  saveReminders();
  for (const rem of Object.values(removed)) pushApi('DELETE', `/reminders/${rem.id}`).catch(() => {});
  return removed;
}

// Undo of a start: posts the cancelled reminders again (those still ahead; older entries have no key).
async function restoreReminders(idx, removed) {
  const trip = config.trips[idx];
  const due = Object.entries(removed ?? {}).filter(([, rem]) => rem.key != null && rem.leaveBy > Date.now());
  if (!trip || !due.length) return;
  try {
    const subscription = await pushSubscription();
    for (const [remKey, rem] of due) {
      const { id, headsUp } = await pushApi('POST', '/reminders', {
        subscription, trip, tripName: trip.name, stopSlackMinutes: stopSlackMinutes(config),
        timingIdx: rem.timingIdx, key: rem.key, leaveBy: rem.leaveBy,
      });
      reminders[remKey] = { ...rem, id, headsUp };
      saveReminders();
    }
  } catch (e) {
    showToast(`Couldn't set the reminder: ${e.message}`);
  }
  render();
}

async function unnotify(remKey) {
  const rem = reminders[remKey];
  delete reminders[remKey];
  saveReminders();
  render();
  try {
    await pushApi('DELETE', `/reminders/${rem.id}`);
  } catch (e) {
    reminders[remKey] = rem;
    saveReminders();
    render();
    showToast(`Couldn't cancel the reminder: ${e.message}`, 'Retry', () => unnotify(remKey));
  }
}

// Stop names of the shown trip, from the stops its schedule and prediction responses include.
function tripStopNames() {
  const c = cache[tripIdx];
  return stopNames(...(c?.schedules?.docs ?? []), ...(c?.nextDay?.docs ?? []), ...(c?.predictions ?? []));
}

// A walking figure on the timeline rail for steps that involve walking (Material
// "directions_walk", Apache 2.0).
const WALK_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7"/></svg>';
function walkStep(line, step) {
  if (!step.walking) return line;
  const icon = el('span', 'walk-icon');
  icon.innerHTML = WALK_SVG;
  line.prepend(icon);
  return line;
}

// The timeline: "Leave" and "Arrive" at the ends and each stop once, as nodes with their times;
// each ride as a bar in its route's color from its first stop to its last, with "Bus 132 · 9 min
// LIVE" between them; walks and transfers on the dotted rail. Names not known yet show "—". Long names are cut; tapping a stop
// shows it in full (kept per `key` across re-renders) without collapsing the row.
// `phase` (ride card): what's done is dimmed, the current step is bold. `along` (ride card): rows
// placed on the ridden leg's bar, before its drop-off ({ leg, rows }).
const fullStops = new Set();
function renderTimeline(steps, now, { phase = null, key = '', along = null } = {}) {
  const timeline = el('div', 'timeline');
  const n = steps.filter(s => s.kind === 'leg').length;
  const p = phase ? phase.leg : -1; // index of the leg being ridden, or the one after the transfer
  const kind = phase?.kind;
  // Walk step before leg `i` (i === n: the last walk).
  const walkState = i => !phase ? ''
    : kind === 'riding' ? (i <= p ? ' done' : '')
      : kind === 'transfer' ? (i < p ? ' done' : i === p ? ' current' : '')
        : i < n ? ' done' : ' current';
  // Leg `i`'s parts: its boarding stop, ride line, and drop-off stop.
  const legState = (i, part) => {
    if (!phase || i > p) return '';
    if (kind !== 'riding' && kind !== 'transfer') return ' done';
    if (i < p) return ' done';
    if (kind === 'riding') return part === 'from' ? ' done' : ' current';
    return part === 'from' ? ' current' : '';
  };
  const stopLine = (name, time, id, cls, leg) => {
    const line = el('div', `step stop${cls}${fullStops.has(id) ? ' full' : ''}`);
    line.append(el('span', 'node'), el('span', 'n', name ?? '—'), el('span', 't', legTime(leg, time, now)));
    if (name) {
      line.onclick = e => {
        e.stopPropagation();
        if (fullStops.has(id)) fullStops.delete(id); else fullStops.add(id);
        line.classList.toggle('full');
      };
    }
    return line;
  };
  let i = 0;
  for (const s of steps) {
    if (s.kind === 'end') {
      // "Leave 10:30pm" / "Arrive 11:16pm": a gray node with the time in the stops' column.
      const line = el('div', `step end${walkState(i)}`);
      line.append(el('span', 'node end-node'), el('span', 'n', s.label), el('span', 't', `${s.approx ? '~' : ''}${formatTime(s.time, now)}`));
      timeline.append(line);
      continue;
    }
    if (s.kind === 'walk') {
      timeline.append(walkStep(el('div', `step walk${walkState(i)}`, s.text), s));
      continue;
    }
    const leg = el('div', 'tl-leg');
    leg.style.setProperty('--c', s.leg.color ? `#${s.leg.color}` : 'var(--muted)');
    // "Orange Line · 15 min LIVE", then "toward Forest Hills" (the trip's headsign) below.
    const ride = el('div', `step ride${legState(i, 'ride')}`, `${lineLabel(s.leg)} · ${s.minutes}`);
    ride.append(badge(s.leg));
    if (s.leg.headsign) ride.append(el('div', 'toward', toward(s.leg)));
    leg.append(stopLine(s.from, s.leg.dep, `${key}/${i}/from`, legState(i, 'from'), s.leg), ride,
      ...(along?.leg === i ? along.rows : []), stopLine(s.to, s.leg.arr, `${key}/${i}/to`, legState(i, 'to'), s.leg));
    timeline.append(leg);
    i++;
  }
  return timeline;
}

// Rows expanded by a tap, by row key (the timing vehicle's trip id; next-day ids repeat).
const expandedRows = new Set();
const rowKey = r => `${r.key}${r.nextDay ? '@next' : ''}`;

let lastProblem = '';
function render() {
  const now = Date.now();
  renderToggle();
  $('refresh').hidden = !config; // nothing to refresh without trips
  $('oneoff').hidden = !config || tripIdx !== oneOffIdx();
  $('go-elsewhere').hidden = true; // shown with the rows (not while riding, nor without trips)

  const status = $('status');
  const statusText = $('status-text');
  const { lastOk, lastError, rateLimited, retryAt, mbtaDown } = cache[tripIdx] ?? {};
  // Retry after an error (not while rate limited: that retries by itself at the reset).
  $('retry-wrap').hidden = !config || !lastError || rateLimited || inFlight;
  if (!config) {
    syncWakeLock(false);
    status.className = 'status';
    statusText.textContent = 'No trips set up yet.';
    $('alerts').replaceChildren();
    $('enroute').hidden = true; // e.g. left from before the last trip was deleted
    enRouteKey = null;
    const li = el('li', 'empty');
    const btn = el('button', 'big-btn', 'Set up a trip');
    btn.type = 'button';
    btn.onclick = () => showSetup();
    const imp = el('button', 'secondary-btn', 'Import trips');
    imp.type = 'button';
    imp.onclick = () => showSetup({ importOpen: true });
    li.append(el('p', 'empty-help', NO_TRIPS_HELP), btn, imp);
    $('rows').replaceChildren(li);
    return;
  }
  if (lastError) {
    status.className = 'status stale';
    const updated = lastOk && `last updated ${formatTime(lastOk)}`;
    statusText.textContent = rateLimited && retryAt
      ? [`Rate limited · retry in ${Math.max(0, Math.ceil((retryAt - now) / 1000))} s`, updated].filter(Boolean).join(' · ')
      : lastOk ? `Stale (${lastError}) · ${updated}` : `Error: ${lastError}`;
  } else {
    // Older than two poll intervals (e.g. just back in the app): the age, in amber.
    const age = lastOk && dataAgeText(lastOk, pollIntervalMs(currentRows(now), now, !!enRouteState()?.ride), now);
    status.className = notice ? 'status stale' : age || mbtaDown ? 'status old' : 'status';
    const slow = loading?.idx === tripIdx && now - loading.since >= 5000;
    statusText.textContent = [lastOk ? `Updated ${formatTime(lastOk)}${age ? ` (${age})` : ''}` : slow ? 'Still loading… (MBTA is slow)' : 'Loading…', mbtaDown && 'MBTA down', notice,
      locationOff && usesLocation() && 'Location off', savedCopy && 'Saved copy'].filter(Boolean).join(' · ');
  }
  // Announce a new problem once, not the per-second retry count or "Updated …".
  const problem = statusProblem({ lastError, lastOk, rateLimited, notice, locationOff: locationOff && usesLocation(), savedCopy, mbtaDown });
  if (problem !== lastProblem && problem) announce(problem);
  lastProblem = problem;

  $('alerts').replaceChildren(...currentAlerts(now).map(a => {
    const li = el('li');
    li.append(el('b', null, a.effect.replaceAll('_', ' ')), el('div', null, a.header));
    return li;
  }));

  const en = syncEnRoute(now);
  syncWakeLock(en?.ride
    ? keepAwakeRiding(en.ride, tripShape(config.trips[tripIdx]).walkAfter, now, wakeMinutes(config))
    : keepAwake(currentRows(now), now, wakeMinutes(config)));
  // A new leg being ridden: fetch its stops now rather than at the next poll.
  const riding = en?.ride && ridingLeg(now);
  if (riding && cache[tripIdx]?.rideStops?.tripId !== riding.leg.tripId && rideFetchFor !== riding.leg.tripId && !inFlight) {
    rideFetchFor = riding.leg.tripId;
    setTimeout(() => refresh());
  }
  if (en?.ride) {
    syncRideAlert(en, now);
    renderEnRoute(now, false, true);
    setRows(renderRideCard(en, now));
    return;
  }
  // "Show more rides" / "Show previous rides" reset when the shown trip changes.
  if (listTrip !== tripIdx) { listTrip = tripIdx; extraRows = 0; prevOpen = false; }
  const current = currentRows(now);
  renderEnRoute(now, current.length > 0);
  // The ride being headed for: the pinned one ("Track this trip"), else en route the first
  // reachable one.
  const s = enRouteState();
  const pinnedKey = s?.pinned ? s.target?.key ?? null : null;
  const catchRow = pinnedKey != null ? current.find(r => r.key === pinnedKey && !r.nextDay)
    : current.find(r => rowState(now, r) === 'enroute');
  const prev = previousRides(config.trips[tripIdx], rideVehicles(), now);
  if (!prev.length) prevOpen = false;
  // While previous rides are shown, a missed row whose train has left is among them (one that
  // hasn't left yet stays).
  // Otherwise its expanded row has "I got on" for that ride.
  const rows = current.flatMap(r => {
    const p = r.missed && r.firstDep <= now ? prev.find(p => p.key === r.legs[0].tripId) : null;
    return p && prevOpen ? [] : [renderRow(r, now, r === catchRow, pinnedKey, p)];
  }).filter(Boolean);
  announceLeaveState(current.find(r => rowState(now, r) !== 'hidden'), now);
  const top = prev.length ? [listButton(prevOpen ? 'Hide previous rides ▴' : 'Show previous rides ▾', 'prev', () => { prevOpen = !prevOpen; render(); }),
    ...(prevOpen ? prev.map(r => renderRow(r, now, false, null, null, true)) : [])] : [];
  const more = current.length && currentRows(now, s, extraRows + 4).length > current.length
    ? [listButton('Show more rides ▾', 'more', () => { extraRows += 4; render(); })] : [];
  $('go-elsewhere').hidden = false;
  if (rows.length) setRows(...top, ...rows, ...more);
  else setRows(...top, el('li', 'empty', lastOk ? 'No upcoming departures found.' : ''));
}

// "Show previous rides" / "Show more rides": full-width buttons in the list.
let listTrip = null; // the trip the two below apply to
let extraRows = 0; // rows added by "Show more rides" (4 per tap)
let prevOpen = false; // previous rides shown
function listButton(label, key, onclick) {
  const li = el('li', 'list-item');
  const b = el('button', 'list-btn', label);
  b.type = 'button';
  b.dataset.focus = `list:${key}`;
  b.onclick = onclick;
  li.append(b);
  return li;
}

// "I got on" for a previous ride (in its expanded row, or in the expanded missed row).
function gotOnButton(r, now) {
  const first = r.legs[0];
  const b = el('button', 'track-btn', 'I got on');
  b.type = 'button';
  b.dataset.focus = `got:${r.key}`;
  b.setAttribute('aria-label', `I got on the ${formatTime(first.dep, now)} ${vehicleLabel(first)}`);
  b.onclick = () => gotOn(r);
  return b;
}

// "I got on": tracks that ride from its departure, with Undo.
function gotOn(r) {
  const snap = { idx: tripIdx, state: enRouteState() };
  prevOpen = false;
  rideNote = null;
  laterOpen = false;
  nextOpen = false;
  stopsOpen = null;
  snap.removed = setEnRoute({ kind: 'track', at: Date.now(), ride: { legs: r.legs, boardedAt: r.firstDep } });
  render();
  schedulePoll();
  showToast('Tracking started', 'Undo', () => {
    if (snap.idx !== tripIdx) setTrip(snap.idx, true);
    setEnRoute(withoutAlert(snap.state));
    restoreReminders(snap.idx, snap.removed);
    render();
    schedulePoll();
  });
}

// Replaces the rows (every render, once a second), keeping keyboard focus on the same control
// (`data-focus`) when it is still there.
function setRows(...rows) {
  const focused = document.activeElement?.dataset?.focus;
  $('rows').replaceChildren(...rows);
  if (focused) $('rows').querySelector(`[data-focus="${CSS.escape(focused)}"]`)?.focus({ preventScroll: true });
}

// Screen readers: a polite announcement (#announce), for changes that would otherwise only be seen.
function announce(text) {
  $('announce').textContent = text;
}

// The first row's leave state changing (green → amber → red → missed), e.g. "Hurry · 2 min ·
// 7:06am". A different first row (it left, or another trip) only resets the baseline.
let lastLeave = null;
function announceLeaveState(r, now) {
  if (!r) { lastLeave = null; return; }
  const state = rowState(now, r);
  const key = `${tripIdx}/${rowKey(r)}`;
  if (lastLeave?.key === key && lastLeave.state !== state) {
    const firstLeg = state === 'missed' || state === 'enroute';
    const target = state === 'red' ? r.lastChance : firstLeg ? r.firstDep : r.leaveBy;
    announce(`${countdownLabel(state, target - now, vehicleLabel(r.legs[0]))} · ${formatTime(target, now)}`);
  }
  lastLeave = { key, state };
}

// "Leaving now" / "At the stop" bar, rebuilt only when its content changes.
let enRouteKey = null;
function renderEnRoute(now, hasRows, riding = false) {
  const s = enRouteState();
  const text = s && !riding ? enRouteStatus(s, now) : '';
  const key = JSON.stringify([tripIdx, hasRows, s?.kind, text, riding]);
  if (key === enRouteKey) return;
  enRouteKey = key;
  const bar = $('enroute');
  bar.hidden = riding || (!hasRows && !s);
  bar.classList.toggle('wide', s?.kind === 'track'); // three buttons: status on its own line
  if (riding) return bar.replaceChildren();
  const btn = (label, onclick) => {
    const b = el('button', null, label);
    b.type = 'button';
    b.dataset.focus = `bar:${label}`;
    b.onclick = onclick;
    return b;
  };
  bar.replaceChildren(...(s
    ? [el('span', 'en-status', text),
      s.kind === 'track' && btn('Leaving now', () => goEnRoute('leaving')),
      (s.kind === 'leaving' || s.kind === 'track') && btn('At the stop', () => goEnRoute('stop')),
      btn('Cancel', cancelTracking)].filter(Boolean)
    : [btn('Leaving now', () => goEnRoute('leaving')), btn('At the stop', () => goEnRoute('stop'))]));
}

// Cancel (bar or trip card): ends at once, with "Undo" in a toast for 5 s.
function cancelTracking() {
  const snap = { idx: tripIdx, state: enRouteState() };
  rideNote = null;
  laterOpen = false;
  nextOpen = false;
  stopsOpen = null;
  setEnRoute(null);
  render();
  schedulePoll();
  showToast('Tracking cancelled', 'Undo', () => {
    if (snap.idx !== tripIdx) setTrip(snap.idx, true); // Cancel let autoSwitch change trips
    setEnRoute(withoutAlert(snap.state));
    render();
    schedulePoll();
  });
}

// "Tracking ✕" on the tracked row: drops only the pin (unpinTarget), with Undo.
function unpinTracking() {
  const snap = { idx: tripIdx, state: enRouteState() };
  setEnRoute(unpinTarget(snap.state));
  render();
  schedulePoll();
  showToast('Tracking cancelled', 'Undo', () => {
    if (snap.idx !== tripIdx) setTrip(snap.idx, true);
    setEnRoute(snap.state);
    render();
    schedulePoll();
  });
}

// Bottom toast with one action (or none); a new one replaces the current one.
let toastTimer = null;
function showToast(text, action, onAction) {
  const t = $('toast');
  t.querySelector('span').textContent = text;
  const b = t.querySelector('button');
  b.textContent = action ?? '';
  b.hidden = !action;
  b.onclick = () => { hideToast(); onAction(); };
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 5000);
}
function hideToast() {
  clearTimeout(toastTimer);
  $('toast').hidden = true;
}
// A tap anywhere else on the toast dismisses it.
$('toast').onclick = hideToast;

function goEnRoute(kind) {
  const now = Date.now();
  const s = startEnRoute(kind, now, tripShape(config.trips[tripIdx]).walkBefore, enRouteState());
  setEnRoute(advanceEnRoute(s, currentRows(now, s), now));
  render();
  schedulePoll(); // polls every 60 s while en route
}

// Trip card while riding: phase and live arrival, the timeline with the current step, and
// Missed it / Cancel.
let rideNote = null; // e.g. "No later connection" after Missed it
let laterOpen = false; // "Different train?" choices shown
let nextOpen = false; // "Different connection?" / transfer "Different bus?" choices shown
let stopsOpen = null; // trip id of the leg whose full stop list is shown ("… N more" tapped)
let rideFetchFor = null; // trip id whose stops were last requested outside the poll
// The ridden leg's rows on its timeline bar, before the drop-off: the vehicle ("At <stop>" while
// stopped at one, else a marker just above the next stop; none at the drop-off), then the stops
// left (shownStops: next 3, "… N more", the stop before the drop-off; "… N more" expands).
function rideStopRows(stops, tripId, now) {
  const mid = (cls, ...kids) => {
    const d = el('div', `step mid${cls}`);
    d.append(...kids);
    return d;
  };
  const rows = [];
  const v = stops.vehicle;
  if (v?.status === 'STOPPED_AT' && !v.atDropOff) rows.push(mid(' here', el('span', 'veh'), el('span', 'n', `At ${v.name}`)));
  else if (!v?.atDropOff) rows.push(mid(' gap', el('span', 'veh')));
  const open = stopsOpen === tripId;
  const toggle = (text, value) => {
    const b = el('button', null, text);
    b.type = 'button';
    b.dataset.focus = 'ride:more';
    b.onclick = e => { e.stopPropagation(); stopsOpen = value; render(); };
    return mid(' more', b);
  };
  for (const st of shownStops(stops.stops, open)) {
    if (st.more) { rows.push(toggle(`… ${st.more} more`, tripId)); continue; }
    if (st.dropOff) continue; // the timeline's drop-off row
    rows.push(mid('', el('span', 'mid-dot'), el('span', 'n', st.name), el('span', 't', formatTime(st.time, now))));
  }
  if (open && shownStops(stops.stops).length < stops.stops.length) rows.push(toggle('Show fewer', null));
  return rows;
}

function renderRideCard(s, now) {
  const trip = config.trips[tripIdx];
  const { walkAfter } = tripShape(trip);
  const ride = s.ride;
  const phase = ridePhase(ride, walkAfter, now);
  const li = el('li', `row ride ${phase.kind === 'arrived' ? 'arrived' : ''}`);
  // Riding: the stops left to the drop-off (in the timeline, below), also counted in the headline.
  const rs = cache[tripIdx]?.rideStops;
  const leg = phase.kind === 'riding' ? ride.legs[phase.leg] : null;
  const stops = (leg && rs?.tripId === leg.tripId && rideStops(rs.doc, tripShape(trip).transit[phase.leg].alight, now)) || null;
  li.append(el('div', 'ride-head', rideHeadline(phase, ride, now, stops)));
  // The next connection: spare time, tight, re-planned after a miss, or none.
  const outlook = outlookText(transferOutlook(ride, phase, rideVehicles(), tripShape(trip).transfers, now), ride, now);
  if (outlook) li.append(el('div', `ride-outlook${outlook.warn ? ' warn' : ''}`, outlook.text));
  // Timeline with the current step: the leg being ridden, the transfer before a leg, or the
  // final walk.
  const steps = timelineSteps({ legs: ride.legs, eta: phase.eta, enRoute: true }, trip, 0, now, tripStopNames());
  const along = stops && stops.stops.length ? { leg: phase.leg, rows: rideStopRows(stops, leg.tripId, now) } : null;
  li.append(renderTimeline(steps, now, { phase, key: `ride:${ride.legs[0].tripId}`, along }));
  if (rideNote) li.append(el('div', 'msg', rideNote));
  const btns = el('div', 'enroute-bar ride-btns');
  const btn = (label, onclick) => {
    const b = el('button', null, label);
    b.type = 'button';
    b.dataset.focus = `ride:${label}`;
    b.onclick = e => { e.stopPropagation(); onclick(); };
    return b;
  };
  if (phase.kind !== 'arrived' && stopAlertsAvailable() && Notification.permission === 'default') {
    const b = btn('Turn on stop alerts', turnOnStopAlerts);
    b.innerHTML = `${BELL_SVG}Turn on stop alerts`;
    b.classList.add('alerts-btn');
    btns.append(b);
  }
  if (canUndoBoarding(ride, phase, now)) btns.append(btn('Missed it', () => missedIt(phase)));
  // "Different train?": vehicles of this leg that left in the last 15 min, earlier or later.
  const later = phase.kind === 'riding' ? otherVehicles(rideVehicles()[phase.leg] ?? [], ride.legs[phase.leg], now) : [];
  if (later.length) {
    const noun = vehicleNoun(ride.legs[phase.leg]);
    btns.append(btn(laterOpen ? `Keep this ${noun}` : `Different ${noun}?`, () => { laterOpen = !laterOpen; render(); }));
  }
  // The next leg ("Different connection?" while riding, from the arrival; in the transfer "I'm at
  // the stop" = the first departure from now, and "Different bus?"): the rider's pick sticks.
  const { transfers } = tripShape(trip);
  const nl = phase.kind === 'transfer' ? phase.leg : phase.kind === 'riding' && phase.leg + 1 < ride.legs.length ? phase.leg + 1 : -1;
  const choices = nl < 0 ? [] : connectionChoices(rideVehicles()[nl] ?? [], ride.legs[nl], phase.kind === 'transfer' ? now : ride.legs[phase.leg].arr);
  const pickNext = v => {
    nextOpen = false;
    rideNote = null;
    setEnRoute({ ...s, ride: switchLeg(ride, nl, v, rideVehicles(), transfers) });
    render();
    schedulePoll();
  };
  if (phase.kind === 'transfer' && choices[0] && choices[0].dep < ride.legs[nl].dep) btns.append(btn("I'm at the stop", () => pickNext(choices[0])));
  if (choices.length) {
    const noun = vehicleNoun(ride.legs[nl]);
    const [open, closed] = phase.kind === 'transfer' ? [`Keep this ${noun}`, `Different ${noun}?`] : ['Keep this connection', 'Different connection?'];
    btns.append(btn(nextOpen ? open : closed, () => { nextOpen = !nextOpen; render(); }));
  }
  btns.append(phase.kind === 'arrived'
    ? btn('Done', () => {
      rideNote = null; laterOpen = false; nextOpen = false; stopsOpen = null; setEnRoute(null);
      if (tripIdx === oneOffIdx()) return removeOneOff(false); // a one-off ends with its ride
      render(); schedulePoll();
    })
    : btn('Cancel trip', cancelTracking));
  li.append(btns);
  if (laterOpen && later.length) {
    const pick = el('div', 'enroute-bar ride-btns');
    for (const v of later) {
      pick.append(btn(`${vehicleLabel(onVehicle(ride.legs[phase.leg], v))} ${legTime(v, v.dep, now)}`, () => {
        laterOpen = false;
        nextOpen = false;
        setEnRoute({ ...s, ride: switchLeg(ride, phase.leg, v, rideVehicles(), tripShape(trip).transfers) });
        render();
      }));
    }
    li.append(pick);
  }
  if (nextOpen && choices.length) {
    const pick = el('div', 'enroute-bar ride-btns');
    for (const v of choices) pick.append(btn(`${vehicleLabel(onVehicle(ride.legs[nl], v))} ${legTime(v, v.dep, now)}`, () => pickNext(v)));
    li.append(pick);
  }
  return li;
}

// "Missed it": on the first leg, back to waiting at the stop; on a later leg, the next vehicle
// of that leg and the earliest connections after it.
function missedIt(phase) {
  const now = Date.now();
  const s = enRouteState();
  if (!s?.ride) return;
  rideNote = null;
  if (phase.leg === 0) {
    setEnRoute({ kind: 'stop', at: now, atStop: now });
  } else {
    const trip = config.trips[tripIdx];
    const { transit, transfers } = tripShape(trip);
    const c = cache[tripIdx];
    const vehicles = tripVehicles(transit, transit.map((l, i) => mergeTrips(c?.predictions?.[i], c?.schedules?.docs[i])), c?.lastLive, now);
    const missed = s.ride.legs[phase.leg];
    const chain = replanFrom(vehicles, phase.leg, now, transfers, missed.tripId);
    if (!chain) rideNote = 'No later connection.';
    else {
      const legs = s.ride.legs.map((l, i) => {
        const v = chain[i - phase.leg];
        return v ? onVehicle(l, v) : l;
      });
      setEnRoute({ ...s, ride: { ...s.ride, legs } });
    }
  }
  render();
  schedulePoll();
}

// Screen Wake Lock: keeps the screen on near leave-by (keepAwake), and while riding near a
// drop-off or the next leg's departure (keepAwakeRiding). The OS drops the lock while
// the page is hidden; the next render re-requests it. Errors (unsupported, Low Power Mode) are
// ignored.
let wakeLock = null;
let wakeWanted = false;
let wakeRequesting = false;
function syncWakeLock(want) {
  wakeWanted = want;
  if (!navigator.wakeLock) return;
  if (want && (!wakeLock || wakeLock.released) && !wakeRequesting) {
    wakeRequesting = true;
    navigator.wakeLock.request('screen')
      .then(l => { wakeLock = l; if (!wakeWanted) syncWakeLock(false); })
      .catch(() => {})
      .finally(() => { wakeRequesting = false; });
  } else if (!want && wakeLock && !wakeLock.released) {
    wakeLock.release().catch(() => {});
    wakeLock = null;
  }
}
// Some browsers only grant the lock after a user gesture.
document.addEventListener('pointerdown', () => syncWakeLock(wakeWanted));

// A manual choice holds until the next trip window starts (see pickTrip).
function setTrip(i, manual) {
  if (manual) store.set(KEY_OVERRIDE, { index: i, setAt: Date.now() });
  if (i === tripIdx) return;
  tripIdx = i;
  store.set(KEY_LAST_TRIP, i);
  render();
  refresh();
}

// ---------- setup ----------

// Polling and rendering pause while setup is open; saving there replaces the config.
function showSetup({ importOpen = false, plan = false } = {}) {
  if (setupView) return;
  clearTimeout(pollTimer);
  hideToast();
  $('app').hidden = true;
  setupView = openSetup({
    root: $('setup'),
    config: savedConfig,
    api,
    timingFor: i => cache[i]?.timing ?? null,
    toast: showToast,
    hideToast,
    testPush: SERVER_API ? { supported: pushSupported, send: testPush } : null,
    nearby: SERVER_API ? nearbyFromServer : null,
    planApi: SERVER_API ? planFromServer : null,
    onClose: closeSetup,
    onReset: resetApp,
    startImport: importOpen,
    onPlan: plan ? trip => { setOneOff(trip); closeSetup(); } : null,
    // Each trip saves on its own while setup stays open.
    onSave(cfg, warning) {
      savedConfig = cfg;
      config = withOneOff(cfg);
      store.set(KEY_CONFIG, cfg);
      store.del(KEY_OVERRIDE);
      store.del(KEY_EN_ROUTE);
      cache = {};
      lastTiming.clear();
      notice = warning;
      tripIdx = config ? chooseTrip(Date.now(), null, located()) : 0;
      if (config) locate(); // the saved trips may now use location
    },
  });
}

// ---------- one-off trip ----------

// A trip's reminders, en-route state (and its stop alerts on the server) and cached data, dropped;
// returns { state, reminders } for Undo.
function dropTripState(idx) {
  const all = store.get(KEY_EN_ROUTE) ?? {};
  const state = all[idx] ?? null;
  if (state?.alert?.id) pushApi('DELETE', `/rides/${state.alert.id}`).catch(() => {});
  delete all[idx];
  store.set(KEY_EN_ROUTE, all);
  const removed = cancelTripReminders(idx);
  delete cache[idx];
  lastTiming.delete(idx);
  return { state, reminders: removed };
}

// "Go somewhere else…" picked a way: it replaces any one-off and is shown.
function setOneOff(trip) {
  if (oneOffIdx() >= 0) dropTripState(oneOffIdx());
  oneOff = { trip, at: Date.now() };
  store.set(KEY_ONE_OFF, oneOff);
  config = withOneOff(savedConfig);
  tripIdx = oneOffIdx();
}

// ✕ Remove (with Undo), or silently once its ride is over.
function removeOneOff(undo = true) {
  const idx = oneOffIdx();
  if (idx < 0) return;
  const prev = oneOff;
  const dropped = dropTripState(idx);
  oneOff = null;
  store.del(KEY_ONE_OFF);
  config = withOneOff(savedConfig);
  tripIdx = config ? chooseTrip(Date.now(), store.get(KEY_OVERRIDE), located()) : 0;
  render();
  if (config) refresh({ force: !cache[tripIdx] });
  if (!undo) return;
  showToast('One-off trip removed', 'Undo', () => {
    oneOff = prev;
    store.set(KEY_ONE_OFF, prev);
    config = withOneOff(savedConfig);
    tripIdx = oneOffIdx();
    if (dropped.state) {
      const all = store.get(KEY_EN_ROUTE) ?? {};
      all[tripIdx] = withoutAlert(dropped.state);
      store.set(KEY_EN_ROUTE, all);
    }
    restoreReminders(tripIdx, dropped.reminders);
    render();
    refresh({ force: true });
  });
}

// Save: the one-off becomes the last saved trip (same index, so its state carries over).
function saveOneOff() {
  if (!oneOff) return;
  savedConfig = { ...(savedConfig ?? {}), trips: [...(savedConfig?.trips ?? []), oneOff.trip] };
  store.set(KEY_CONFIG, savedConfig);
  oneOff = null;
  store.del(KEY_ONE_OFF);
  config = withOneOff(savedConfig);
  render();
  showToast('Trip saved');
}
$('oneoff-save').onclick = saveOneOff;
$('oneoff-remove').onclick = () => removeOneOff();

// Setup's "Delete all trips and settings": cancels pending reminders, clears everything the app
// stored except the API key (and the tests' push-server override), and reloads to first run.
function resetApp(apiKey) {
  for (const rem of Object.values(reminders)) pushApi('DELETE', `/reminders/${rem.id}`).catch(() => {});
  try {
    for (const k of Object.keys(localStorage)) if (k.startsWith('t-minus:') && k !== 't-minus:push-server') localStorage.removeItem(k);
  } catch {}
  if (apiKey) store.set(KEY_CONFIG, { trips: [], apiKey });
  location.reload();
}

function closeSetup() {
  hideToast(); // setup's Undo works only in setup
  setupView?.close();
  setupView = null;
  $('app').hidden = false;
  render();
  refresh({ force: !cache[tripIdx] });
}

$('open-setup').onclick = () => showSetup();
$('go-elsewhere').onclick = () => showSetup({ plan: true });

// ---------- timers ----------

$('refresh').onclick = () => refresh({ force: true });

// Pull-to-refresh: a downward drag that starts at the top of the main list moves it down
// (pullOffset); released past PULL_READY, it refreshes and holds a gap until the header ↻ stops.
let pull = null; // { x, y, dy, active } for the current touch
let pullHeld = false;

function setPull(offset, text, settle) {
  const ptr = $('ptr');
  $('app').classList.toggle('settling', settle);
  $('app').style.transform = offset ? `translateY(${offset}px)` : '';
  ptr.style.opacity = Math.min(1, offset / PULL_READY);
  ptr.classList.toggle('busy', pullHeld);
  ptr.classList.toggle('ready', !pullHeld && offset >= PULL_READY);
  if (text != null) ptr.querySelector('.ptr-text').textContent = text;
}

document.addEventListener('touchstart', e => {
  pull = null;
  if (!config || setupView || pullHeld || e.touches.length !== 1 || scrollY > 0 || $('toast').contains(e.target)) return;
  pull = { x: e.touches[0].clientX, y: e.touches[0].clientY, dy: 0, active: false };
}, { passive: true });

document.addEventListener('touchmove', e => {
  if (!pull) return;
  const t = e.touches[0];
  const dx = t.clientX - pull.x;
  const dy = t.clientY - pull.y;
  // The first move decides: upward or sideways is ordinary scrolling, left alone.
  if (!pull.active && (e.touches.length !== 1 || dy <= 0 || Math.abs(dx) > dy)) { pull = null; return; }
  pull.active = true;
  e.preventDefault();
  pull.dy = dy;
  const offset = pullOffset(dy);
  setPull(offset, offset >= PULL_READY ? 'Release to refresh' : 'Pull down to refresh', false);
}, { passive: false });

document.addEventListener('touchend', () => {
  const p = pull;
  pull = null;
  if (!p?.active) return;
  if (pullOffset(p.dy) < PULL_READY) { setPull(0, null, true); return; }
  pullHeld = true;
  setPull(PULL_HOLD, 'Refreshing…', true);
  refresh({ force: true });
  whenIdle(() => { pullHeld = false; setPull(0, null, true); });
});

document.addEventListener('touchcancel', () => {
  if (pull?.active) setPull(0, null, true);
  pull = null;
});
$('retry').onclick = () => { $('retry-wrap').hidden = true; refresh(); };

// Location for "near" trips: the last fix, re-taken on launch and on return to the app.
let here = null;
let locationOff = false;
let savedCopy = false; // this page came from the service worker's cache
const usesLocation = () => !!config?.trips.some(t => t.near === true);
const located = () => (here && config ? pickByLocation(config.trips, here) : -1);

function locate() {
  if (!usesLocation() || !navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => {
    here = { lat: p.coords.latitude, lon: p.coords.longitude };
    locationOff = false;
    autoSwitch();
  }, () => {
    locationOff = true;
    render();
  }, { enableHighAccuracy: false, maximumAge: 5 * 60_000, timeout: 10_000 });
}

// Switches to the trip pickTrip chooses (a window starting, a location fix), but not away from
// a trip with an active "Leaving now" / "At the stop".
function autoSwitch() {
  if (!config || setupView) return;
  const t = enRouteState() ? tripIdx : chooseTrip(Date.now(), store.get(KEY_OVERRIDE), located());
  if (t !== tripIdx) setTrip(t, false);
  else render();
}

setInterval(() => {
  if (document.hidden || setupView) return;
  autoSwitch();
}, 1000);

document.addEventListener('visibilitychange', () => {
  if (document.hidden) clearTimeout(pollTimer);
  else {
    checkForUpdate();
    if (!setupView) { refresh(); locate(); }
  }
});

// A Home Screen app resumed from the background keeps running the page it loaded: on each
// return and every 30 min, fetch the page (the service worker saves it, so Reload is quick)
// and show "New version available" if its footer version differs. Not at launch (just loaded).
const RUNNING_VERSION = pageVersion(document.documentElement.outerHTML);
let updateFound = false;
let lastUpdateCheck = Date.now();
async function checkForUpdate() {
  if (updateFound || document.hidden || Date.now() - lastUpdateCheck < 60_000) return;
  lastUpdateCheck = Date.now();
  try {
    const res = await fetch('./', { cache: 'no-store' });
    if (res.ok && isNewerPage(await res.text(), RUNNING_VERSION)) {
      updateFound = true;
      $('newversion').hidden = false;
    }
  } catch { /* offline: try again next time */ }
}
setInterval(checkForUpdate, 30 * 60_000);

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  // The service worker says whether this page came from its cache (server slow or failing) and
  // whether a newer page has been saved since.
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data?.type !== 'nav') return;
    savedCopy = e.data.cached;
    $('newversion').hidden = !e.data.updated && !updateFound;
    render();
  });
  navigator.serviceWorker.controller?.postMessage('nav-status');
}
$('reload-new').onclick = () => location.reload();
// iOS Safari applies :active on touch only when a touch listener exists.
document.addEventListener('touchstart', () => {}, { passive: true });

window.appStarted = true;
render();
if (config) { refresh({ force: true }); locate(); } // no trips: the empty state (Set up a trip / Import trips)
</script>
</body>
</html>
