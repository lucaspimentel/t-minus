<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>T-Minus</title>
<meta name="apple-mobile-web-app-title" content="T-Minus">
<meta name="theme-color" content="#f5f5f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  [hidden] { display: none !important; }
  :root {
    color-scheme: light dark; /* native controls (time pickers, checkboxes) follow the theme */
    --bg: #f5f5f3; --card: #ffffff; --text: #1c1f24; --muted: #6b7078; --border: #dcdde0;
    --green: #1b7f45; --amber: #a35f00; --red: #c62828; --accent: #ed8b00;
    --accent-text: #a85a00; /* the accent as text on white (4.5:1); fills keep --accent */
    --alert-bg: #fff4e0; --alert-border: #f0c070;
    --press: rgba(0, 0, 0, .07); /* pressed overlay */
    --map-water: #dbe7f0; --map-land: var(--card); --map-line: var(--border); /* the route map's base map */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417; --card: #1c1f24; --text: #eceef1; --muted: #9aa0a8; --border: #2e333a;
      --green: #4cc47f; --amber: #f0a830; --red: #ff6b6b; --accent: #ed8b00; --accent-text: #ed8b00;
      --alert-bg: #2e2515; --alert-border: #6b5220;
      --press: rgba(255, 255, 255, .09);
      --map-water: #0c1520; --map-land: #22262c; --map-line: #3a4048;
    }
  }
  * { box-sizing: border-box; }
  /* No double-tap zoom (iOS Safari ignores user-scalable=no for pinch zoom). No rubber-band
     bounce: the main list has its own pull-to-refresh. */
  /* No iOS text inflation: a too-wide line made the whole picker larger (2026-11-02). */
  html { touch-action: manipulation; overscroll-behavior-y: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent; /* the :active styles below replace iOS's gray flash */
    /* iOS blurs content right under the status bar. The standalone app starts below it (no
       status-bar-style meta), so the inset is 0 there; the 22px does the work. */
    padding: calc(env(safe-area-inset-top, 0px) + 22px) 16px max(16px, env(safe-area-inset-bottom));
  }
  main { max-width: 480px; margin: 0 auto; }
  /* Pressed: buttons darken and shrink a little; rows only darken (an inset overlay works on any
     background). A button pressed inside a row doesn't also darken the row. */
  button { transition: transform 80ms; }
  button:not(:disabled):active { box-shadow: inset 0 0 0 100vmax var(--press); transform: scale(.97); }
  .row:not(.ride):active:not(:has(button:active)) { box-shadow: inset 0 0 0 100vmax var(--press); }
  header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .toggle { display: flex; flex-wrap: wrap; flex: 1; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .toggle button {
    flex: 1 1 auto; padding: 10px 6px; border: 0; background: var(--card); color: var(--muted);
    font: inherit; font-size: 14px; cursor: pointer;
  }
  .toggle button[aria-pressed="true"] { background: var(--accent); color: #1c1f24; font-weight: 600; }
  .toggle select {
    flex: 1; min-width: 0; padding: 10px; border: 0; background: var(--card); color: var(--text);
    font: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .icon-btn {
    width: 44px; height: 44px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--card); color: var(--text); font-size: 20px; cursor: pointer;
  }
  #refresh.busy span { display: inline-block; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #refresh.busy span { animation: none; opacity: .4; } }
  /* Pull-to-refresh: sits above the header (height = PULL_HOLD) and comes into view as #app moves down. */
  .ptr {
    height: 48px; margin-top: -48px; display: flex; align-items: center; justify-content: center; gap: 8px;
    color: var(--muted); font-size: 14px; opacity: 0;
  }
  /* ↓ while pulling, turning to ↑ at the ready point; a spinning ring while refreshing. */
  .ptr-icon { display: inline-flex; transition: transform 150ms; }
  .ptr-icon svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .ptr.ready .ptr-icon { transform: rotate(180deg); }
  .ptr-ring { display: none; width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--muted); border-radius: 50%; }
  .ptr.busy .ptr-icon { display: none; }
  .ptr.busy .ptr-ring { display: block; animation: spin .8s linear infinite; }
  /* Setup's waiting lines ("Finding ways…"): the pull-to-refresh ring, at text height, before the text. */
  .wait { display: flex; align-items: center; gap: 8px; }
  .wait-ring { flex: none; width: 1em; height: 1em; border: 2px solid var(--border); border-top-color: var(--muted); border-radius: 50%; animation: spin .8s linear infinite; }
  #app.settling { transition: transform 200ms ease-out; }
  #app.settling .ptr { transition: opacity 200ms; }
  @media (prefers-reduced-motion: reduce) {
    .ptr-icon { transition: none; }
    .ptr.busy .ptr-ring { animation: none; opacity: .4; }
    .wait-ring { animation: none; opacity: .4; }
  }
  /* At the bottom, just above the version. */
  .status { font-size: 13px; color: var(--muted); margin: 16px 0 0; min-height: 18px; text-align: center; }
  .plan-btn { margin-bottom: 12px; } /* "Plan a trip…", under the trip buttons */
  /* A one-off trip: a banner under the trip buttons, above "Plan a trip…". */
  .enroute-bar.oneoff-banner { margin: 0 0 12px; padding: 8px 8px 8px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); }
  .status.stale { color: var(--red); }
  .status.old { color: var(--amber); }
  .status .link {
    padding: 0; border: 0; background: none; color: inherit; font: inherit;
    text-decoration: underline; cursor: pointer; box-shadow: none !important; transform: none !important;
  }
  .alerts { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 8px; }
  .alerts li {
    background: var(--alert-bg); border: 1px solid var(--alert-border); border-radius: 10px;
    padding: 8px 12px; font-size: 14px;
  }
  .alerts b { font-size: 12px; letter-spacing: .03em; }
  .rows { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .row {
    background: var(--card); border: 1px solid var(--border); border-left: 6px solid var(--border);
    border-radius: 12px; padding: 12px 14px;
  }
  /* Only the target (.catch: the ride the app answers with, or the belled one) is green, in every
     mode; later reachable rows are neutral (the .row border, the text color). Amber (to the last chance)
     and red (missed, still to leave) keep their color on any row; .catch never overrides them. */
  .row.catch.green, .row.catch.enroute { border-left-color: var(--green); }
  .row.amber { border-left-color: var(--amber); }
  .row.hurry { border-left-color: var(--amber); }
  .big {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0 8px;
    font-size: 28px; font-weight: 700;
  }
  /* The countdown never breaks; if the time would drop below a long countdown ("Departs in
     1h 26m"), the countdown steps down (fit1, then fit2: fitHeads); only if it still doesn't fit
     (a next-day "Thu 5:31am" at 360 px) does the time drop to the next line, still right-aligned. */
  .big > span { white-space: nowrap; }
  .big.fit1 > span:first-child { font-size: .86em; } /* 28px → 24px */
  .big.fit2 > span:first-child { font-size: .72em; } /* 28px → 20px */
  .big .at { font-size: 20px; font-weight: 600; margin-left: auto; }
  /* Equal-width digits in the time columns only, so times line up down a list; elsewhere the
     wide tabular "1" would gap names like "Bus 132". */
  .step .t, .big .at { font-variant-numeric: tabular-nums; }
  .catch.green .big, .catch.enroute .big { color: var(--green); }
  .amber .big { color: var(--amber); }
  .hurry .big { color: var(--amber); }
  .row.missed { border-left-color: var(--muted); }
  .row.prev { border-left-color: var(--muted); }
  .row.prev + .row:not(.prev) { margin-top: 22px; } /* previous rides apart from the rest */
  .prev .big { color: var(--muted); font-size: 20px; }
  .list-btn {
    display: block; width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--card); color: var(--text); font: inherit; font-size: 14px; cursor: pointer;
  }
  .list-item.pair { display: flex; gap: 8px; } /* "Show more rides" beside "Show fewer rides" */
  .missed .big { color: var(--muted); font-size: 20px; }
  .row.missed.departs { border-left-color: var(--red); }
  /* Still to leave (often the ride being headed for): full size; smaller once gone. */
  .missed.departs .big { color: var(--red); font-size: 28px; }
  .none .big { color: var(--muted); font-size: 20px; }
  .detail { color: var(--muted); font-size: 14px; }
  .dot {
    display: inline-block; width: .7em; height: .7em; border-radius: 50%; margin-right: .35em;
    vertical-align: baseline; box-shadow: 0 0 0 1px rgb(0 0 0 / .25);
  }
  .tag { white-space: nowrap; }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase;
    padding: 1px 6px; border-radius: 6px; border: 1px solid var(--border); margin-left: 6px; vertical-align: 2px;
  }
  .badge.live { border-color: var(--green); color: var(--green); }
  .row { cursor: pointer; }
  /* The row's expand button: looks like the row it sits in. */
  .row-toggle {
    display: block; width: 100%; padding: 0; margin: 0; border: 0; background: none; color: inherit;
    font: inherit; text-align: inherit; cursor: inherit; border-radius: 6px;
  }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .row-toggle:focus-visible { outline-offset: 4px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .strip { display: flex; align-items: center; margin: 4px 0 2px; font-size: 14px; white-space: nowrap; overflow: hidden; }
  .strip .seg { flex: 0 0 16px; height: 2px; background: var(--border); }
  .strip .seg:first-child, .strip .seg:last-child { flex-basis: 10px; }
  .strip .stop { margin-right: 6px; }
  .strip .dot { margin-right: 4px; vertical-align: -1px; }
  .row.ride { cursor: default; border-left-color: var(--green); }
  .row.ride.arrived { border-left-color: var(--border); }
  .row.ride.amber { border-left-color: var(--amber); }
  .row.ride.red { border-left-color: var(--red); }
  .row.ride.red .big { color: var(--red); }
  .row.ride:not(.amber):not(.red) .big { color: var(--green); }
  .ride-head { font-size: 20px; font-weight: 700; color: var(--green); }
  .row.ride.arrived .ride-head { color: var(--text); }
  .step.current { color: var(--text); font-weight: 600; }
  .row.tracked { outline: 2px solid var(--green); outline-offset: -2px; }
  .chev { color: var(--muted); font-size: 20px; line-height: 1; margin-left: 6px; }
  .row-foot { display: flex; align-items: center; margin-top: 10px; }
  .row-foot .chev { margin-left: auto; }
  .track-btn {
    padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); color: var(--text); font: inherit; font-size: 14px; cursor: pointer;
  }
  .track-btn.tracking { color: var(--green); border-color: var(--green); }
  .row-foot { gap: 8px; }
  .alerts-btn svg { width: 15px; height: 15px; vertical-align: -2px; margin-right: 5px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .track-btn svg { width: 15px; height: 15px; vertical-align: -2px; margin-right: 5px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .track-btn.on { background: var(--green); color: var(--card); border-color: var(--green); font-weight: 600; }
  .track-btn:disabled { opacity: .5; cursor: default; }
  .push-hint { margin-top: 6px; font-size: 13px; color: var(--muted); }
  /* The bell is on with notifications: a bell beside the collapsed row's badge. */
  .summary .bell { display: inline-flex; color: var(--green); margin-left: 6px; }
  .summary .bell svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ride-outlook { margin-top: 6px; font-size: 14px; color: var(--muted); }
  .ride-outlook.warn { color: var(--amber); font-weight: 600; }
  .ride-outlook.late { color: var(--red); }
  /* Ride card: the stops left along the ridden leg's bar (small dots), and the vehicle on it. */
  .tl-leg .step.mid::after { top: 0; bottom: 0; }
  .step.mid { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; padding-top: 2px; padding-bottom: 2px; }
  .step.mid .n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step.mid .t { flex: none; }
  .mid-dot { position: absolute; left: 3px; top: calc(2px + .55em); width: 4px; height: 4px; border-radius: 50%; background: var(--card); z-index: 1; }
  .step.mid.here { font-weight: 600; }
  .step.mid.gap { height: 16px; padding: 0; }
  .veh {
    position: absolute; left: -4px; width: 18px; height: 18px; border-radius: 50%; background: var(--c);
    border: 3px solid var(--card); box-shadow: 0 0 0 1px var(--c); box-sizing: border-box; z-index: 2;
  }
  .step.mid.here .veh { top: calc(2px + .2em); }
  .step.mid.gap .veh { top: -1px; }
  .step.mid.more button {
    padding: 0; border: 0; background: none; color: var(--muted); font: inherit; font-size: 13px;
    text-decoration: underline; cursor: pointer; box-shadow: none !important; transform: none !important;
  }
  .enroute-bar.ride-btns { margin: 12px 0 0; }
  /* Auto-route options: cards like the rows (setup). */
  .setup button.row-toggle { padding: 0; border: 0; border-radius: 6px; background: none; font-size: inherit; }
  .row.option .opt-head { display: block; font-size: 20px; }
  #plan-options { margin-top: 6px; grid-template-columns: minmax(0, 1fr); } /* long stop names cut, not widen */
  .toast {
    position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 10;
    max-width: 360px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px;
    background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .18); font-size: 15px;
  }
  .toast { cursor: pointer; }
  .toast span { flex: 1; }
  .toast button {
    padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--card);
    color: var(--green); font: inherit; font-weight: 600; cursor: pointer;
  }
  .summary { display: flex; justify-content: space-between; align-items: center; gap: 0 8px; }
  .summary .badge { margin-left: 0; }
  .arrive { margin-left: auto; white-space: nowrap; }
  /* Expanded row: steps under a divider, joined by a rail through the route dots. */
  .timeline { position: relative; border-top: 1px solid var(--border); margin-top: 8px; padding-top: 6px; }
  /* Walking parts of the rail: dotted; each ride draws its own bar over it (.tl-leg). */
  .timeline::before {
    content: ''; position: absolute; left: 4px; top: 14px; bottom: 12px; border-left: 2px dotted var(--border);
  }
  .step { position: relative; padding: 3px 0 3px 22px; }
  .step.walk { font-size: 13px; color: var(--muted); }
  .tl-leg { position: relative; }
  /* The ride's bar, in three pieces so it runs node to node even when a long name wraps: from
     the boarding stop's node down, through the ride line, down to the drop-off's node. */
  .tl-leg .step::after { content: ''; position: absolute; left: 1px; width: 8px; background: var(--c); }
  .tl-leg .step.stop:first-child::after { top: calc(8px + .35em); bottom: 0; border-radius: 4px 4px 0 0; }
  .tl-leg .step.ride::after { top: 0; bottom: 0; }
  .tl-leg .step.stop:last-child::after { top: 0; height: calc(8px + .35em); border-radius: 0 0 4px 4px; }
  .step.stop, .step.end { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; }
  .step.stop { cursor: pointer; }
  .step.stop .n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step.stop.full .n { white-space: normal; }
  .step.stop .t, .step.end .t { flex: none; }
  .node.end-node { background: var(--muted); border-color: var(--muted); }
  .node {
    position: absolute; left: 0; top: calc(3px + .35em); width: 10px; height: 10px; border-radius: 50%;
    background: var(--card); border: 2px solid var(--c); box-sizing: border-box; z-index: 1;
  }
  .step.ride { font-size: 13px; color: var(--muted); padding-top: 4px; padding-bottom: 4px; }
  .step.ride .toward { font-size: 12px; }
  .step.ride .train { font-size: 12px; color: var(--muted); }
  .step.ride .leg-alert {
    margin-top: 4px; padding: 4px 8px; font-size: 13px; color: var(--text); font-weight: normal;
    background: var(--alert-bg); border: 1px solid var(--alert-border); border-radius: 8px;
  }
  .step .flag { color: var(--amber); font-weight: 600; }
  /* Passed steps: muted text (still 4.5:1), faded node, bar and walking figure. */
  .step.done { color: var(--muted); }
  .step.done > .node, .step.done::after, .step.done .walk-icon svg { opacity: .4; }
  .step.walk.current, .step.ride.current { color: var(--text); }
  /* Walking figure on the rail (centered on it, like the route dots); the card color masks the rail. */
  .walk-icon {
    position: absolute; left: -3px; top: 3px; width: 16px; height: 18px; display: flex; align-items: center; justify-content: center;
    background: var(--card); color: var(--muted);
  }
  .walk-icon svg { width: 14px; height: 14px; fill: currentColor; }
  .step.current .walk-icon { color: var(--text); }
  .empty { color: var(--muted); padding: 16px 0; }
  .enroute-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: -4px 0 12px; font-size: 14px; color: var(--muted); }
  .enroute-bar button {
    padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); color: var(--text); font: inherit; font-size: 14px; cursor: pointer;
  }
  .en-status { flex: 1 1 0; min-width: 0; }
  .enroute-bar.wide .en-status { flex-basis: 100%; }
  .version { color: var(--muted); font-size: 12px; text-align: center; margin-top: 20px; }
  /* Reload prompts: a 44 px target. The new-version card sits above the footer version. */
  .big-btn { min-height: 44px; padding: 0 22px; font-size: 17px; font-weight: 600; border-radius: 12px;
    background: var(--accent); border: 1px solid var(--accent); color: #1c1f24; }
  #loadfail .big-btn { display: block; margin-top: 8px; }
  .update-card { margin-top: 20px; border: 1px solid var(--accent); border-radius: 14px; padding: 14px; text-align: center; }
  .update-card .t { font-weight: 600; margin-bottom: 10px; }
  .update-card .big-btn { width: 100%; }
  .empty .big-btn { width: 100%; }
  .empty-help { margin: 0 0 12px; }
  .empty .secondary-btn { width: 100%; min-height: 44px; margin-top: 10px; border-radius: 12px; cursor: pointer;
    background: var(--card); border: 1px solid var(--border); color: var(--text); font: inherit; font-size: 17px; font-weight: 600; }
  /* Setup view (setup.js) */
  .setup button {
    padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font: inherit; font-size: 14px; cursor: pointer;
  }
  .setup button.primary { background: var(--accent); color: #1c1f24; border-color: var(--accent); font-weight: 600; }
  .setup button.danger { color: var(--red); }
  /* Setup's "Pending notifications" (debug). */
  .setup .card.pn { padding: 10px 12px; }
  .pn + .pn { margin-top: 8px; }
  .pn .k { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .pn .t1 { font-weight: 600; margin-top: 2px; }
  .pn-line { font-size: 14px; margin-top: 4px; display: flex; gap: 8px; }
  .pn-line .w, .pn-log .w { color: var(--muted); min-width: 58px; flex: none; font-variant-numeric: tabular-nums; }
  .pn .ok, .pn-log .ok { color: var(--green); }
  .pn .bad, .pn-log .bad { color: var(--red); }
  .pn .det { font-size: 13px; color: var(--muted); margin-top: 6px; overflow-wrap: anywhere; }
  .pn-foot { display: flex; justify-content: flex-end; margin-top: 8px; }
  .setup .card.pn.warn { border-color: var(--alert-border); background: var(--alert-bg); }
  .pn-log { font-size: 14px; }
  .pn-log .e { display: flex; gap: 8px; padding: 6px 0; border-top: 1px solid var(--border); }
  .pn-log .e:first-child { border-top: 0; }
  .pn-clear { margin-top: 12px; }
  .setup button:disabled { opacity: .5; }
  .setup-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    /* When stuck, its own top padding keeps the buttons out of the blurred strip. */
    position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); padding: 22px 0 10px; margin-top: -22px; z-index: 1;
  }
  /* Picker: header, context line and search stick together; the header inside is a plain block. */
  .picker-top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 1; background: var(--bg);

// Timing leg from schedules only (predictions would make it flicker), with hysteresis.
function updateTiming(idx, trip, c) {
  const { transit } = tripShape(trip);
  const headways = transit.map((l, i) => averageHeadway(legVehicles(mergeTrips(null, c.schedules?.docs[i]), l)));
  c.timing = pickTimingLeg(headways, lastTiming.get(idx), trip.timingLeg);
  lastTiming.set(idx, c.timing);
}

async function refresh({ force = false } = {}) {
  if (!config) { render(); return; }
  if (setupView) return;
  if (inFlight) { pending = true; return; }
  inFlight = true;
  clearTimeout(pollTimer);
  const idx = tripIdx;
  const trip = config.trips[idx];
  const c = (cache[idx] ??= { lastLive: loadLive(store.get(KEY_LAST_LIVE), liveKey(tripShape(trip).transit), Date.now()) });
  const now = Date.now();
  if (!$('refresh').classList.contains('busy')) spinStart = now;
  $('refresh').classList.add('busy');
  if (!c.lastOk) loading = { idx, since: now };
  const served = (proxyAge = { age: 0 });
  try {
    const tasks = [fetchPredictions(trip).then(p => {
      c.predictions = p;
      const { transit } = tripShape(trip);
      c.lastLive = rememberLive(c.lastLive, transit.map((l, i) => legVehicles(mergeTrips(p[i], null), l)), Date.now());
      store.set(KEY_LAST_LIVE, storeLive(store.get(KEY_LAST_LIVE), liveKey(transit), c.lastLive, Date.now()));
    })];
    if (force || !c.schedules || now - c.schedules.at > SCHEDULE_TTL) {
      // Look further ahead when more departures are shown (60-min midday headways).
      // 30 min back keeps a just-missed ride (shown up to 5 min after it leaves) in the data.
      const w = scheduleWindow(now, 30, Math.max(360, 90 * departureCount(config)));
      tasks.push(fetchSchedules(trip, w).then(s => { c.schedules = s; updateTiming(idx, trip, c); }));
    }
    if (force || !c.alerts || now - c.alerts.at > ALERT_TTL) {
      tasks.push(fetchAlerts(trip).then(a => { c.alerts = a; }));
    }
    // While riding: one more request for the vehicle's remaining stops (a failure only hides them).
    const riding = ridingLeg(now);
    if (riding) {
      const tripId = riding.leg.tripId;
      tasks.push(fetchRideStops(tripId)
        .then(doc => { c.rideStops = { tripId, doc, at: Date.now() }; })
        .catch(() => { c.rideStops = { tripId, doc: null, at: Date.now() }; }));
    }
    await Promise.all(tasks);
    // Once today's service is running out, fetch the next service day's morning schedule.
    const next = nextServiceWindow(now);
    if (c.schedules?.coversEndOfService &&
        rowsFor(trip, c.timing, c.predictions, c.schedules?.docs, now, c.lastLive).length < departureCount(config) &&
        (!c.nextDay || c.nextDay.date !== next.date || now - c.nextDay.at > NEXT_DAY_TTL)) {
      c.nextDay = await fetchSchedules(trip, next);
    }
    // A stale copy from the proxy (the MBTA is down): the data's own time.
    c.lastOk = Date.now() - served.age;
    c.mbtaDown = served.age > 0;
    c.lastError = null;
    c.failures = 0;
    c.rateLimited = false;
  } catch (e) {
    c.lastError = e.message || String(e);
    c.failures = (c.failures ?? 0) + 1;
    c.rateLimited = !!e.rateLimited;
  } finally {
    proxyAge = null;
    inFlight = false;
    loading = null;
    // Stops only at the end of a full turn (SPIN_MS, as in the CSS), so it never snaps back.
    const spun = Date.now() - spinStart;
    setTimeout(() => {
      if (inFlight) return;
      $('refresh').classList.remove('busy');
      for (const cb of idleWaiters.splice(0)) cb();
    }, Math.max(1, Math.ceil(spun / SPIN_MS)) * SPIN_MS - spun);
  }
  render();
  if (pending) { pending = false; return refresh(); }
  schedulePoll();
}

// Runs cb once refreshing is over (after any queued refresh), as the header ↻ stops.
function whenIdle(cb) {
  if ($('refresh').classList.contains('busy')) idleWaiters.push(cb);
  else cb();
}

function schedulePoll() {
  clearTimeout(pollTimer);
  if (document.hidden || !config) return;
  const now = Date.now();
  const normal = pollIntervalMs(currentRows(now), now, !!enRouteState()?.ride);
  // After an error: back off from 10 s (or wait for the rate limit's reset).
  const c = cache[tripIdx];
  const delay = !c?.lastError ? normal : c.rateLimited ? rateLimitDelayMs(now) : retryDelayMs(c.failures, normal);
  if (c) c.retryAt = c.lastError ? now + delay : null;
  pollTimer = setTimeout(() => refresh(), delay);
}

// ---------- compute + render ----------

function rowsFor(trip, timing, predictionDocs, scheduleDocs, now, lastLive = null, enRoute = null, count = departureCount(config)) {
  if (!predictionDocs && !scheduleDocs) return [];
  const { transit } = tripShape(trip);
  const vehicles = tripVehicles(transit, transit.map((l, i) => mergeTrips(predictionDocs?.[i], scheduleDocs?.[i])), lastLive, now);
  const alerts = trainAlerts(cache[config.trips.indexOf(trip)], now);
  return tripRows(trip, vehicles, timing ?? 0, now, stopSlackMinutes(config), count, enRoute).map(r => withTripAlerts(r, alerts));
}
// Per-train alerts ("Train 2317 is 10 min late") by trip id: the trip's /alerts and the ones
// its predictions name.
const trainAlerts = (c, now) => tripAlerts([c?.alerts?.doc, ...(c?.predictions ?? [])], now);

// En route state of the shown trip (dropped if the trip at that index was renamed/replaced).
function enRouteState() {
  const s = (store.get(KEY_EN_ROUTE) ?? {})[tripIdx];
  return s && config?.trips[tripIdx]?.name === s.name ? s : null;
}
// Returns the reminders a start of the trip cancelled ({ [remKey]: rem }; see restoreReminders).
function setEnRoute(state) {
  const all = store.get(KEY_EN_ROUTE) ?? {};
  const prev = all[tripIdx];
  const bell = state?.bell && !state.ride;
  let removed = {};
  if (tripStarted(state) && !tripStarted(prev)) {
    if (bell) startReminders(tripIdx, state.atStop);
    else removed = cancelTripReminders(tripIdx);
  }
  if (prev?.bell && !prev.ride && !bell) removed = { ...removed, ...dropReminders(tripIdx) };
  // Stop alerts follow a ride: none without one; a replaced or ended one is deleted on the server.
  if (state && !state.ride && state.alert) state = withoutAlert(state);
  const prevAlert = all[tripIdx]?.alert?.id;
  if (prevAlert && prevAlert !== state?.alert?.id) pushApi('DELETE', `/rides/${prevAlert}`).catch(() => {});
  if (state) all[tripIdx] = { ...state, name: config.trips[tripIdx].name };
  else delete all[tripIdx];
  store.set(KEY_EN_ROUTE, all);
  return removed;
}

// A restored state (Undo) re-posts its ride: the server's copy was deleted.
function withoutAlert(state) {
  if (!state?.alert) return state;
  const { alert: _, ...rest } = state;
  return rest;
}

// Today's rows, topped up from the next service day. Days are computed separately
// because GTFS trip ids repeat across days. En route (before boarding), rows follow the
// at-stop time.
function currentRows(now, enRoute = enRouteState(), extra = extraRows) {
  if (!config) return [];
  const trip = config.trips[tripIdx];
  const c = cache[tripIdx];
  if (!c) return [];
  const count = departureCount(config) + extra;
  // Rows follow the at-stop time only after "Leaving now" / "At the stop" (not plain tracking).
  const en = enRoute?.ride || enRoute?.kind === 'track' ? null : enRoute;
  const today = rowsFor(trip, c.timing, c.predictions, c.schedules?.docs, now, c.lastLive, en, count);
  // En route, the next service day's rides don't apply (you're heading out now).
  if (en || today.length >= count || !c.nextDay || !c.schedules?.coversEndOfService) return today;
  return fillRows(today, rowsFor(trip, c.timing, null, c.nextDay.docs, now), count);
}

// Advances the en-route state (boarding, live leg times) and ends it when it's over. Returns
// the active state, or null.
function syncEnRoute(now) {
  let s = enRouteState();
  if (!s || !config) return null;
  const before = JSON.stringify(s);
  const trip = config.trips[tripIdx];
  const { transit, walkAfter } = tripShape(trip);
  const c = cache[tripIdx];
  if (!s.ride) s = advanceEnRoute(s, currentRows(now, s), now);
  if (s.ride && c) {
    const maps = transit.map((l, i) => mergeTrips(c.predictions?.[i], c.schedules?.docs[i]));
    let ride = { ...s.ride, legs: trackLegs(s.ride.legs, transit, maps, c.lastLive) };
    // A connection that no longer works is re-planned; what was missed shows until boarding.
    const phase = ridePhase(ride, walkAfter, now);
    const o = transferOutlook(ride, phase, rideVehicles(), tripShape(trip).transfers, now);
    if (o?.missedDep != null) ride = { ...ride, legs: o.legs, missed: { leg: o.leg, dep: o.missedDep } };
    else if (o?.earlier) ride = { ...ride, legs: o.legs };
    if (ride.missed && (phase.leg > ride.missed.leg || (phase.kind === 'riding' && phase.leg === ride.missed.leg))) {
      const { missed: _, ...rest } = ride;
      ride = rest;
    }
    s = { ...s, ride };
  }
  if (!enRouteActive(s, walkAfter, now)) {
    setEnRoute(null);
    if (s.ride && tripIdx === oneOffIdx()) setTimeout(() => removeOneOff(false)); // its ride is over
    return null;
  }
  if (JSON.stringify(s) !== before) setEnRoute(s);
  return s;
}

// Per-leg vehicles of the shown trip (predictions + schedules, remembered live times).
function rideVehicles() {
  const c = cache[tripIdx];
  const { transit } = tripShape(config.trips[tripIdx]);
  return tripVehicles(transit, transit.map((l, i) => mergeTrips(c?.predictions?.[i], c?.schedules?.docs[i])), c?.lastLive, Date.now());
}

function currentAlerts(now) {
  const c = cache[tripIdx];
  if (!config || !c?.alerts) return [];
  const { routes, stops } = commuteEntities(config.trips[tripIdx]);
  const parents = childToParentMap(...(c.predictions ?? []), ...(c.schedules?.docs ?? []));
  return filterAlerts(c.alerts.doc, routes, expandStops(stops, parents), now);
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

// LIVE / SCHEDULED, or "every 6 min" (styled as scheduled) on a subway leg with no predictions.
function badge(leg) {
  return el('span', `badge ${leg.source}`, sourceText(leg));
}

// Two trips: side-by-side buttons. More: a dropdown. Rebuilt only when the trips or the
// selection change, so a periodic render doesn't close an open dropdown.
let toggleKey = null;
function renderToggle() {
  const t = $('toggle');
  const trips = config?.trips ?? [];
  const key = JSON.stringify([trips.map(x => x.name), tripIdx, oneOffIdx()]);
  if (key === toggleKey) return;
  toggleKey = key;
  t.hidden = trips.length < 2;
  if (trips.length > 2) {
    const select = el('select');
    select.setAttribute('aria-label', 'Trip');
    select.append(...trips.map((trip, i) => {
      const o = el('option', null, i === oneOffIdx() ? `${trip.name} (one-off)` : trip.name);
      o.value = String(i);
      o.selected = i === tripIdx;
      return o;
    }));
    select.onchange = () => setTrip(Number(select.value), true);
    t.replaceChildren(select);
    return;
  }
  t.replaceChildren(...trips.map((trip, i) => {
    const b = el('button', null, trip.name);
    b.setAttribute('aria-pressed', String(i === tripIdx));
    b.onclick = () => setTrip(i, true);
    return b;
  }));
}

// Route color dot (stored on the leg at save time; none for configs saved before that).
function dot(color) {
  if (!color) return '';
  const d = el('span', 'dot');
  d.style.background = `#${color}`;
  return d;
}

// Expand/collapse hint at a row's bottom-right (the row has aria-expanded).
function chevron(ch) {
  const c = el('span', 'chev', ch);
  c.setAttribute('aria-hidden', 'true');
  return c;
}

// `gone`: a missed row's ride from previousRides once its first vehicle has left ("I got on").
// A previous ride (`prev`) is drawn the same way: "Missed · left 3 min ago", its first departure,
// the timeline from boarding, and "I got on" in the expanded footer.
function renderRow(r, now, isCatch, pinnedKey = null, gone = null, prev = false) {
  const state = prev ? 'prev' : rowState(now, r);
  if (state === 'hidden') return null;
  const tracked = pinnedKey != null && isCatch;
  // Missed but still to leave ("Departs in 2 min"): red until the vehicle leaves.
  const departs = state === 'missed' && r.firstDep > now;
  const li = el('li', `row ${state}${departs ? ' departs' : ''}${isCatch ? ' catch' : ''}${tracked ? ' tracked' : ''}`);
  const head = el('div', 'big');
  // The leave-by until it passes, then the first departure (CLAUDE.md "UI rules"): hurry, missed
  // and en route count to/from it.
  const firstLeg = state === 'hurry' || state === 'missed' || state === 'enroute' || prev;
  const target = firstLeg ? r.firstDep : r.leaveBy;
  const key = prev ? `prev:${r.key}` : rowKey(r);
  const reminder = prev ? null : reminderFor(r);
  const label = countdownLabel(prev ? 'missed' : state, target - now);
  if (prev) gone = r;
  // The spaces between spans (not rendered in the flex rows) keep the words apart in the
  // button's text, which must read in order inside its name (rowAriaLabel).
  head.append(el('span', null, label), ' ', el('span', 'at', formatTime(target, now)));
  // The head (and the collapsed summary) is the row's expand button; a tap anywhere on the row
  // still toggles it (the button's click bubbles to the row).
  const expanded = expandedRows.has(key);
  const toggle = el('button', 'row-toggle');
  toggle.type = 'button';
  toggle.dataset.focus = `row:${key}`;
  toggle.setAttribute('aria-expanded', String(expanded));
  const lastLeg = r.legs[r.legs.length - 1];
  // The collapsed row's badge: the timing leg's (the first leg's on missed and en-route rows).
  const shown = r.legs[firstLeg ? 0 : r.timingIdx];
  const details = [...r.legs.map(l => l.label), sourceText(shown)];
  toggle.setAttribute('aria-label', rowAriaLabel(label, formatTime(target, now), legTime(lastLeg, r.eta, now), !!reminder, details));
  toggle.append(head, ' ');
  li.append(toggle);
  li.onclick = () => {
    if (!expandedRows.delete(key)) expandedRows.add(key);
    render();
  };
  if (!expanded) {
    // Collapsed: the live/scheduled badge of the timing leg, and the arrival under the leave
    // time. Tap to expand for the legs.
    // Leg strip: the timeline's rail and dots, laid out horizontally.
    const strip = el('div', 'strip');
    for (const leg of r.legs) {
      const stop = el('span', 'stop');
      stop.append(dot(leg.color), leg.label);
      strip.append(el('span', 'seg'), stop, ' ');
    }
    strip.append(el('span', 'seg'));
    toggle.append(strip, ' ');
    const summary = el('div', 'detail summary');
    summary.append(badge(shown), ' ');
    // A reminder is set: a bell beside the badge (the header has no room to spare).
    if (reminder) {
      const bell = el('span', 'bell');
      bell.innerHTML = BELL_SVG;
      bell.setAttribute('role', 'img');
      bell.setAttribute('aria-label', 'Reminder set');
      summary.append(bell, ' ');
    }
    summary.append(el('span', 'arrive', `arrive ${legTime(lastLeg, r.eta, now)}`), chevron('▾'));
    toggle.append(summary);
    return li;
  }
  // Expanded: the timeline replaces the summary (walks, legs with their badges, transfers).
  li.append(renderTimeline(timelineSteps(prev ? { ...r, enRoute: true } : r, config.trips[tripIdx], stopSlackMinutes(config), now, tripStopNames(), legStopCounts(r, config.trips[tripIdx])), now, { key }));
  // Footer: the bell ("🔔 Track": pins the ride and sets its reminders; not next-day rows, nor
  // rides already gone), "I got on", and the ▴ hint.
  const foot = el('div', 'row-foot');
  let hint = null;
  if (!r.nextDay && (tracked || r.firstDep > now)) {
    const b = el('button', `track-btn${tracked ? ' on' : ''}`);
    b.type = 'button';
    b.innerHTML = BELL_SVG;
    b.append(tracked ? 'Tracking' : 'Track');
    b.dataset.focus = `track:${key}`;
    b.setAttribute('aria-pressed', String(tracked));
    b.disabled = reminderBusy === key;
    b.onclick = e => {
      e.stopPropagation();
      if (tracked) bellOff(); else bellOn(r);
    };
    foot.append(b);
    if (tracked && !reminder && !canNotify()) {
      hint = el('div', 'push-hint', `Notifications are off: tracking in the app only.${pushSupported ? '' : ' Add to Home Screen to get them.'}`);
    }
  }
  if (gone) {
    const b = gotOnButton(gone, now);
    b.addEventListener('click', e => e.stopPropagation());
    foot.append(b);
  }
  foot.append(chevron('▴'));
  li.append(foot);
  if (hint) li.append(hint);
  return li;
}

// ---------- leave-time reminders ----------

// The app's server API (server/, on Railway, which also serves this page; same origin). On
// localhost, tests can override it in storage; '' turns the bell's notifications off.
const pushOverride = location.hostname === 'localhost' ? store.get('t-minus:push-server') : null;
const SERVER_API = pushOverride ?? '/api';
// The iOS app (IOS.md): this page in a WKWebView with Capacitor's bridge (`window.Capacitor`).
// There, pushes come from APNs (the PushNotifications plugin; the subscription is
// `{ endpoint: 'apns:<token>' }`), the screen stays on through the app's own plugin
// (TMinus.keepAwake), and errors go to the server's app log (per device, setup's "Pending
// notifications"). Elsewhere `native` is false and none of this runs.
const native = !!window.Capacitor?.isNativePlatform?.();
const plugins = native ? window.Capacitor.Plugins : {};
const KEY_DEVICE = 't-minus:device';
const KEY_APNS = 't-minus:apns-token';
function deviceId() {
  let id = store.get(KEY_DEVICE);
  if (!id) { id = crypto.randomUUID(); store.set(KEY_DEVICE, id); }
  return id;
}
function nativeLog(source, message) {
  if (!native || !SERVER_API) return;
  fetch(`${SERVER_API}/log`, {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ device: deviceId(), source, message: String(message).slice(0, 500) }),
  }).catch(() => {});
}
// Notification permission as the web API names it: 'granted', 'denied' or 'default'.
let nativePermission = 'default';
const permissionOf = state => (state === 'granted' || state === 'denied' ? state : 'default');
const notifyPermission = () => (native ? nativePermission : Notification.permission);
if (native) {
  plugins.PushNotifications.checkPermissions()
    .then(p => { nativePermission = permissionOf(p.receive); render(); }, e => nativeLog('push', `checkPermissions: ${e.message}`));
}
// The device token from iOS (asks for permission the first time). Registering again is cheap
// and returns the current token, which iOS may change. `quiet`: no prompt and no permission
// needed (a ride followed only for its Live Activity; iOS gives a token without permission).
async function apnsToken({ quiet = false } = {}) {
  const P = plugins.PushNotifications;
  if (!quiet) {
    nativePermission = permissionOf((await P.requestPermissions()).receive);
    if (nativePermission !== 'granted') throw new Error('notifications are off for this app in Settings');
  }
  let handles = [];
  const token = await new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error('no device token from iOS in 10 s')), 10_000);
    const settle = (f, v) => { clearTimeout(timer); f(v); };
    Promise.all([
      P.addListener('registration', t => settle(resolve, String(t.value).toLowerCase())),
      P.addListener('registrationError', e => settle(reject, new Error(`registration failed: ${e.error ?? 'unknown'}`))),
    ]).then(h => { handles = h; return P.register(); }).catch(e => settle(reject, e));
  }).finally(() => { for (const h of handles) h.remove(); });
  store.set(KEY_APNS, token);
  return token;
}

// iOS has push only in the Home Screen app (or the iOS app).
const pushSupported = native || ('PushManager' in window && 'serviceWorker' in navigator && 'Notification' in window);
// The bell's reminders: { ["<trip>/<row key>"]: { id, leaveBy, dep, headsUps, timingIdx, key, bell } },
// until the boarding question closes (ASK_MINUTES after the departure).
const KEY_REMINDERS = 't-minus:reminders';
let reminders = store.get(KEY_REMINDERS) ?? {};
// Reminders from before the bell ("Notify me", no pin) are cancelled.
for (const [k, rem] of Object.entries(reminders)) {
  if (rem.bell) continue;
  delete reminders[k];
  if (SERVER_API) fetch(`${SERVER_API}/reminders/${rem.id}`, { method: 'DELETE' }).catch(() => {});
}
let reminderBusy = null; // the row key while a request is in flight
const BELL_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';

const reminderKey = r => `${tripIdx}/${rowKey(r)}`;
// The row's reminder (the bell's, with notifications).
function reminderFor(r) {
  return reminders[reminderKey(r)] ?? null;
}
// Notifications can be set: the server, push, and permission not refused.
const canNotify = () => !!SERVER_API && pushSupported && notifyPermission() !== 'denied';
function saveReminders() {
  const now = Date.now();
  reminders = Object.fromEntries(Object.entries(reminders).filter(([, rem]) => (rem.dep ?? rem.leaveBy) + ASK_MINUTES * 60_000 > now));
  store.set(KEY_REMINDERS, reminders);
}

async function pushApi(method, path, body) {
  const res = await fetch(`${SERVER_API}${path}`, {
    method, ...(body && { headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }),
  });
  if (method === 'DELETE' && res.status === 404) return null; // already sent or expired
  if (!res.ok) throw new Error((await res.json().catch(() => null))?.error ?? `HTTP ${res.status}`);
  return res.status === 204 ? null : res.json();
}

// Setup's "Show nearby" from the push server ({ routes: [{ id, meters }] }, a few KB instead of
// up to ~230 KB of schedules); setup falls back to the MBTA when this fails or takes over 3 s.
// Auto-route's /stops and /plan (the first call after a deploy waits for the network: ~15 s).
async function planFromServer(path, params) {
  const res = await fetch(`${SERVER_API}${path}?${new URLSearchParams(params)}`, { signal: AbortSignal.timeout(30_000) });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function nearbyFromServer({ lat, lon }) {
  const res = await fetch(`${SERVER_API}/nearby?lat=${lat}&lon=${lon}`, { signal: AbortSignal.timeout(3000) });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

const base64UrlBytes = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));

// This device's push subscription (JSON). Call it straight from a tap: permission is asked
// before the first await, while the tap still counts as a user gesture (iOS requires one).
async function pushSubscription() {
  if (native) {
    try {
      return { endpoint: `apns:${await apnsToken()}` };
    } catch (e) {
      nativeLog('push', e.message);
      throw e;
    }
  }
  const permission = Notification.requestPermission();
  if (await permission !== 'granted') throw new Error('notifications are off for this app in Settings');
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    const { publicKey } = await pushApi('GET', '/vapid');
    sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: base64UrlBytes(publicKey) });
  }
  return sub.toJSON();
}

// Stop alerts: every tracked ride is posted to the server (which pushes before each drop-off)
// once notifications are allowed, and updated when its vehicles change.
let rideAlertBusy = false;
let rideAlertRetryAt = 0;
const stopAlertsAvailable = () => !!SERVER_API && pushSupported;
async function syncRideAlert(s, now) {
  if (!stopAlertsAvailable() || rideAlertBusy || now < rideAlertRetryAt) return;

  // iOS app, for its Live Activity (alerts: false when only for that).

    const subscription = await currentSubscription();
    if (subscription) await pushApi('POST', '/pending/clear', { subscription });
    for (const e of localPushEntries()) dropLocalPush(e.id);
  },
};

// Starting a trip without the bell on (boarding, I got on; see tripStarted) cancels its
// reminders, silently; returns them for Undo.
function cancelTripReminders(idx) {
  const removed = Object.fromEntries(Object.entries(reminders).filter(([k]) => k.startsWith(`${idx}/`)));
  if (!Object.keys(removed).length) return removed;
  for (const k of Object.keys(removed)) delete reminders[k];
  saveReminders();
  // `reason=started`: the server keeps a leave card (the app turns it into the walk card).
  for (const rem of Object.values(removed)) pushApi('DELETE', `/reminders/${rem.id}?reason=started`).catch(() => {});
  adoptLeaveCards(idx, removed);
  return removed;
}

// Undo of a start: posts the cancelled reminders again (those whose ride hasn't left; older
// entries have no key).
async function restoreReminders(idx, removed) {
  const trip = config.trips[idx];
  const due = Object.entries(removed ?? {}).filter(([, rem]) => rem.key != null && (rem.dep ?? rem.leaveBy) > Date.now());
  if (!trip || !due.length) return;
  try {
    const subscription = await pushSubscription();
    const startToken = await liveStartToken();
    for (const [remKey, rem] of due) {
      const { id, headsUps } = await pushApi('POST', '/reminders', {
        subscription, trip, tripName: trip.name, stopSlackMinutes: stopSlackMinutes(config),
        timingIdx: rem.timingIdx, key: rem.key, leaveBy: rem.leaveBy, ...(rem.dep != null && { dep: rem.dep }), ...(startToken && { startToken }),
      });
      reminders[remKey] = { ...rem, id, headsUps };
      saveReminders();
    }
  } catch (e) {
    showToast(`Couldn't set the reminder: ${e.message}`);
  }
  render();
}

// "Leaving now" / "At the stop" with the bell on: its reminder stops the leave alerts (the card
// becomes the walk card) and, at the departure, asks only if the at-stop time missed it.
function startReminders(idx, atStop) {
  const mine = Object.fromEntries(Object.entries(reminders).filter(([k]) => k.startsWith(`${idx}/`)));
  for (const rem of Object.values(mine)) pushApi('PUT', `/reminders/${rem.id}`, { started: { atStop } }).catch(() => {});
  adoptLeaveCards(idx, mine);
}
// The bell went off (off, Cancel, answered, unanswered): the trip's reminders are deleted and
// their cards end. Returns them for Undo.
function dropReminders(idx) {
  const removed = Object.fromEntries(Object.entries(reminders).filter(([k]) => idx == null || k.startsWith(`${idx}/`)));
  if (!Object.keys(removed).length) return removed;
  for (const k of Object.keys(removed)) delete reminders[k];
  saveReminders();
  endLeaveCards(new Set(Object.values(removed).map(rem => rem.id)));
  for (const rem of Object.values(removed)) pushApi('DELETE', `/reminders/${rem.id}`).catch(() => {});
  return removed;
}

// The bell on: pins the ride, one bell at a time (any other trip's goes off), and sets its
// reminders where notifications work. Called straight from the tap (notify asks permission).
function bellOn(r) {
  const all = store.get(KEY_EN_ROUTE) ?? {};
  for (const [k, s] of Object.entries(all)) {
    if (Number(k) === tripIdx || !s?.bell || s.ride) continue;
    const rest = unpinTarget(s);
    if (rest) all[k] = rest; else delete all[k];
  }
  store.set(KEY_EN_ROUTE, all);
  dropReminders(null);
  setEnRoute(pinTarget(enRouteState(), r, Date.now()));
  render();
  schedulePoll();
  // Past the leave-by too (a late bell): the server starts the card at "Departs in" and asks.
  if (canNotify() && r.firstDep > Date.now()) notify(r);
}
function bellOff() {
  setEnRoute(unpinTarget(enRouteState()));
  render();
  schedulePoll();
}

// Auto-bell (DESIGN.md "Auto-bell"): the saved trips' schedules go to the server, which bells
// them. Sent when they (or the subscription, the start token, the stop slack) change, and daily.
// `prompt`: from setup's Save, where notifications may be asked for.
const KEY_AUTO_BELLS = 't-minus:auto-bells'; // { sent (the request as JSON), at }
async function syncAutoBells(prompt = false) {
  if (!SERVER_API || !pushSupported) return;
  const trips = autoBellTrips(savedConfig);
  const last = store.get(KEY_AUTO_BELLS);
  if (!trips.length && !last) return;
  try {
    const subscription = prompt && trips.length ? await pushSubscription() : await currentSubscription();
    if (!subscription) return;
    const startToken = await liveStartToken();
    const body = { subscription, ...(startToken && { startToken }), stopSlackMinutes: stopSlackMinutes(savedConfig), trips };
    const json = JSON.stringify(body);
    if (last?.sent === json && Date.now() - last.at < 24 * 3600_000) return;
    await pushApi('PUT', '/auto-bells', body);
    if (trips.length) store.set(KEY_AUTO_BELLS, { sent: json, at: Date.now() }); else store.del(KEY_AUTO_BELLS);
  } catch (e) {
    if (prompt) showToast(`Couldn't set the auto-bell: ${e.message}`, 'Retry', () => syncAutoBells(true));
  }
}
// The bells the server set: shown as if belled here (the pin and its reminder). A trip already
// under way keeps its state, and the server's bell is deleted. False when the server couldn't
// be asked (the iOS app's card cleanup then waits).
async function adoptBells() {
  if (!SERVER_API || !pushSupported || !config) return true;
  let bells;
  try {
    const subscription = await currentSubscription();
    if (!subscription) return true;
    ({ bells } = await pushApi('POST', '/bells', { subscription }));
  } catch { return false; }
  const known = new Set(Object.values(reminders).map(r => r.id));
  const all = store.get(KEY_EN_ROUTE) ?? {};
  let changed = false;
  for (const b of bells ?? []) {
    if (known.has(b.id)) continue;
    const trip = config.trips[b.index];
    if (trip?.name !== b.tripName) continue;
    const cur = all[b.index]?.name === trip.name ? all[b.index] : null;
    // Under way, riding, or belled here already (hand wins): the server's bell goes.
    if (cur && (cur.ride || tripStarted(cur) || cur.bell)) { pushApi('DELETE', `/reminders/${b.id}?reason=started`).catch(() => {}); continue; }
    // One bell at a time (as bellOn).
    for (const [k, s] of Object.entries(all)) {
      if (!s?.bell || s.ride) continue;
      const rest = unpinTarget(s);
      if (rest) all[k] = rest; else delete all[k];
    }
    all[b.index] = { ...pinTarget(cur, { key: b.key, legs: b.legs }, Date.now()), name: trip.name };
    reminders[`${b.index}/${b.key}`] = { id: b.id, leaveBy: b.leaveBy, dep: b.dep, headsUps: b.headsUps, timingIdx: b.timingIdx, key: b.key, bell: true, auto: true };
    changed = true;
  }
  if (!changed) return true;
  store.set(KEY_EN_ROUTE, all);
  saveReminders();
  render();
  schedulePoll();
  return true;
}

// Stop names of the shown trip, from the stops its schedule and prediction responses include.
function tripStopNames() {
  const c = cache[tripIdx];
  return stopNames(...(c?.schedules?.docs ?? []), ...(c?.nextDay?.docs ?? []), ...(c?.predictions ?? []));
}

// A walking figure on the timeline rail for steps that involve walking (Material
// "directions_walk", Apache 2.0).
const WALK_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7"/></svg>';
function walkStep(line, step) {
  if (!step.walking) return line;
  const icon = el('span', 'walk-icon');
  icon.innerHTML = WALK_SVG;
  line.prepend(icon);
  return line;
}

// The timeline: "Leave" and "Arrive" at the ends and each stop once, as nodes with their times;
// each ride as a bar in its route's color from its first stop to its last, with "Bus 132 · 9 min
// LIVE" between them; walks and transfers on the dotted rail. Names not known yet show "—". Long names are cut; tapping a stop
// shows it in full (kept per `key` across re-renders) without collapsing the row.
// `phase` (ride card): what's done is dimmed, the current step is bold. `along` (ride card): rows
// placed on the ridden leg's bar, before its drop-off ({ leg, rows }).
const fullStops = new Set();
function renderTimeline(steps, now, { phase = null, key = '', along = null } = {}) {
  const timeline = el('div', 'timeline');
  const n = steps.filter(s => s.kind === 'leg').length;
  const p = phase ? phase.leg : -1; // index of the leg being ridden, or the one after the transfer
  const kind = phase?.kind;
  // Walk step before leg `i` (i === n: the last walk).
  const walkState = i => !phase ? ''
    : kind === 'riding' ? (i <= p ? ' done' : '')
      : kind === 'transfer' ? (i < p ? ' done' : i === p ? ' current' : '')
        : i < n ? ' done' : ' current';
  // Leg `i`'s parts: its boarding stop, ride line, and drop-off stop.
  const legState = (i, part) => {
    if (!phase || i > p) return '';
    if (kind !== 'riding' && kind !== 'transfer') return ' done';
    if (i < p) return ' done';
    if (kind === 'riding') return part === 'from' ? ' done' : ' current';
    return part === 'from' ? ' current' : '';
  };
  const stopLine = (name, time, id, cls, leg, at) => {
    const line = el('div', `step stop${cls}${fullStops.has(id) ? ' full' : ''}`);
    const n = el('span', 'n', name ?? '—');
    // "Malden Center · Flag stop": tell the crew to stop there.
    if (name && flagStop(leg, at)) n.append(' · ', el('span', 'flag', flagStop(leg, at)));
    line.append(el('span', 'node'), n, el('span', 't', time == null ? '' : legTime(leg, time, now)));
    if (name) {
      line.onclick = e => {
        e.stopPropagation();
        if (fullStops.has(id)) fullStops.delete(id); else fullStops.add(id);
        line.classList.toggle('full');
      };
    }
    return line;
  };
  let i = 0;
  for (const s of steps) {
    if (s.kind === 'end') {
      // "Leave 10:30pm" / "Arrive 11:16pm": a gray node with the time in the stops' column.
      const line = el('div', `step end${walkState(i)}`);
      line.append(el('span', 'node end-node'), el('span', 'n', s.label), el('span', 't', s.time == null ? '' : `${s.approx ? '~' : ''}${formatTime(s.time, now)}`));
      timeline.append(line);
      continue;
    }
    if (s.kind === 'walk') {
      timeline.append(walkStep(el('div', `step walk${walkState(i)}`, s.text), s));
      continue;
    }
    const leg = el('div', 'tl-leg');
    leg.style.setProperty('--c', s.leg.color ? `#${s.leg.color}` : 'var(--muted)');
    // "Orange Line · 13 stops · 15 min LIVE" (stops when known), then "toward Forest Hills" (the
    // trip's headsign) below; none on the leg being ridden (2026-11-06: the headsign matters only
    // before boarding; the leg's last row names the drop-off). Untimed (an auto-route option in
    // setup): no minutes.
    const ride = el('div', `step ride${legState(i, 'ride')}`, rideLine(s));
    if (s.leg.source) ride.append(badge(s.leg));
    if (s.leg.headsign && !(kind === 'riding' && i === p)) ride.append(el('div', 'toward', toward(s.leg)));
    // Commuter rail: "Train 2317 · Track 5", and the train's own alerts.
    const train = [s.leg.train && `Train ${s.leg.train}`, s.leg.track && `Track ${s.leg.track}`].filter(Boolean).join(' · ');
    if (train) ride.append(el('div', 'train', train));
    for (const a of s.leg.alerts ?? []) ride.append(el('div', 'leg-alert', a));
    leg.append(stopLine(s.from, s.leg.dep, `${key}/${i}/from`, legState(i, 'from'), s.leg, 'board'), ride,
      ...(along?.leg === i ? along.rows : []), stopLine(s.to, s.leg.arr, `${key}/${i}/to`, legState(i, 'to'), s.leg, 'alight'));
    timeline.append(leg);
    i++;
  }
  return timeline;
}

// Rows expanded by a tap, by row key (the timing vehicle's trip id; next-day ids repeat).
const expandedRows = new Set();
const rowKey = r => `${r.key}${r.nextDay ? '@next' : ''}`;

let lastProblem = '';
function render() {
  const now = Date.now();
  syncWidget();
  renderToggle();
  $('refresh').hidden = !config; // nothing to refresh without trips
  $('map-btn').hidden = !config;
  $('oneoff').hidden = !config || tripIdx !== oneOffIdx();
  $('plan-trip').hidden = true; // shown with the rows (not while riding, nor without trips)

  const status = $('status');
  const statusText = $('status-text');
  const { lastOk, lastError, rateLimited, retryAt, mbtaDown } = cache[tripIdx] ?? {};
  // Retry after an error (not while rate limited: that retries by itself at the reset).
  $('retry-wrap').hidden = !config || !lastError || rateLimited || inFlight;
  if (!config) {
    syncWakeLock(false);
    status.className = 'status';
    statusText.textContent = 'No trips set up yet.';
    $('alerts').replaceChildren();
    $('enroute').hidden = true; // e.g. left from before the last trip was deleted
    enRouteKey = null;
    const li = el('li', 'empty');
    const btn = el('button', 'big-btn', 'Plan a trip');
    btn.type = 'button';
    btn.onclick = () => showSetup({ plan: true });
    const imp = el('button', 'secondary-btn', 'Import trips');
    imp.type = 'button';
    imp.onclick = () => showSetup({ importOpen: true });
    li.append(el('p', 'empty-help', NO_TRIPS_HELP), btn, imp);
    closeEmptyMap();
    $('rows').replaceChildren(li);
    return;
  }
  if (lastError) {
    status.className = 'status stale';
    const updated = lastOk && `last updated ${formatTime(lastOk)}`;
    statusText.textContent = rateLimited && retryAt
      ? [`Rate limited · retry in ${Math.max(0, Math.ceil((retryAt - now) / 1000))} s`, updated].filter(Boolean).join(' · ')
      : lastOk ? `Stale (${lastError}) · ${updated}` : `Error: ${lastError}`;
  } else {
    // Older than two poll intervals (e.g. just back in the app): the age, in amber.
    const age = lastOk && dataAgeText(lastOk, pollIntervalMs(currentRows(now), now, !!enRouteState()?.ride), now);
    status.className = notice ? 'status stale' : age || mbtaDown ? 'status old' : 'status';
    const slow = loading?.idx === tripIdx && now - loading.since >= 5000;
    statusText.textContent = [lastOk ? `Updated ${formatTime(lastOk)}${age ? ` (${age})` : ''}` : slow ? 'Still loading… (MBTA is slow)' : 'Loading…', mbtaDown && 'MBTA down', notice,
      locationOff && usesLocation() && 'Location off', savedCopy && 'Saved copy'].filter(Boolean).join(' · ');
  }
  // Announce a new problem once, not the per-second retry count or "Updated …".
  const problem = statusProblem({ lastError, lastOk, rateLimited, notice, locationOff: locationOff && usesLocation(), savedCopy, mbtaDown });
  if (problem !== lastProblem && problem) announce(problem);
  lastProblem = problem;

  $('alerts').replaceChildren(...currentAlerts(now).map(a => {
    const li = el('li');
    li.append(el('b', null, a.effect.replaceAll('_', ' ')), el('div', null, a.header));
    return li;
  }));

  const en = syncEnRoute(now);
  syncWakeLock(en?.ride
    ? keepAwakeRiding(en.ride, tripShape(config.trips[tripIdx]).walkAfter, now, wakeRiding(config))
    : keepAwake(currentRows(now), now, wakeMinutes(config)));
  // A new leg being ridden: fetch its stops now rather than at the next poll.
  const riding = en?.ride && ridingLeg(now);
  if (riding && cache[tripIdx]?.rideStops?.tripId !== riding.leg.tripId && rideFetchFor !== riding.leg.tripId && !inFlight) {
    rideFetchFor = riding.leg.tripId;
    setTimeout(() => refresh());
  }
  syncLeaveCard(now);
  syncLiveActivity(en, now);
  syncBoarding(now);
  if (en?.ride) {
    syncRideAlert(en, now);
    renderEnRoute(now, false, true);
    closeEmptyMap();
    setRows(renderRideCard(en, now));
    return;
  }
  // "Show more rides" / "Show previous rides" reset when the shown trip changes.
  if (listTrip !== tripIdx) { listTrip = tripIdx; extraRows = 0; prevOpen = false; }
  const current = currentRows(now);
  renderEnRoute(now, current.length > 0);
  // The target, highlighted green in every mode: the pinned one (the bell), else the first row
  // still to catch (targetRow).
  const s = enRouteState();
  const pinnedKey = s?.pinned ? s.target?.key ?? null : null;
  const catchRow = targetRow(current, now, pinnedKey);
  const prev = previousRides(config.trips[tripIdx], rideVehicles(), now);
  if (!prev.length) prevOpen = false;
  // While previous rides are shown, a missed row whose train has left is among them (one that
  // hasn't left yet stays).
  // Otherwise its expanded row has "I got on" for that ride.
  const rows = current.flatMap(r => {
    const p = r.missed && r.firstDep <= now ? prev.find(p => p.key === r.legs[0].tripId) : null;
    return p && prevOpen ? [] : [renderRow(r, now, r === catchRow, pinnedKey, p)];
  }).filter(Boolean);
  const next = current.find(r => rowState(now, r) !== 'hidden');
  announceLeaveState(next, now);
  widgetNext = next ? [next.leaveBy, next.firstDep, next.eta].map(ms => Math.floor(ms / 60_000)).join('/') : null;
  const top = prev.length ? [listButton(prevOpen ? 'Hide previous rides ▴' : 'Show previous rides ▾', 'prev', () => { prevOpen = !prevOpen; render(); }),
    ...(prevOpen ? prev.map(r => renderRow(r, now, false, null, null, true)) : [])] : [];
  // "Show fewer rides" (once any were added): all the extras at once, back to the top.
  const canMore = current.length && currentRows(now, s, extraRows + 4).length > current.length;
  const moreBtns = [
    ...(canMore ? [listButtonEl('Show more rides ▾', 'more', () => { extraRows += 4; render(); })] : []),
    ...(extraRows > 0 ? [listButtonEl('Show fewer rides ▴', 'fewer', showFewer)] : []),
  ];
  const more = moreBtns.length ? [listItem(moreBtns)] : [];
  $('plan-trip').hidden = false;
  // No rows once loaded: the trip's map fills the space (emptyMapItem; 2026-11-09).
  if (rows.length || !lastOk) closeEmptyMap();
  if (rows.length) setRows(...top, ...rows, ...more);
  else if (lastOk) { setRows(...top, el('li', 'empty', 'No upcoming departures found.'), emptyMapItem()); fitEmptyMap(); }
  else setRows(...top, el('li', 'empty', ''));
}

// "Show previous rides" / "Show more rides": full-width buttons in the list.
let listTrip = null; // the trip the two below apply to
let extraRows = 0; // rows added by "Show more rides" (4 per tap)
let prevOpen = false; // previous rides shown
function listButtonEl(label, key, onclick) {
  const b = el('button', 'list-btn', label);
  b.type = 'button';
  b.dataset.focus = `list:${key}`;
  b.onclick = onclick;
  return b;
}
// One list item; two buttons share its row.
function listItem(buttons) {
  const li = el('li', buttons.length > 1 ? 'list-item pair' : 'list-item');
  li.append(...buttons);
  return li;
}
const listButton = (label, key, onclick) => listItem([listButtonEl(label, key, onclick)]);
function showFewer() {
  extraRows = 0;
  render();
  window.scrollTo(0, 0);
  // The tapped button is gone: focus "Show more rides".
  $('rows').querySelector('[data-focus="list:more"]')?.focus({ preventScroll: true });
}

// "I got on" for a previous ride (in its expanded row, or in the expanded missed row).
function gotOnButton(r, now) {
  const first = r.legs[0];
  const b = el('button', 'track-btn', 'I got on');
  b.type = 'button';
  b.dataset.focus = `got:${r.key}`;
  b.setAttribute('aria-label', `I got on the ${formatTime(first.dep, now)} ${vehicleLabel(first)}`);
  b.onclick = () => gotOn(r);
  return b;
}

// "I got on": tracks that ride from its departure, with Undo.
function gotOn(r) {
  const snap = { idx: tripIdx, state: enRouteState() };
  prevOpen = false;
  rideNote = null;
  laterOpen = false;
  nextOpen = false;
  stopsOpen = null;
  snap.removed = setEnRoute({ kind: 'track', at: Date.now(), ride: { legs: r.legs, boardedAt: r.firstDep } });
  render();
  schedulePoll();
  showToast('Tracking started', 'Undo', () => {
    if (snap.idx !== tripIdx) setTrip(snap.idx, true);
    setEnRoute(withoutAlert(snap.state));
    restoreReminders(snap.idx, snap.removed);
    render();
    schedulePoll();
  });
}

// Replaces the rows (every render, once a second), keeping keyboard focus on the same control
// (`data-focus`) when it is still there.
function setRows(...rows) {
  const focused = document.activeElement?.dataset?.focus;
  $('rows').replaceChildren(...rows);
  if (focused) $('rows').querySelector(`[data-focus="${CSS.escape(focused)}"]`)?.focus({ preventScroll: true });
  fitHeads();
}

// A long countdown ("Departs in 1h 26m") would push the time to a second line at phone widths:
// step its size down until the time fits beside it (at most twice; then it wraps as before).
function fitHeads() {
  for (const big of $('rows').querySelectorAll('.big')) {
    const label = big.firstElementChild, at = big.querySelector('.at');
    if (!at || label === at) continue;
    const wrapped = () => at.getBoundingClientRect().top >= label.getBoundingClientRect().bottom;
    if (wrapped()) big.classList.add('fit1');
    if (wrapped()) { big.classList.remove('fit1'); big.classList.add('fit2'); }
  }
}

// Screen readers: a polite announcement (#announce), for changes that would otherwise only be seen.
function announce(text) {
  $('announce').textContent = text;
}

// The first row's leave state changing (green → amber → hurry → missed), e.g. "Departs in 5 min ·
// 7:08am". A different first row (it left, or another trip) only resets the baseline.
let lastLeave = null;
function announceLeaveState(r, now) {
  if (!r) { lastLeave = null; return; }
  const state = rowState(now, r);
  const key = `${tripIdx}/${rowKey(r)}`;
  if (lastLeave?.key === key && lastLeave.state !== state) {
    const target = state === 'hurry' || state === 'missed' || state === 'enroute' ? r.firstDep : r.leaveBy;
    announce(`${countdownLabel(state, target - now)} · ${formatTime(target, now)}`);
  }
  lastLeave = { key, state };
}

// "Leaving now" / "At the stop" bar, rebuilt only when its content changes.
let enRouteKey = null;
function renderEnRoute(now, hasRows, riding = false) {
  const s = enRouteState();
  const text = s && !riding ? enRouteStatus(s, now) : '';
  const key = JSON.stringify([tripIdx, hasRows, s?.kind, text, riding]);
  if (key === enRouteKey) return;
  enRouteKey = key;
  const bar = $('enroute');
  bar.hidden = riding || (!hasRows && !s);
  bar.classList.toggle('wide', s?.kind === 'track' || !!s?.asking); // status on its own line
  if (riding) return bar.replaceChildren();
  const btn = (label, onclick) => {
    const b = el('button', null, label);
    b.type = 'button';
    b.dataset.focus = `bar:${label}`;
    b.onclick = onclick;
    return b;
  };
  bar.replaceChildren(...(s?.asking
    ? [el('span', 'en-status', text), btn('Yes', () => answer(true)), btn('Missed it', () => answer(false))]
    : s
    ? [el('span', 'en-status', text),
      s.kind === 'track' && btn('Leaving now', () => goEnRoute('leaving')),
      (s.kind === 'leaving' || s.kind === 'track') && btn('At the stop', () => goEnRoute('stop')),
      btn('Cancel', cancelTracking)].filter(Boolean)
    : [btn('Leaving now', () => goEnRoute('leaving')), btn('At the stop', () => goEnRoute('stop'))]));
}

// Cancel (bar or trip card): ends at once, with "Undo" in a toast for 5 s.
function cancelTracking() {
  const snap = { idx: tripIdx, state: enRouteState() };
  rideNote = null;
  laterOpen = false;
  nextOpen = false;
  stopsOpen = null;
  const removed = setEnRoute(null);
  render();
  schedulePoll();
  showToast('Tracking cancelled', 'Undo', () => {
    if (snap.idx !== tripIdx) setTrip(snap.idx, true); // Cancel let autoSwitch change trips
    setEnRoute(withoutAlert(snap.state));
    restoreReminders(snap.idx, removed);

    schedulePoll();

// "Did you get on?" at a belled ride's departure (the bar, or the push's actions in the iOS app):

  schedulePoll();

function goEnRoute(kind) {

  setEnRoute(advanceEnRoute(s, currentRows(now, s), now));

// Trip card while riding: phase and live arrival, the timeline with the current step, and
// Missed it / Cancel.
let rideNote = null; // e.g. "No later connection" after Missed it
let laterOpen = false; // "Different train?" choices shown
let nextOpen = false; // "Different connection?" / transfer "Different bus?" choices shown
let stopsOpen = null; // trip id of the leg whose full stop list is shown ("… N more" tapped)
let rideFetchFor = null; // trip id whose stops were last requested outside the poll
// The ridden leg's rows on its timeline bar, before the drop-off: the vehicle ("At <stop>" while
// stopped at one, else a marker just above the next stop; none at the drop-off), then the stops
// left (shownStops: next 2, "… N more", the stop before the drop-off; "… N more" expands).
function rideStopRows(stops, tripId, now) {
  const mid = (cls, ...kids) => {
    const d = el('div', `step mid${cls}`);
    d.append(...kids);
    return d;
  };
  const rows = [];
  const v = stops.vehicle;
  if (v?.status === 'STOPPED_AT' && !v.atDropOff) rows.push(mid(' here', el('span', 'veh'), el('span', 'n', `At ${v.name}`)));
  else if (!v?.atDropOff) rows.push(mid(' gap', el('span', 'veh')));
  const open = stopsOpen === tripId;
  const toggle = (text, value) => {
    const b = el('button', null, text);
    b.type = 'button';
    b.dataset.focus = 'ride:more';
    b.onclick = e => { e.stopPropagation(); stopsOpen = value; render(); };
    return mid(' more', b);
  };
  for (const st of shownStops(stops.stops, open)) {
    if (st.more) { rows.push(toggle(`… ${st.more} more`, tripId)); continue; }
    if (st.dropOff) continue; // the timeline's drop-off row
    rows.push(mid('', el('span', 'mid-dot'), el('span', 'n', st.name), el('span', 't', formatTime(st.time, now))));
  }
  if (open && shownStops(stops.stops).length < stops.stops.length) rows.push(toggle('Show fewer', null));
  return rows;
}

function renderRideCard(s, now) {
  const trip = config.trips[tripIdx];
  const ride = s.ride;
  // Riding: the stops left to the drop-off (in the timeline, below), also counted in the headline.
  const { phase, stops, outlook: o, walkAfter } = rideCardData(s, now);
  const leg = phase.kind === 'riding' ? ride.legs[phase.leg] : null;
  const transfer = phase.kind === 'transfer';
  // The next connection: spare time, tight (amber card then), re-planned after a miss, or none (red).
  const outlook = outlookText(o, ride, now, { transfer });
  const edge = transfer && outlook?.late ? ' red' : transfer && outlook?.warn ? ' amber' : '';
  const li = el('li', `row ride${phase.kind === 'arrived' ? ' arrived' : ''}${edge}`);
  const head = rideHeadline(phase, ride, now, stops);
  // In the transfer, a departure row's headline: "Bus 132 in 9 min" with the time on the right.
  if (transfer) {
    const big = el('div', 'big');
    big.append(el('span', null, head.text), el('span', 'at', head.at));
    li.append(big);
  } else li.append(el('div', 'ride-head', head));
  if (outlook) li.append(el('div', `ride-outlook${outlook.warn ? ' warn' : ''}${outlook.late ? ' late' : ''}`, outlook.text));
  // Timeline with the current step: the leg being ridden, the transfer before a leg, or the
  // final walk.
  // The timeline's legs with their trains' alerts (shown only, not kept on the ride).
  const steps = timelineSteps({ legs: withTripAlerts(ride, trainAlerts(cache[tripIdx], now)).legs, eta: phase.eta, enRoute: true }, trip, 0, now, tripStopNames());
  const along = stops && stops.stops.length ? { leg: phase.leg, rows: rideStopRows(stops, leg.tripId, now) } : null;
  li.append(renderTimeline(steps, now, { phase, key: `ride:${ride.legs[0].tripId}`, along }));
  if (rideNote) li.append(el('div', 'msg', rideNote));
  const btns = el('div', 'enroute-bar ride-btns');
  const btn = (label, onclick) => {
    const b = el('button', null, label);
    b.type = 'button';
    b.dataset.focus = `ride:${label}`;
    b.onclick = e => { e.stopPropagation(); onclick(); };
    return b;
  };
  if (phase.kind !== 'arrived' && stopAlertsAvailable() && (notifyPermission() === 'default' || (notifyPermission() === 'granted' && enRouteState()?.alert?.off))) {
    const b = btn('Turn on stop alerts', turnOnStopAlerts);
    b.innerHTML = `${BELL_SVG}Turn on stop alerts`;
    b.classList.add('alerts-btn');
    btns.append(b);
  }
  if (canUndoBoarding(ride, phase, now)) btns.append(btn('Missed it', () => missedIt(phase)));
  // "On a different train?": vehicles of this leg that left in the last 15 min, earlier or later, and
  // after the previous leg's arrival.
  const later = phase.kind === 'riding' ? otherVehicles(rideVehicles()[phase.leg] ?? [], ride.legs[phase.leg], now, ride.legs[phase.leg - 1]?.arr) : [];
  if (later.length) {
    const noun = vehicleNoun(ride.legs[phase.leg]);
    btns.append(btn(laterOpen ? "I'm on this one" : `On a different ${noun}?`, () => { laterOpen = !laterOpen; render(); }));
  }
  // The next leg ("Different connection?" while riding, from the arrival; in the transfer "I'm at
  // the stop" = the first departure from now, and "Different bus?"): the rider's pick sticks.
  const { transfers } = tripShape(trip);
  const nl = phase.kind === 'transfer' ? phase.leg : phase.kind === 'riding' && phase.leg + 1 < ride.legs.length ? phase.leg + 1 : -1;
  const choices = nl < 0 ? [] : phase.kind === 'transfer'
    ? connectionChoices(rideVehicles()[nl] ?? [], ride.legs[nl], now, ride.legs[nl - 1].arr)
    : connectionChoices(rideVehicles()[nl] ?? [], ride.legs[nl], ride.legs[phase.leg].arr);
  const pickNext = v => {
    nextOpen = false;
    rideNote = null;
    setEnRoute({ ...s, ride: switchLeg(ride, nl, v, rideVehicles(), transfers) });
    render();
    schedulePoll();
  };
  const nextFromNow = choices.find(v => v.dep >= now);
  if (phase.kind === 'transfer' && nextFromNow && nextFromNow.dep < ride.legs[nl].dep) btns.append(btn("I'm at the stop", () => pickNext(nextFromNow)));
  if (choices.length) {
    const noun = vehicleNoun(ride.legs[nl]);
    const [open, closed] = phase.kind === 'transfer' ? [`Keep this ${noun}`, `Different ${noun}?`] : ['Keep this connection', 'Different connection?'];
    btns.append(btn(nextOpen ? open : closed, () => { nextOpen = !nextOpen; render(); }));
  }
  btns.append(phase.kind === 'arrived'
    ? btn('Done', () => {
      rideNote = null; laterOpen = false; nextOpen = false; stopsOpen = null; setEnRoute(null);
      if (tripIdx === oneOffIdx()) return removeOneOff(false); // a one-off ends with its ride
      render(); schedulePoll();
    })
    : btn('Cancel trip', cancelTracking));
  li.append(btns);
  if (laterOpen && later.length) {
    const pick = el('div', 'enroute-bar ride-btns');
    for (const v of later) {
      pick.append(btn(`${vehicleLabel(onVehicle(ride.legs[phase.leg], v))} ${legTime(v, v.dep, now)}`, () => {
        laterOpen = false;
        nextOpen = false;
        setEnRoute({ ...s, ride: switchLeg(ride, phase.leg, v, rideVehicles(), tripShape(trip).transfers) });
        render();
      }));
    }
    li.append(pick);
  }
  if (nextOpen && choices.length) {
    const pick = el('div', 'enroute-bar ride-btns');
    for (const v of choices) pick.append(btn(`${vehicleLabel(onVehicle(ride.legs[nl], v))} ${legTime(v, v.dep, now)}`, () => pickNext(v)));
    li.append(pick);
  }
  return li;
}

// "Missed it": on the first leg, back to waiting at the stop; on a later leg, the next vehicle
// of that leg and the earliest connections after it.
function missedIt(phase) {
  const now = Date.now();
  const s = enRouteState();
  if (!s?.ride) return;
  const { transit, transfers } = tripShape(config.trips[tripIdx]);
  const c = cache[tripIdx];
  const vehicles = tripVehicles(transit, transit.map((l, i) => mergeTrips(c?.predictions?.[i], c?.schedules?.docs[i])), c?.lastLive, now);
  const { state, note } = missLeg(s, phase.leg, vehicles, transfers, now);
  rideNote = note;
  if (!note) setEnRoute(state);
  render();
  schedulePoll();
}

// shared keychain, rewritten (and the widget reloaded) when it changes, when the shown next ride's
// times change to the minute (`widgetNext`, from the last render), and on each return to the app,
// so the widget shows the app's answer (CLAUDE.md "UI rules"); the widget sends it to /api/widget.

// A manual choice holds until the next trip window starts (see pickTrip).
function setTrip(i, manual) {
  if (manual) store.set(KEY_OVERRIDE, { index: i, setAt: Date.now() });
  if (i === tripIdx) return;
  tripIdx = i;
  store.set(KEY_LAST_TRIP, i);
  render();
  refresh();
}
