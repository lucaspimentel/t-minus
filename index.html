}

// ---------- one-off trip ----------

// A trip's reminders, en-route state (and its stop alerts on the server) and cached data, dropped;
// returns { state, reminders } for Undo.
function dropTripState(idx) {
  const all = store.get(KEY_EN_ROUTE) ?? {};
  const state = all[idx] ?? null;
  if (state?.alert?.id) pushApi('DELETE', `/rides/${state.alert.id}`).catch(() => {});
  delete all[idx];
  store.set(KEY_EN_ROUTE, all);
  const removed = cancelTripReminders(idx);
  delete cache[idx];
  lastTiming.delete(idx);
  return { state, reminders: removed };
}

// "See departures" on a planned way: it replaces any one-off and is shown.
function setOneOff(trip) {
  if (oneOffIdx() >= 0) dropTripState(oneOffIdx());
  oneOff = { trip, at: Date.now() };
  store.set(KEY_ONE_OFF, oneOff);
  config = withOneOff(savedConfig);
  tripIdx = oneOffIdx();
}

// ✕ Remove (with Undo), or silently once its ride is over.
function removeOneOff(undo = true) {
  const idx = oneOffIdx();
  if (idx < 0) return;
  const prev = oneOff;
  const dropped = dropTripState(idx);
  oneOff = null;
  store.del(KEY_ONE_OFF);
  config = withOneOff(savedConfig);
  tripIdx = config ? chooseTrip(Date.now(), store.get(KEY_OVERRIDE), located()) : 0;
  render();
  if (config) refresh({ force: !cache[tripIdx] });
  if (!undo) return;
  showToast('One-off trip removed', 'Undo', () => {
    oneOff = prev;
    store.set(KEY_ONE_OFF, prev);
    config = withOneOff(savedConfig);
    tripIdx = oneOffIdx();
    if (dropped.state) {
      const all = store.get(KEY_EN_ROUTE) ?? {};
      all[tripIdx] = withoutAlert(dropped.state);
      store.set(KEY_EN_ROUTE, all);
    }
    restoreReminders(tripIdx, dropped.reminders);
    render();
    refresh({ force: true });
  });
}

// Save: the one-off becomes the last saved trip (same index, so its state carries over).
function saveOneOff() {
  if (!oneOff) return;
  savedConfig = { ...(savedConfig ?? {}), trips: [...(savedConfig?.trips ?? []), oneOff.trip] };
  store.set(KEY_CONFIG, savedConfig);
  oneOff = null;
  store.del(KEY_ONE_OFF);
  config = withOneOff(savedConfig);
  render();
  showToast('Trip saved');
}
$('oneoff-save').onclick = saveOneOff;
$('oneoff-remove').onclick = () => removeOneOff();

// Setup's "Delete all trips and settings": cancels pending reminders, clears everything the app
// stored except the API key (and the tests' push-server override), and reloads to first run.
function resetApp(apiKey) {
  for (const rem of Object.values(reminders)) pushApi('DELETE', `/reminders/${rem.id}`).catch(() => {});
  try {
    for (const k of Object.keys(localStorage)) if (k.startsWith('t-minus:') && k !== 't-minus:push-server') localStorage.removeItem(k);
  } catch {}
  if (apiKey) store.set(KEY_CONFIG, { trips: [], apiKey });
  location.reload();
}

// `show`: a trip just saved from "Plan a trip…" on the main screen, shown as if picked.
function closeSetup({ show = null } = {}) {
  hideToast(); // setup's Undo works only in setup
  setupView?.close();
  setupView = null;
  $('app').hidden = false;
  if (show != null && config?.trips[show]) {
    store.set(KEY_OVERRIDE, { index: show, setAt: Date.now() });
    store.set(KEY_LAST_TRIP, show);
    tripIdx = show;
  }
  render();
  refresh({ force: !cache[tripIdx] });
}

$('open-setup').onclick = () => showSetup();

function basemapGroup(layers) {

  const path = (d, cls, attrs = {}) => d && g.append(svgEl('path', { d, class: cls, ...attrs }));
  g.append(svgEl('rect', { class: 'map-water', x: layers.water.x, y: layers.water.y, width: layers.water.w, height: layers.water.h }));
  path(layers.coarse, 'map-land');
  path(layers.land, 'map-land');
  path(layers.lakes, 'map-lake');
  path(layers.rivers, 'map-river');
  path(layers.towns, 'map-town-line');
  path(layers.hoods, 'map-hood-line');
  for (const l of layers.lines) path(l.d, `map-faint ${l.kind}`, { stroke: mapColor(l.color) });
  const marks = layers.names.map(n => {
    const m = svgEl('g');
    m.dataset.x = n.x; m.dataset.y = n.y;
    m.append(svgEl('text', { class: `map-name ${n.kind}`, y: 4 }, n.name));
    g.append(m);
    return m;
  });
  return { g, names: layers.names, marks };
}

// A map widget: `el` (a div with the SVG and, when interactive, a caption) and draw(input, here)
// (input: routeMapModel's, without `aspect`; here: the phone's { lat, lon } or null). Interactive:
// pinch / drag / wheel to zoom and pan, stops as buttons whose names show in the caption.
// The view the rider zoomed to is kept across redraws; marks keep their size in pixels.
function mapWidget({ label, interactive = false, focusKey = 'map', caption = null, locate = false }) {
  const svg = svgEl('svg', { class: 'route-svg', role: interactive ? 'group' : 'img', 'aria-label': label });
  const el = document.createElement('div');
  el.className = 'route-map';
  el.append(svg);
  const cap = caption ?? (interactive ? Object.assign(document.createElement('p'), { className: 'map-caption' }) : null);
  if (cap && !caption) { cap.setAttribute('aria-live', 'polite'); el.append(cap); }
  const w = { el, svg, model: null, view: null, fit: null, touched: false, selected: null, marks: [], stopMarks: [], vehicleMarks: [], note: '', base: null, out: false };
  basemapWidgets.add(w);
  loadBasemap();
  const size = () => ({ width: svg.clientWidth || 340, height: svg.clientHeight || 200 });
  const mpp = () => (w.view ? w.view.w / size().width : 1); // meters per pixel
  let fitBtn = null;
  function apply() {
    if (fitBtn) fitBtn.hidden = !w.touched;
    if (!w.view) return;
    svg.setAttribute('viewBox', `${w.view.x} ${w.view.y} ${w.view.w} ${w.view.h}`);
    const s = mpp();
    for (const m of w.marks) m.setAttribute('transform', `translate(${m.dataset.x} ${m.dataset.y}) scale(${s})`);
    // Intermediate stops only with room between them (a zoomed-out bus leg isn't a row of dots).
    if (w.model) {
      const shown = stopsToShow(w.model.stops, 1 / s, { keep: w.selected });
      w.stopMarks.forEach((m, i) => { if (shown.has(i)) m.removeAttribute('display'); else m.setAttribute('display', 'none'); });
    }
    // Zoomed out: your ride's vehicle only; zooming back in polls at once (`w.onZoomIn`).
    const out = zoomedOut(w.view, w.fit);
    for (const { g, v } of w.vehicleMarks) { if (vehicleShown(v, out)) g.removeAttribute('display'); else g.setAttribute('display', 'none'); }
    if (w.out && !out) setTimeout(() => w.onZoomIn?.());
    w.out = out;
    if (w.base) {
      const shown = basemapNames(w.base.names, w.view, size());
      w.base.marks.forEach((m, i) => {
        if (shown.has(i)) { m.removeAttribute('display'); m.setAttribute('transform', `translate(${m.dataset.x} ${m.dataset.y}) scale(${s})`); }
        else m.setAttribute('display', 'none');
      });
    }
  }
  function showCaption() {
    if (!cap) return;
    const st = w.model?.stops.find(x => x.id === w.selected);
    cap.textContent = st?.name ?? w.note;
  }
  function select(id) {
    w.selected = w.selected === id ? null : id;
    w.redraw?.();
  }
  w.draw = (input, here = null, note = '') => {
    w.redraw = () => w.draw(input, here, note);
    const { width, height } = size();
    const model = routeMapModel({ ...input, aspect: width / height });
    const focused = svg.contains(document.activeElement) ? document.activeElement.dataset.focus : null;
    w.model = model;
    w.note = note;
    if (!w.touched || !w.view) w.view = model.view;
    w.fit = model.view;
    const mark = (x, y, cls) => { const g = svgEl('g', { class: cls }); g.dataset.x = x; g.dataset.y = y; w.marks.push(g); return g; };
    w.marks = [];
    w.stopMarks = [];
    const parts = [];
    for (const wk of model.walks) parts.push(svgEl('line', { class: 'map-walk', x1: wk.from.x, y1: wk.from.y, x2: wk.to.x, y2: wk.to.y, 'data-kind': wk.kind }));
    for (const l of model.legs) parts.push(svgEl('polyline', { class: `map-leg${l.faded ? ' faded' : ''}`, stroke: mapColor(l.color), 'data-color': l.color ?? '', points: l.path.map(p => `${p.x},${p.y}`).join(' ') }));
    for (const st of model.stops) {
      const g = mark(st.x, st.y, `map-stop${st.major ? ' major' : ''}`);
      w.stopMarks.push(g);
      g.append(svgEl('circle', { r: st.major ? 6 : 3.5, stroke: mapColor(st.color) }));
      if (st.label || w.selected === st.id) g.append(svgEl('text', { x: 10, y: 4, class: 'map-label' }, st.name));
      if (interactive) {
        g.append(svgEl('circle', { r: 14, class: 'map-hit' }));
        Object.assign(g.dataset, { focus: `${focusKey}:stop:${st.id}`, stop: st.id });
        g.setAttribute('role', 'button');
        g.setAttribute('tabindex', '0');
        g.setAttribute('aria-label', st.name);
        g.setAttribute('aria-pressed', String(w.selected === st.id));
      }
      parts.push(g);
    }
    w.vehicleMarks = [];
    for (const v of model.vehicles) {
      const g = mark(v.x, v.y, `map-vehicle${v.mine ? ' mine' : ''}`);
      // A circle with a point at `heading` (the travel direction); the label stays upright.
      const r = Math.max(11, v.label.length * 3 + 3) * (v.mine ? 1.25 : 1), tip = r + 7;
      const pin = svgEl('path', { d: `M${tip} 0L${r * 0.5} ${-r * 0.866}A${r} ${r} 0 1 0 ${r * 0.5} ${r * 0.866}Z`, fill: mapColor(v.color), transform: `rotate(${v.heading ?? 0})` });
      g.append(pin, svgEl('text', { y: v.mine ? 4 : 3.2, 'text-anchor': 'middle', fill: textOn(v.color) }, v.label));
      Object.assign(g.dataset, { vehicle: v.id, heading: Math.round(v.heading ?? 0) });
      w.vehicleMarks.push({ g, v });
      parts.push(g);
    }
    const p = mapPoint(model, here);
    if (p) { const g = mark(p.x, p.y, 'map-here'); g.append(svgEl('circle', { r: 14, class: 'halo' }), svgEl('circle', { r: 6, class: 'dot' })); parts.push(g); }
    // The base map beneath, built once per origin (a vehicle or location redraw reuses it).
    const baseKey = model.origin && basemap ? `${model.origin.lat},${model.origin.lon}` : null;
    if (w.base?.key !== baseKey) {
      const layers = baseKey && basemapFor(model.origin);
      w.base = layers ? { key: baseKey, ...basemapGroup(layers) } : null;
    }
    svg.replaceChildren(...(w.base ? [w.base.g] : []), ...parts);
    apply();
    showCaption();
    if (focused) svg.querySelector(`[data-focus="${CSS.escape(focused)}"]`)?.focus({ preventScroll: true });
  };
  new ResizeObserver(() => { if (!w.touched && w.redraw) w.redraw(); else apply(); }).observe(svg);
  // Inside an option card: a tap on the map doesn't toggle the card (a picture too).
  el.addEventListener('click', e => e.stopPropagation());
  if (!interactive && !locate) return w;

  // Pan and zoom limits: anywhere commuter rail reaches (the base map's `reach`, 5 km more) once
  // the base map is in, and out until all of it shows.
  const limits = () => {
    const o = w.model?.origin;
    const area = basemap && o ? areaRect(basemap.reach, projector(o.lat, o.lon)) : null;
    const { width, height } = size();
    return viewLimits(w.fit, { area, aspect: width / height });
  };
  // ⤢ back to the trip's fit: eased over FIT_MS (a jump with Reduce Motion).
  const FIT_MS = 250;
  let fitAnim = 0;
  const tools = Object.assign(document.createElement('div'), { className: 'map-tools' });
  // Locate (2026-11-09; `w.onLocate`, the caller's: the location, then w.centerOn).
  if (locate) {
    const b = Object.assign(document.createElement('button'), { type: 'button', className: 'map-tool map-locate' });
    b.setAttribute('aria-label', 'Center on my location');
    b.dataset.focus = `${focusKey}:locate`; // the main list's redraw keeps its focus
    const icon = svgEl('svg', { viewBox: '0 0 24 24', 'aria-hidden': 'true' });
    icon.append(svgEl('path', { d: 'M3 11 21 3l-8 18-2-8z' }));
    b.append(icon);
    b.addEventListener('click', e => { e.stopPropagation(); w.onLocate?.(); });
    tools.append(b);
  }
  // Moves the view to `to`, eased over FIT_MS (a jump with Reduce Motion), then `done`. A pan,
  // pinch or another move takes over (fitAnim).
  const animateTo = (to, done) => {
    const id = ++fitAnim;
    if (!w.view || matchMedia('(prefers-reduced-motion: reduce)').matches) { w.view = to; done(); apply(); return; }
    const from = w.view, t0 = performance.now();
    const step = now => {
      if (id !== fitAnim) return;
      const t = (now - t0) / FIT_MS;
      if (t >= 1) { w.view = to; done(); apply(); return; }
      w.view = easeView(from, to, t);
      apply();
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  };
  // Locate: you in the middle, the trip still in view (centerOn); eased like ⤢ (2026-11-09).
  w.centerOn = here => {
    const p = mapPoint(w.model, here);
    if (!p || !w.fit) return;
    w.touched = true; // ⤢ at once; a redraw meanwhile keeps the view
    animateTo(interactive ? panView(centerOn(w.fit, p), 0, 0, limits()) : centerOn(w.fit, p), () => {});
  };
  fitBtn = Object.assign(document.createElement('button'), { type: 'button', className: 'map-tool map-fit', textContent: '⤢', hidden: true });
  fitBtn.setAttribute('aria-label', 'Show the whole trip');
  fitBtn.dataset.focus = `${focusKey}:fit`;
  fitBtn.addEventListener('click', e => {
    e.stopPropagation();
    if (!w.fit || !w.view) return;
    animateTo(w.fit, () => { w.touched = false; });
  });
  tools.append(fitBtn);
  el.append(tools);
  if (!interactive) return w;

  // Taps and keys on stops; drags and pinches move the view.
  const pointers = new Map();
  let moved = 0, dragged = false;
  const stopFit = () => { fitAnim++; };
  const toView = (cx, cy) => { const r = svg.getBoundingClientRect(); return { x: w.view.x + (cx - r.left) * mpp(), y: w.view.y + (cy - r.top) * mpp() }; };
  svg.addEventListener('click', e => {
    const g = e.target.closest?.('[data-stop]');
    if (g && !dragged) select(g.dataset.stop);
  });
  svg.addEventListener('keydown', e => {
    const g = e.target.closest?.('[data-stop]');
    if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select(g.dataset.stop); }
  });
  svg.addEventListener('pointerdown', e => {
    stopFit();
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) { moved = 0; dragged = false; }
  });
  svg.addEventListener('pointermove', e => {
    const prev = pointers.get(e.pointerId);
    if (!prev || !w.view) return;
    const cur = { x: e.clientX, y: e.clientY };
    moved += Math.hypot(cur.x - prev.x, cur.y - prev.y);
    if (!dragged && moved < 6) return;
    if (!dragged) { dragged = true; try { svg.setPointerCapture(e.pointerId); } catch {} }
    const others = [...pointers].filter(([id]) => id !== e.pointerId).map(([, q]) => q);
    if (others.length) {
      const o = others[0], d0 = Math.hypot(prev.x - o.x, prev.y - o.y), d1 = Math.hypot(cur.x - o.x, cur.y - o.y);
      const mid = toView((cur.x + o.x) / 2, (cur.y + o.y) / 2);
      if (d0 > 0) w.view = zoomView(w.view, d1 / d0, mid.x, mid.y, limits());
    } else {
      w.view = panView(w.view, -(cur.x - prev.x) * mpp(), -(cur.y - prev.y) * mpp(), limits());
    }
    pointers.set(e.pointerId, cur);
    w.touched = true;
    apply();
  });
  const up = e => { pointers.delete(e.pointerId); if (!pointers.size) setTimeout(() => { dragged = false; }); };
  svg.addEventListener('pointerup', up);
  svg.addEventListener('pointercancel', up);
  svg.addEventListener('wheel', e => {
    if (!w.view) return;
    stopFit();
    e.preventDefault();
    const p = toView(e.clientX, e.clientY);
    w.view = zoomView(w.view, e.deltaY < 0 ? 1.25 : 0.8, p.x, p.y, limits());
    w.touched = true;
    apply();
  }, { passive: false });
  // Drags don't reach the card either.
  for (const ev of ['pointerdown', 'touchstart']) el.addEventListener(ev, e => e.stopPropagation(), { passive: true });
  return w;
}

// Setup's maps (the planner's options, the trip editor): kept per key while the legs are the
// same, so a redraw of setup keeps the view; redrawn when a leg's shape arrives.
const setupMaps = new Map();
function routeMapEl(legs, { start = null, end = null, points = [], static: still = false } = {}, key = 'map') {
  const ml = legs.map(l => ({ route: l.route, direction_id: l.direction_id, stop: l.stop, alight: l.alight, color: l.color ?? null, label: l.label ?? l.route }));
  const sig = JSON.stringify([ml, start, end, points, still]);
  const kept = setupMaps.get(key);
  if (kept?.sig === sig && kept.el.isConnected) return kept.el;
  const w = mapWidget({ label: still ? 'Map of the trip' : 'Route map', interactive: !still, focusKey: key });
  const draw = () => w.draw({ legs: ml, shapes: loadedShapes(ml), fallback: ml.map((l, i) => mapFallback(l, points[i])), start, end });
  draw();
  if (ml.some(l => !shapeDocs.has(stopsKey(l.route, l.direction_id)))) Promise.all(ml.map(legShapes)).then(draw);
  setupMaps.set(key, { sig, el: w.el });
  return w.el;
}

// The maps' location (the sheet and the empty screen's map; 2026-11-09): never asked for on its
// own. Watched while the map is shown when the permission is already granted (Permissions API);
// otherwise only after a tap on locate (`locate()`: the prompt, then the watch), which also
// centers on you (`onChange(true)`). Denied: `off` ("Location off") only after that tap.
function mapLocation(onChange) {
  const loc = { here: null, off: false, asked: false, watchId: null, stopped: false };
  const opts = { enableHighAccuracy: true, maximumAge: 10_000, timeout: 20_000 };
  const at = p => ({ lat: p.coords.latitude, lon: p.coords.longitude });
  const watch = () => {
    if (loc.stopped || loc.watchId != null || !navigator.geolocation) return;
    loc.watchId = navigator.geolocation.watchPosition(p => {
      if (loc.stopped) return;
      loc.here = at(p); loc.off = false; onChange(false);
    }, () => {
      if (loc.stopped) return;
      loc.here = null; loc.off = loc.asked; onChange(false);
    }, opts);
  };
  loc.locate = () => {
    loc.asked = true;
    if (!navigator.geolocation) { loc.off = true; onChange(false); return; }
    navigator.geolocation.getCurrentPosition(p => {
      if (loc.stopped) return;
      loc.here = at(p); loc.off = false; watch(); onChange(true);
    }, () => {
      if (loc.stopped) return;
      loc.here = null; loc.off = true; onChange(false);
    }, opts);
  };
  loc.stop = () => {
    loc.stopped = true;
    if (loc.watchId != null) navigator.geolocation?.clearWatch(loc.watchId);
    loc.watchId = null;
  };
  navigator.permissions?.query({ name: 'geolocation' }).then(st => { if (st.state === 'granted') watch(); }, () => {});
  return loc;
}

// The empty main screen's map (2026-11-09): when the list loaded with no rows, the shown trip as
// a picture filling the space down to the footer, with your location (mapLocation), the legs'
// vehicles every 10 s (paused while the sheet is open), locate and ⤢; a tap opens the sheet.
// Kept across the once-a-second redraw; closed when rows come back.
let emptyMap = null;
const mapLegs = trip => tripShape(trip).transit.map(l => ({ route: l.route, also: l.also, direction_id: l.direction_id, stop: l.stop, alight: l.alight, color: l.color ?? null, label: l.label ?? l.route }));
function drawEmptyMap() {
  const e = emptyMap;
  if (!e) return;
  const c = cache[e.idx];
  const points = legPoints(e.trip, [...(c?.predictions ?? []), ...(c?.schedules?.docs ?? [])]);
  e.widget.draw({
    legs: e.legs, shapes: loadedShapes(e.legs), fallback: e.legs.map((l, i) => mapFallback(l, points[i])),
    fitAlso: [e.loc.here], vehicles: e.vehicles, nowMs: Date.now(),
  }, e.loc.here);
  e.cap.textContent = e.loc.off ? 'Location off' : 'Tap for the full map';
  e.credit.textContent = e.widget.base ? basemap.credit ?? '' : '';
  e.credit.hidden = !e.widget.base;
  fitEmptyMap(); // the credit line may have come or gone
}
async function pollEmptyVehicles() {
  const e = emptyMap;
  if (!e || mapSheet || document.hidden) return;
  if (zoomedOut(e.widget.view, e.widget.fit)) return; // no ride of yours here: nothing would show
  e.polled = Date.now();
  const res = await Promise.allSettled(e.legs.map(l => api('/vehicles', vehiclesQuery(l))));
  if (emptyMap !== e) return;
  e.vehicles = res.map((r, i) => (r.status === 'fulfilled' ? vehiclePositions(r.value) : e.vehicles[i] ?? []));
  drawEmptyMap();
}
function emptyMapItem() {
  const trip = config.trips[tripIdx];
  const sig = JSON.stringify(trip); // the same trip, even from a reloaded config
  if (emptyMap && (emptyMap.idx !== tripIdx || emptyMap.sig !== sig)) closeEmptyMap();
  if (emptyMap) return emptyMap.li;
  const legs = mapLegs(trip);
  const widget = mapWidget({ label: `Map of ${trip.name}`, locate: true, focusKey: 'empty-map' });
  widget.el.classList.add('empty-map');
  widget.el.addEventListener('click', openMapSheet);
  const li = el('li', 'empty-map-item');
  const cap = el('p', 'map-caption');
  cap.setAttribute('aria-live', 'polite');
  const credit = el('p', 'map-credit');
  credit.hidden = true;
  li.append(widget.el, cap, credit);
  const e = emptyMap = { idx: tripIdx, trip, sig, legs, widget, li, cap, credit, vehicles: [], loc: null, timer: null };
  e.loc = mapLocation(center => {
    if (emptyMap !== e) return;
    drawEmptyMap();
    if (center) widget.centerOn(e.loc.here);
  });
  widget.onLocate = () => e.loc.locate();
  widget.onZoomIn = () => { if (emptyMap === e && !(Date.now() - e.polled < BOARDING_POLL_MS)) pollEmptyVehicles(); };
  widget.onBasemap = () => { if (emptyMap === e) drawEmptyMap(); };
  Promise.all(legs.map(legShapes)).then(() => { if (emptyMap === e) drawEmptyMap(); });
  drawEmptyMap();
  pollEmptyVehicles();
  e.timer = setInterval(pollEmptyVehicles, BOARDING_POLL_MS);
  return li;
}
function closeEmptyMap() {
  const e = emptyMap;
  if (!e) return;
  clearInterval(e.timer);
  e.loc.stop();
  basemapWidgets.delete(e.widget);
  emptyMap = null;
}
// Its height: down to the footer (the page doesn't scroll), at least 250 px.
function fitEmptyMap() {
  const e = emptyMap;
  if (!e?.li.isConnected) return;
  const svg = e.widget.svg;
  const cur = svg.getBoundingClientRect().height;
  // The page's height (the list's bottom, body padding included) against the screen's.
  const doc = $('app').getBoundingClientRect().bottom + scrollY + parseFloat(getComputedStyle(document.body).paddingBottom || 0);
  const h = Math.max(250, Math.round(cur + window.innerHeight - doc));
  if (Math.abs(h - cur) > 1) svg.style.height = `${h}px`;
}
addEventListener('resize', fitEmptyMap);

// The main screen's sheet (🗺 in the header): the shown trip, with the phone's location (once
// granted; mapLocation) and the legs' vehicles (one /vehicles request per leg every 10 s) while
// open.
let mapSheet = null;
function drawMapSheet() {
  const m = mapSheet;
  if (!m) return;
  const now = Date.now();
  const s = enRouteState();
  const c = cache[m.idx];
  const points = legPoints(m.trip, [...(c?.predictions ?? []), ...(c?.schedules?.docs ?? [])]);
  const phase = s?.ride ? ridePhase(s.ride, tripShape(m.trip).walkAfter, now) : null;
  const mine = m.legs.map((_, i) => s?.ride?.legs[i]?.tripId ?? (s?.bell ? s.target?.legs?.[i]?.tripId ?? null : null));
  m.widget.draw({
    legs: m.legs, shapes: loadedShapes(m.legs), fallback: m.legs.map((l, i) => mapFallback(l, points[i])),
    fitAlso: [m.loc.here], finished: phase?.leg ?? 0, vehicles: m.vehicles, mine, nowMs: now,
  }, m.loc.here, m.loc.off ? 'Location off' : '');
  m.mine = mine;
  $('map-credit').textContent = m.widget.base ? basemap.credit ?? '' : '';
  $('map-credit').hidden = !m.widget.base;
}
async function pollMapVehicles() {
  const m = mapSheet;
  if (!m || document.hidden) return;
  if (zoomedOut(m.widget.view, m.widget.fit) && !m.mine?.some(Boolean)) return; // nothing would show
  m.polled = Date.now();
  const res = await Promise.allSettled(m.legs.map(l => api('/vehicles', vehiclesQuery(l))));
  if (mapSheet !== m) return;
  m.vehicles = res.map((r, i) => (r.status === 'fulfilled' ? vehiclePositions(r.value) : m.vehicles[i] ?? []));
  drawMapSheet();
}
function openMapSheet() {
  if (!config || mapSheet) return;
  const trip = config.trips[tripIdx];
  const legs = mapLegs(trip);
  const widget = mapWidget({ label: `Map of ${trip.name}`, interactive: true, focusKey: 'sheet', caption: $('map-caption'), locate: true });
  const m = mapSheet = { idx: tripIdx, trip, legs, widget, vehicles: [], loc: null, timer: null };
  m.loc = mapLocation(center => {
    if (mapSheet !== m) return;
    drawMapSheet();
    if (center) widget.centerOn(m.loc.here);
  });
  widget.onLocate = () => m.loc.locate();
  widget.onZoomIn = () => { if (mapSheet === m && !(Date.now() - m.polled < BOARDING_POLL_MS)) pollMapVehicles(); };
  $('map-title').textContent = trip.name;
  $('map-body').replaceChildren(widget.el);
  $('map-sheet').hidden = false;
  $('app').hidden = true;
  $('map-done').focus();
  drawMapSheet();
  widget.onBasemap = () => { if (mapSheet === m) drawMapSheet(); }; // also shows the credit
  Promise.all(legs.map(legShapes)).then(() => { if (mapSheet === m) drawMapSheet(); });
  pollMapVehicles();
  m.timer = setInterval(pollMapVehicles, BOARDING_POLL_MS);
}
function closeMapSheet() {
  const m = mapSheet;
  if (!m) return;
  clearInterval(m.timer);
  m.loc.stop();
  mapSheet = null;
  $('map-sheet').hidden = true;
  $('map-body').replaceChildren();
  $('map-caption').textContent = '';
  $('map-credit').hidden = true;
  $('app').hidden = false;
  render();
  $('map-btn').focus();
}
$('map-btn').onclick = openMapSheet;
$('map-done').onclick = closeMapSheet;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && mapSheet) closeMapSheet(); });

// ---------- timers ----------

$('refresh').onclick = () => refresh({ force: true });

// Pull-to-refresh: a downward drag that starts at the top of the main list moves it down
// (pullOffset); released past PULL_READY, it refreshes and holds a gap until the header ↻ stops.
let pull = null; // { x, y, dy, active } for the current touch
let pullHeld = false;

function setPull(offset, text, settle) {
  const ptr = $('ptr');
  $('app').classList.toggle('settling', settle);
  $('app').style.transform = offset ? `translateY(${offset}px)` : '';
  ptr.style.opacity = Math.min(1, offset / PULL_READY);
  ptr.classList.toggle('busy', pullHeld);
  ptr.classList.toggle('ready', !pullHeld && offset >= PULL_READY);
  if (text != null) ptr.querySelector('.ptr-text').textContent = text;
}

// The touch's own element gets the move, end and cancel listeners: the once-a-second redraw can
// replace it mid-pull, and a removed element's events no longer reach `document`.
const PULL_EVENTS = [['touchmove', onPullMove, { passive: false }], ['touchend', onPullEnd], ['touchcancel', onPullCancel]];
function endPullTouch() {
  for (const [type, fn] of PULL_EVENTS) pull?.target.removeEventListener(type, fn);
}
document.addEventListener('touchstart', e => {
  endPullTouch();
  pull = null;
  if (!config || setupView || mapSheet || pullHeld || e.touches.length !== 1 || scrollY > 0 || $('toast').contains(e.target)) return;
  pull = { x: e.touches[0].clientX, y: e.touches[0].clientY, dy: 0, active: false, target: e.target };
  for (const [type, fn, opts] of PULL_EVENTS) e.target.addEventListener(type, fn, opts);
}, { passive: true });

function onPullMove(e) {
  if (!pull) return;
  const t = e.touches[0];
  const dx = t.clientX - pull.x;
  const dy = t.clientY - pull.y;
  // The first move decides: upward or sideways is ordinary scrolling, left alone.
  if (!pull.active && (e.touches.length !== 1 || dy <= 0 || Math.abs(dx) > dy)) { endPullTouch(); pull = null; return; }
  pull.active = true;
  e.preventDefault();
  pull.dy = dy;
  const offset = pullOffset(dy);
  const verb = updateKnown() ? 'update' : 'refresh';
  setPull(offset, offset >= PULL_READY ? `Release to ${verb}` : `Pull down to ${verb}`, false);
}

function onPullEnd() {
  endPullTouch();
  const p = pull;
  pull = null;
  if (!p?.active) return;
  if (pullOffset(p.dy) < PULL_READY) { setPull(0, null, true); return; }
  pullHeld = true;
  // A newer page (known, or found by the check below): reload the app; else refresh the data.
  const update = () => { setPull(PULL_HOLD, 'Updating…', true); location.reload(); };
  if (updateKnown()) return update();
  setPull(PULL_HOLD, 'Refreshing…', true);
  refresh({ force: true });
  let reloading = false;
  pageIsNewer().then(newer => { if (newer) { reloading = true; update(); } });
  whenIdle(() => { if (reloading) return; pullHeld = false; setPull(0, null, true); });
}

function onPullCancel() {
  endPullTouch();
  if (pull?.active) setPull(0, null, true);
  pull = null;
}
$('retry').onclick = () => { $('retry-wrap').hidden = true; refresh(); };

// Location for "near" trips: the last fix, re-taken on launch and on return to the app.
let here = null;
let locationOff = false;
let savedCopy = false; // this page came from the service worker's cache
const usesLocation = () => !!config?.trips.some(t => t.near === true);
const located = () => (here && config ? pickByLocation(config.trips, here) : -1);

function locate() {
  if (!usesLocation() || !navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => {
    here = { lat: p.coords.latitude, lon: p.coords.longitude };
    locationOff = false;
    autoSwitch();
  }, () => {
    locationOff = true;
    render();
  }, { enableHighAccuracy: false, maximumAge: 5 * 60_000, timeout: 10_000 });
}

// Switches to the trip pickTrip chooses (a window starting, a location fix), but not away from
// a trip with an active "Leaving now" / "At the stop".
function autoSwitch() {
  if (!config || setupView) return;
  const t = enRouteState() || mapSheet ? tripIdx : chooseTrip(Date.now(), store.get(KEY_OVERRIDE), located());
  if (t !== tripIdx) setTrip(t, false);
  else render();
}

setInterval(() => {
  if (document.hidden || setupView) return;
  autoSwitch();
}, 1000);

document.addEventListener('visibilitychange', () => {
  if (document.hidden) clearTimeout(pollTimer);
  else {
    checkForUpdate();
    widgetSent = null; // the widget may have fallen behind
    if (!setupView) { refresh(); locate(); }
    syncAutoBells();
    if (native) adoptBells().then(checkDismissedCards).then(takeBoarding); else adoptBells();
  }
});

// A Home Screen app resumed from the background keeps running the page it loaded: on each
// return and every 30 min, fetch the page (the service worker saves it, so Reload is quick)
// and show "New version available" if its footer version differs. Not at launch (just loaded).
const RUNNING_VERSION = pageVersion(document.documentElement.outerHTML);
let updateFound = false;
let lastUpdateCheck = Date.now();
async function checkForUpdate() {
  if (updateFound || document.hidden || Date.now() - lastUpdateCheck < 60_000) return;
  lastUpdateCheck = Date.now();
  if (await pageIsNewer()) {
    updateFound = true;
    $('newversion').hidden = false;
  }
}
// Whether the server has a newer page (false offline or on an error).
async function pageIsNewer() {
  try {
    const res = await fetch('./', { cache: 'no-store' });
    return res.ok && isNewerPage(await res.text(), RUNNING_VERSION);
  } catch {
    return false;
  }
}
// A newer page is already known: the banner shows (this check, or the service worker's).
const updateKnown = () => updateFound || !$('newversion').hidden;
setInterval(checkForUpdate, 30 * 60_000);

// Not in the iOS app: no Web Push there, and the app shows its own page when offline.
if (!native && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  // The service worker says whether this page came from its cache (server slow or failing) and
  // whether a newer page has been saved since.
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data?.type !== 'nav') return;
    savedCopy = e.data.cached;
    $('newversion').hidden = !e.data.updated && !updateFound;
    render();
  });
  navigator.serviceWorker.controller?.postMessage('nav-status');
}
$('reload-new').onclick = () => location.reload();
// iOS Safari applies :active on touch only when a touch listener exists.
document.addEventListener('touchstart', () => {}, { passive: true });

// Datadog RUM (DESIGN.md "Observability"): on when /api/config has the web app's IDs. The SDK
// loads from Datadog's CDN after the first render; any failure leaves the app without RUM.
async function startRum() {
  if (!SERVER_API) return;
  try {
    const res = await fetch(`${SERVER_API}/config`);
    const opts = res.ok ? rumInitOptions((await res.json())?.rum?.web, RUNNING_VERSION, location.origin) : null;
    if (!opts) return;
    const s = document.createElement('script');
    s.async = true;
    s.src = RUM_SDK_URL;
    s.onload = () => { try { window.DD_RUM?.init(opts); } catch { /* RUM off */ } };
    document.head.append(s);
  } catch { /* offline or no server: RUM off */ }
}

window.appStarted = true;
render();
startRum();
if (config) { refresh({ force: true }); locate(); } // no trips: the empty state (Plan a trip / Import trips)
syncAutoBells();
if (!native) adoptBells(); // the iOS app's card cleanup calls it
</script>
</body>
</html>
