  // Riding (2026-11-12): the leg, its trip and whether the vehicle has left the boarding stop
  // (the ride's stops, as the timeline's vehicle row), for the vehicle at your GPS position.
  const r = s?.ride ? rideLegStops(trip, s.ride, now) : null;
  const ride = r?.leg?.tripId ? { leg: r.phase.leg, left: !!r.stops?.vehicle && !r.stops.vehicle.boarding } : null;
  return { points, finished: mapFinished(trip, now), mine, ride };
}
// routeMapModel's `ride`: your fix and the map's last GPS point for the ridden vehicle (`e.rideHold`,
// rideMarker's hold, handed between the main map and the sheet with the view: mapSnap).
const rideInput = (ride, here, hold) => ride && { ...ride, fix: here, hold };
function drawMainMap() {
  const e = mainMap;
  if (!e) return;
  const now = Date.now();
  const { points, finished, mine, ride } = mapState(e.trip, e.legs, now);
  const out = outsideMap(e.loc.here), here = out ? null : e.loc.here;
  e.widget.draw({
    legs: e.legs, shapes: loadedShapes(e.legs), fallback: e.legs.map((l, i) => mapFallback(l, points[i])),
    fitAlso: [here], finished, fitFrom: finished, vehicles: e.vehicles, mine, nowMs: now, incoming: true, also: loadedAlso(e.legs),
    ride: rideInput(ride, here, e.rideHold),
  }, here);
  e.rideHold = e.widget.model.ride?.hold ?? null;
  e.widget.setLocateOutside(out);
  e.finished = finished;
  e.mine = mine;
  e.cap.textContent = e.loc.off ? 'Location off' : e.loc.asked && out ? 'Outside the map' : '';
  e.cap.hidden = !e.cap.textContent;
}
async function pollMainVehicles() {
  const e = mainMap;
  if (!e || mapSheet || setupView || document.hidden) return; // the sheet polls; setup covers it
  if (zoomedOut(e.widget.view, e.widget.fit) && !e.mine?.some(Boolean)) return; // nothing would show
  e.polled = Date.now();
  const res = await Promise.allSettled(e.legs.map(l => api('/vehicles', vehiclesQuery(l))));
  if (mainMap !== e) return;
  e.vehicles = res.map((r, i) => (r.status === 'fulfilled' ? vehiclePositions(r.value) : e.vehicles[i] ?? []));
  drawMainMap();
}
// The list's first item: the map, or "Show map ▾" while hidden.
function mainMapItem() {
  // A ride phase change while the sheet is open: it resets too (drawMapSheet).
  if (mapSheet && mapFinished(mapSheet.trip, Date.now()) !== mapSheet.finished) drawMapSheet();
  if (mapHidden) {
    closeMainMap();
    return listItem([listButtonEl('Show map ▾', 'show-map', () => setMapHidden(false))]);
  }
  const trip = config.trips[tripIdx];
  const sig = JSON.stringify(trip); // the same trip, even from a reloaded config
  if (mainMap && (mainMap.idx !== tripIdx || mainMap.sig !== sig)) closeMainMap();
  if (mainMap) {
    // A new phase of the ride (boarded, transferred): faded legs; the view back to the first view
    // (the widget's draw, 2026-11-12).
    if (mapFinished(mainMap.trip, Date.now()) !== mainMap.finished) drawMainMap();
    return mainMap.li;
  }
  const legs = mapLegs(trip);
  const widget = mapWidget({ label: `Map of ${trip.name}`, locate: true, live: true, pan: true, focusKey: 'main-map' });
  widget.el.classList.add('main-map');
  const tools = widget.el.querySelector('.map-tools');
  // Hide map in the top-left corner (2026-11-13), first in the Tab order.
  tools.before(mapToolButton('map-hide', 'Hide map', 'main-map:hide', toolIcon(svgEl('path', { d: 'M6 15l6-6 6 6' })), () => setMapHidden(true)));
  // The sheet (2026-11-13; until then a tap on the map, and from the keyboard a text button shown
  // only while focused): last in the right stack. Focus comes back to it after the keyboard only.
  tools.append(mapToolButton('map-expand', 'Open the full map', 'main-map:open', toolIcon(svgEl('path', { d: 'M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7' })), openMapSheet));
  const li = el('li', 'main-map-item');
  const cap = el('p', 'map-caption');
  cap.setAttribute('aria-live', 'polite');
  cap.hidden = true;
  li.append(widget.el, cap);
  // The shared view (Hide map / Show map, the sheet closed while hidden): kept for the same trip and phase.
  const finished = mapFinished(trip, Date.now());
  const keep = takeMapView({ idx: tripIdx, sig, finished });
  const e = mainMap = { idx: tripIdx, trip, sig, legs, widget, li, cap, vehicles: keep?.vehicles ?? [], rideHold: keep?.rideHold ?? null, loc: null, timer: null, finished };
  e.loc = mapLocation(center => {
    if (mainMap !== e) return;
    drawMainMap();
    if (center && !outsideMap(e.loc.here)) widget.startFollow(e.loc.here);
  }, keep?.loc);
  if (keep) widget.restore(keep.view);
  widget.onLocate = () => e.loc.locate();
  widget.onZoomIn = () => { if (mainMap === e && !(Date.now() - e.polled < BOARDING_POLL_MS)) pollMainVehicles(); };
  widget.onBasemap = () => { if (mainMap === e) drawMainMap(); };
  allShapes(legs).then(() => { if (mainMap === e) drawMainMap(); });
  drawMainMap();
  pollMainVehicles();
  e.timer = setInterval(pollMainVehicles, BOARDING_POLL_MS);
  return li;
}
function closeMainMap() {
  const e = mainMap;
  if (!e) return;
  tripMapView = mapSnap(e);
  clearInterval(e.timer);
  e.loc.stop();
  basemapWidgets.delete(e.widget);
  mainMap = null;
}
// Hide map / Show map: kept on the phone; the focus moves to the other button.
function setMapHidden(hidden) {
  mapHidden = hidden;
  if (hidden) store.set(KEY_MAP_HIDDEN, true);
  else store.del(KEY_MAP_HIDDEN);
  render();
  $('rows').querySelector(`[data-focus="${hidden ? 'list:show-map' : 'main-map:hide'}"]`)?.focus({ preventScroll: true });
}

// The main screen's sheet ("Open the full map" on its map, 2026-11-13; a tap on the map from 2026-11-12, the header's 🗺 before): the shown trip, with the phone's location (once
// granted; mapLocation) and the legs' vehicles (one /vehicles request per leg every 10 s) while
// open.
let mapSheet = null;
function drawMapSheet() {
  const m = mapSheet;
  if (!m) return;
  const now = Date.now();
  const { points, finished, mine, ride } = mapState(m.trip, m.legs, now);
  m.finished = finished; // a ride phase change resets the view (the widget's draw)
  const out = outsideMap(m.loc.here), here = out ? null : m.loc.here;
  m.widget.draw({
    legs: m.legs, shapes: loadedShapes(m.legs), fallback: m.legs.map((l, i) => mapFallback(l, points[i])),
    fitAlso: [here], finished, fitFrom: finished, vehicles: m.vehicles, mine, nowMs: now, incoming: true, also: loadedAlso(m.legs),
    ride: rideInput(ride, here, m.rideHold),
  }, here, m.loc.off ? 'Location off' : m.loc.asked && out ? 'Outside the map' : '');
  m.rideHold = m.widget.model.ride?.hold ?? null;
  m.widget.setLocateOutside(out);
  m.mine = mine;
  $('map-credit').textContent = m.widget.base ? basemap.credit ?? '' : '';
  $('map-credit').hidden = !m.widget.base;
}
async function pollMapVehicles() {
  const m = mapSheet;
  if (!m || document.hidden) return;
  if (zoomedOut(m.widget.view, m.widget.fit) && !m.mine?.some(Boolean)) return; // nothing would show
  m.polled = Date.now();
  const res = await Promise.allSettled(m.legs.map(l => api('/vehicles', vehiclesQuery(l))));
  if (mapSheet !== m) return;
  m.vehicles = res.map((r, i) => (r.status === 'fulfilled' ? vehiclePositions(r.value) : m.vehicles[i] ?? []));
  drawMapSheet();
}
function openMapSheet() {
  if (!config || mapSheet) return;
  const trip = config.trips[tripIdx];
  const legs = mapLegs(trip);
  const at = { idx: tripIdx, sig: JSON.stringify(trip), finished: mapFinished(trip, Date.now()) };
  // The main map's view (2026-11-12; until then the sheet started at the fit and ended follow there).
  const kept = sameTrip(mainMap, at) ? mapSnap(mainMap) : takeMapView(at);
  const widget = mapWidget({ label: `Map of ${trip.name}`, interactive: true, focusKey: 'sheet', caption: $('map-caption'), locate: true, live: true });
  const m = mapSheet = { ...at, trip, legs, widget, vehicles: kept?.vehicles ?? [], rideHold: kept?.rideHold ?? null, loc: null, timer: null,
    opener: document.activeElement?.matches(':focus-visible') ? document.activeElement : null }; // the keyboard's
  m.loc = mapLocation(center => {
    if (mapSheet !== m) return;
    drawMapSheet();
    if (center && !outsideMap(m.loc.here)) widget.startFollow(m.loc.here);
  }, kept?.loc);
  if (kept) widget.restore(kept.view);
  widget.onLocate = () => m.loc.locate();
  widget.onZoomIn = () => { if (mapSheet === m && !(Date.now() - m.polled < BOARDING_POLL_MS)) pollMapVehicles(); };
  widget.onBasemap = () => { if (mapSheet === m) drawMapSheet(); }; // the bound: your location in or out
  $('map-title').textContent = trip.name;
  $('map-body').replaceChildren(widget.el);
  $('map-sheet').hidden = false;
  $('app').hidden = true;
  $('map-done').focus();
  drawMapSheet();
  widget.onBasemap = () => { if (mapSheet === m) drawMapSheet(); }; // also shows the credit
  allShapes(legs).then(() => { if (mapSheet === m) drawMapSheet(); });
  pollMapVehicles();
  m.timer = setInterval(pollMapVehicles, BOARDING_POLL_MS);
}
function closeMapSheet() {
  const m = mapSheet;
  if (!m) return;
  clearInterval(m.timer);
  m.loc.stop();
  const snap = mapSnap(m);
  mapSheet = null;
  $('map-sheet').hidden = true;
  $('map-body').replaceChildren();
  $('map-caption').textContent = '';
  $('map-credit').hidden = true;
  $('app').hidden = false;
  // The sheet's view back to the main map (2026-11-12), at the main map's size (shown again first).
  if (sameTrip(mainMap, m)) {
    mainMap.loc.adopt(snap.loc);
    if (!document.hidden) mainMap.loc.resume();
    mainMap.widget.restore(snap.view);
    Object.assign(mainMap, { vehicles: snap.vehicles, rideHold: snap.rideHold });
    drawMainMap();
  } else tripMapView = snap;
  render();
  // Back to what opened it from the keyboard ("Open the full map"). After a tap, nothing: focusing
  // the trip picker opened its menu on iOS (2026-11-12).
  if (m.opener?.isConnected && m.opener !== document.body) m.opener.focus();
  else document.activeElement?.blur();
}
$('map-done').onclick = closeMapSheet;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && mapSheet) closeMapSheet(); });

// ---------- timers ----------

$('refresh').onclick = () => refresh({ force: true });

// Pull-to-refresh: a downward drag that starts at the top of the main list moves it down
// (pullOffset); released past PULL_READY, it refreshes and holds a gap until the header ↻ stops.
let pull = null; // { x, y, dy, active } for the current touch
let pullHeld = false;

function setPull(offset, text, settle) {
  const ptr = $('ptr');
  $('app').classList.toggle('settling', settle);
  $('app').style.transform = offset ? `translateY(${offset}px)` : '';
  ptr.style.opacity = Math.min(1, offset / PULL_READY);
  ptr.classList.toggle('busy', pullHeld);
  ptr.classList.toggle('ready', !pullHeld && offset >= PULL_READY);
  if (text != null) ptr.querySelector('.ptr-text').textContent = text;
}

// The touch's own element gets the move, end and cancel listeners: the once-a-second redraw can
// replace it mid-pull, and a removed element's events no longer reach `document`.
const PULL_EVENTS = [['touchmove', onPullMove, { passive: false }], ['touchend', onPullEnd], ['touchcancel', onPullCancel]];
function endPullTouch() {
  for (const [type, fn] of PULL_EVENTS) pull?.target.removeEventListener(type, fn);
}
document.addEventListener('touchstart', e => {
  endPullTouch();
  pull = null;
  if (!config || setupView || mapSheet || pullHeld || e.touches.length !== 1 || scrollY > 0 || $('toast').contains(e.target)) return;
  pull = { x: e.touches[0].clientX, y: e.touches[0].clientY, dy: 0, active: false, target: e.target };
  for (const [type, fn, opts] of PULL_EVENTS) e.target.addEventListener(type, fn, opts);
}, { passive: true });

function onPullMove(e) {
  if (!pull) return;
  const t = e.touches[0];
  const dx = t.clientX - pull.x;
  const dy = t.clientY - pull.y;
  // The first move decides: upward or sideways is ordinary scrolling, left alone.
  if (!pull.active && (e.touches.length !== 1 || dy <= 0 || Math.abs(dx) > dy)) { endPullTouch(); pull = null; return; }
  pull.active = true;
  e.preventDefault();
  pull.dy = dy;
  const offset = pullOffset(dy);
  const verb = updateKnown() ? 'update' : 'refresh';
  setPull(offset, offset >= PULL_READY ? `Release to ${verb}` : `Pull down to ${verb}`, false);
}

function onPullEnd() {
  endPullTouch();
  const p = pull;
  pull = null;
  if (!p?.active) return;
  if (pullOffset(p.dy) < PULL_READY) { setPull(0, null, true); return; }
  pullHeld = true;
  // A newer page (known, or found by the check below): reload the app; else refresh the data.
  const update = () => { setPull(PULL_HOLD, 'Updating…', true); location.reload(); };
  if (updateKnown()) return update();
  setPull(PULL_HOLD, 'Refreshing…', true);
  refresh({ force: true });
  let reloading = false;
  pageIsNewer().then(newer => { if (newer) { reloading = true; update(); } });
  whenIdle(() => { if (reloading) return; pullHeld = false; setPull(0, null, true); });
}

function onPullCancel() {
  endPullTouch();
  if (pull?.active) setPull(0, null, true);
  pull = null;
}
$('retry').onclick = () => { $('retry-wrap').hidden = true; refresh(); };

// Location for "near" trips: the last fix, re-taken on launch and on return to the app.
let here = null;
let locationOff = false;
let savedCopy = false; // this page came from the service worker's cache
const usesLocation = () => !!config?.trips.some(t => t.near === true);
const located = () => (here && config ? pickByLocation(config.trips, here) : -1);

function locate() {
  if (!usesLocation() || !navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => {
    here = { lat: p.coords.latitude, lon: p.coords.longitude };
    locationOff = false;
    autoSwitch();
  }, () => {
    locationOff = true;
    render();
  }, { enableHighAccuracy: false, maximumAge: 5 * 60_000, timeout: 10_000 });
}

// Switches to the trip pickTrip chooses (a window starting, a location fix), but not away from
// a trip with an active "Leaving now" / "At the stop".
function autoSwitch() {
  if (!config || setupView) return;
  const t = enRouteState() || mapSheet ? tripIdx : chooseTrip(Date.now(), store.get(KEY_OVERRIDE), located());
  if (t !== tripIdx) setTrip(t, false);
  else render();
}

setInterval(() => {
  if (document.hidden || setupView) return;
  autoSwitch();
}, 1000);

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { clearTimeout(pollTimer); mainMap?.loc.pause(); }
  else {
    mainMap?.loc.resume();
    checkForUpdate();
    widgetSent = null; // the widget may have fallen behind
    if (!setupView) { refresh(); locate(); }
    syncAutoBells();
    if (native) {
      adoptBells().then(checkDismissedCards).then(takeBoarding);
      // Back from iOS Settings: the permissions (setup's rows, the boarding setting, the bell).
      readPermissions().then(p => (setupView ? setupView.refreshPermissions?.(p) : render()));
    } else adoptBells();
  }
});

// A Home Screen app resumed from the background keeps running the page it loaded: on each
// return and every 30 min, fetch the page (the service worker saves it, so Reload is quick)
// and show "New version available" if its footer version differs. Not at launch (just loaded).
const RUNNING_VERSION = pageVersion(document.documentElement.outerHTML);
let updateFound = false;
let lastUpdateCheck = Date.now();
async function checkForUpdate() {
  if (updateFound || document.hidden || Date.now() - lastUpdateCheck < 60_000) return;
  lastUpdateCheck = Date.now();
  if (await pageIsNewer()) {
    updateFound = true;
    $('newversion').hidden = false;
  }
}
// Whether the server has a newer page (false offline or on an error).
async function pageIsNewer() {
  try {
    const res = await fetch('./', { cache: 'no-store' });
    return res.ok && isNewerPage(await res.text(), RUNNING_VERSION);
  } catch {
    return false;
  }
}
// A newer page is already known: the banner shows (this check, or the service worker's).
const updateKnown = () => updateFound || !$('newversion').hidden;
setInterval(checkForUpdate, 30 * 60_000);

// Not in the iOS app: no Web Push there, and the app shows its own page when offline.
if (!native && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  // The service worker says whether this page came from its cache (server slow or failing) and
  // whether a newer page has been saved since.
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data?.type !== 'nav') return;
    savedCopy = e.data.cached;
    $('newversion').hidden = !e.data.updated && !updateFound;
    render();
  });
  navigator.serviceWorker.controller?.postMessage('nav-status');
}
$('reload-new').onclick = () => location.reload();
// iOS Safari applies :active on touch only when a touch listener exists.
document.addEventListener('touchstart', () => {}, { passive: true });

// Datadog RUM (DESIGN.md "Observability"): on when /api/config has the web app's IDs. The SDK
// loads from Datadog's CDN after the first render; any failure leaves the app without RUM.
async function startRum() {
  if (!SERVER_API) return;
  try {
    const res = await fetch(`${SERVER_API}/config`);
    const opts = res.ok ? rumInitOptions((await res.json())?.rum?.web, RUNNING_VERSION, location.origin) : null;
    if (!opts) return;
    const s = document.createElement('script');
    s.async = true;
    s.src = RUM_SDK_URL;
    s.onload = () => { try { window.DD_RUM?.init(opts); } catch { /* RUM off */ } };
    document.head.append(s);
  } catch { /* offline or no server: RUM off */ }
}

window.appStarted = true;
render();
startRum();
if (config) { refresh({ force: true }); locate(); } // no trips: the empty state (Plan a trip / Import trips)
syncAutoBells();
if (!native) adoptBells(); // the iOS app's card cleanup calls it
</script>
