<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>T-Minus</title>
<meta name="apple-mobile-web-app-title" content="T-Minus">
<meta name="theme-color" content="#f5f5f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  [hidden] { display: none !important; }
  :root {
    color-scheme: light dark; /* native controls (time pickers, checkboxes) follow the theme */
    --bg: #f5f5f3; --card: #ffffff; --text: #1c1f24; --muted: #6b7078; --border: #dcdde0;
    --green: #1b7f45; --amber: #a35f00; --red: #c62828; --accent: #ed8b00;
    --accent-text: #a85a00; /* the accent as text on white (4.5:1); fills keep --accent */
    --alert-bg: #fff4e0; --alert-border: #f0c070;
    --press: rgba(0, 0, 0, .07); /* pressed overlay */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417; --card: #1c1f24; --text: #eceef1; --muted: #9aa0a8; --border: #2e333a;
      --green: #4cc47f; --amber: #f0a830; --red: #ff6b6b; --accent: #ed8b00; --accent-text: #ed8b00;
      --alert-bg: #2e2515; --alert-border: #6b5220;
      --press: rgba(255, 255, 255, .09);
    }
  }
  * { box-sizing: border-box; }
  /* No double-tap zoom (iOS Safari ignores user-scalable=no for pinch zoom). No rubber-band
     bounce: the main list has its own pull-to-refresh. */
  html { touch-action: manipulation; overscroll-behavior-y: none; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent; /* the :active styles below replace iOS's gray flash */
    /* iOS blurs content right under the status bar. The standalone app starts below it (no
       status-bar-style meta), so the inset is 0 there; the 22px does the work. */
    padding: calc(env(safe-area-inset-top, 0px) + 22px) 16px max(16px, env(safe-area-inset-bottom));
  }
  main { max-width: 480px; margin: 0 auto; }
  /* Pressed: buttons darken and shrink a little; rows only darken (an inset overlay works on any
     background). A button pressed inside a row doesn't also darken the row. */
  button { transition: transform 80ms; }
  button:not(:disabled):active { box-shadow: inset 0 0 0 100vmax var(--press); transform: scale(.97); }
  .row:not(.ride):active:not(:has(button:active)) { box-shadow: inset 0 0 0 100vmax var(--press); }
  header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .toggle { display: flex; flex-wrap: wrap; flex: 1; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .toggle button {
    flex: 1 1 auto; padding: 10px 6px; border: 0; background: var(--card); color: var(--muted);
    font: inherit; font-size: 14px; cursor: pointer;
  }
  .toggle button[aria-pressed="true"] { background: var(--accent); color: #1c1f24; font-weight: 600; }
  .toggle select {
    flex: 1; min-width: 0; padding: 10px; border: 0; background: var(--card); color: var(--text);
    font: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .icon-btn {
    width: 44px; height: 44px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--card); color: var(--text); font-size: 20px; cursor: pointer;
  }
  #refresh.busy span { display: inline-block; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #refresh.busy span { animation: none; opacity: .4; } }
  /* Pull-to-refresh: sits above the header (height = PULL_HOLD) and comes into view as #app moves down. */
  .ptr {
    height: 48px; margin-top: -48px; display: flex; align-items: center; justify-content: center; gap: 8px;
    color: var(--muted); font-size: 14px; opacity: 0;
  }
  /* ↓ while pulling, turning to ↑ at the ready point; a spinning ring while refreshing. */
  .ptr-icon { display: inline-flex; transition: transform 150ms; }
  .ptr-icon svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .ptr.ready .ptr-icon { transform: rotate(180deg); }
  .ptr-ring { display: none; width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--muted); border-radius: 50%; }
  .ptr.busy .ptr-icon { display: none; }
  .ptr.busy .ptr-ring { display: block; animation: spin .8s linear infinite; }
  #app.settling { transition: transform 200ms ease-out; }
  #app.settling .ptr { transition: opacity 200ms; }
  @media (prefers-reduced-motion: reduce) {
    .ptr-icon { transition: none; }
    .ptr.busy .ptr-ring { animation: none; opacity: .4; }
  }
  /* At the bottom, just above the version. */
  .status { font-size: 13px; color: var(--muted); margin: 16px 0 0; min-height: 18px; text-align: center; }
  .go-btn { margin-bottom: 12px; } /* "Go somewhere else…", under the trip buttons */
  .status.stale { color: var(--red); }
  .status.old { color: var(--amber); }
  .status .link {
    padding: 0; border: 0; background: none; color: inherit; font: inherit;
    text-decoration: underline; cursor: pointer; box-shadow: none !important; transform: none !important;
  }
  .alerts { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 8px; }
  .alerts li {
    background: var(--alert-bg); border: 1px solid var(--alert-border); border-radius: 10px;
    padding: 8px 12px; font-size: 14px;
  }
  .alerts b { font-size: 12px; letter-spacing: .03em; }
  .rows { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .row {
    background: var(--card); border: 1px solid var(--border); border-left: 6px solid var(--border);
    border-radius: 12px; padding: 12px 14px;
  }
  .row.green { border-left-color: var(--green); }
  .row.amber { border-left-color: var(--amber); }
  .row.red { border-left-color: var(--red); }
  .big {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0 8px;
    font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  /* The countdown never breaks; if a long leave-by time ("Thu 5:31am") doesn't fit beside it,
     the time drops to the next line, still right-aligned. */
  .big > span { white-space: nowrap; }
  .big .at { font-size: 20px; font-weight: 600; margin-left: auto; }
  .green .big { color: var(--green); }
  .amber .big { color: var(--amber); }
  .red .big { color: var(--red); }
  .row.missed { border-left-color: var(--muted); }
  .row.prev { border-left-color: var(--muted); }
  .row.prev + .row:not(.prev) { margin-top: 22px; } /* previous rides apart from the rest */
  .prev .big { color: var(--muted); font-size: 20px; }
  .list-btn {
    display: block; width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--card); color: var(--text); font: inherit; font-size: 14px; cursor: pointer;
  }
  .missed .big { color: var(--muted); font-size: 20px; }
  .none .big { color: var(--muted); font-size: 20px; }
  .detail { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .dot {
    display: inline-block; width: .7em; height: .7em; border-radius: 50%; margin-right: .35em;
    vertical-align: baseline; box-shadow: 0 0 0 1px rgb(0 0 0 / .25);
  }
  .tag { white-space: nowrap; }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase;
    padding: 1px 6px; border-radius: 6px; border: 1px solid var(--border); margin-left: 6px; vertical-align: 2px;
  }
  .badge.live { border-color: var(--green); color: var(--green); }
  .row { cursor: pointer; }
  /* The row's expand button: looks like the row it sits in. */
  .row-toggle {
    display: block; width: 100%; padding: 0; margin: 0; border: 0; background: none; color: inherit;
    font: inherit; text-align: inherit; cursor: inherit; border-radius: 6px;
  }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .row-toggle:focus-visible { outline-offset: 4px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .strip { display: flex; align-items: center; margin: 4px 0 2px; font-size: 14px; white-space: nowrap; overflow: hidden; }
  .strip .seg { flex: 0 0 16px; height: 2px; background: var(--border); }
  .strip .seg:first-child, .strip .seg:last-child { flex-basis: 10px; }
  .strip .stop { margin-right: 6px; }
  .strip .dot { margin-right: 4px; vertical-align: -1px; }
  .row.ride { cursor: default; border-left-color: var(--green); }
  .row.ride.arrived { border-left-color: var(--border); }
  .ride-head { font-size: 20px; font-weight: 700; color: var(--green); }
  .row.ride.arrived .ride-head { color: var(--text); }
  .step.current { color: var(--text); font-weight: 600; }
  .row.tracked { outline: 2px solid var(--green); outline-offset: -2px; }
  .chev { color: var(--muted); font-size: 20px; line-height: 1; margin-left: 6px; }
  .row-foot { display: flex; align-items: center; margin-top: 10px; }
  .row-foot .chev { margin-left: auto; }
  .track-btn {
    padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); color: var(--text); font: inherit; font-size: 14px; cursor: pointer;
  }
  .track-btn.tracking { color: var(--green); border-color: var(--green); }
  .row-foot { gap: 8px; }
  .alerts-btn svg { width: 15px; height: 15px; vertical-align: -2px; margin-right: 5px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .track-btn svg { width: 15px; height: 15px; vertical-align: -2px; margin-right: 5px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .track-btn.on { color: var(--green); border-color: var(--green); }
  .track-btn:disabled { opacity: .5; cursor: default; }
  .push-hint { margin-top: 6px; font-size: 13px; color: var(--muted); }
  /* A reminder is set ("Notify me"): a bell beside the collapsed row's badge. */
  .summary .bell { display: inline-flex; color: var(--green); margin-left: 6px; }
  .summary .bell svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ride-outlook { margin-top: 6px; font-size: 14px; color: var(--muted); }
  .ride-outlook.warn { color: var(--amber); font-weight: 600; }
  /* Ride card: the stops left along the ridden leg's bar (small dots), and the vehicle on it. */
  .tl-leg .step.mid::after { top: 0; bottom: 0; }
  .step.mid { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; padding-top: 2px; padding-bottom: 2px; }
  .step.mid .n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step.mid .t { flex: none; }
  .mid-dot { position: absolute; left: 3px; top: calc(2px + .55em); width: 4px; height: 4px; border-radius: 50%; background: var(--card); z-index: 1; }
  .step.mid.here { font-weight: 600; }
  .step.mid.gap { height: 16px; padding: 0; }
  .veh {
    position: absolute; left: -4px; width: 18px; height: 18px; border-radius: 50%; background: var(--c);
    border: 3px solid var(--card); box-shadow: 0 0 0 1px var(--c); box-sizing: border-box; z-index: 2;
  }
  .step.mid.here .veh { top: calc(2px + .2em); }
  .step.mid.gap .veh { top: -1px; }
  .step.mid.more button {
    padding: 0; border: 0; background: none; color: var(--muted); font: inherit; font-size: 13px;
    text-decoration: underline; cursor: pointer; box-shadow: none !important; transform: none !important;
  }
  .enroute-bar.ride-btns { margin: 12px 0 0; }
  .toast {
    position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 10;
    max-width: 360px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px;
    background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .18); font-size: 15px;
  }
  .toast { cursor: pointer; }
  .toast span { flex: 1; }
  .toast button {
    padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--card);
    color: var(--green); font: inherit; font-weight: 600; cursor: pointer;
  }
  .summary { display: flex; justify-content: space-between; align-items: center; gap: 0 8px; }
  .summary .badge { margin-left: 0; }
  .arrive { margin-left: auto; white-space: nowrap; }
  /* Expanded row: steps under a divider, joined by a rail through the route dots. */
  .timeline { position: relative; border-top: 1px solid var(--border); margin-top: 8px; padding-top: 6px; }
  /* Walking parts of the rail: dotted; each ride draws its own bar over it (.tl-leg). */
  .timeline::before {
    content: ''; position: absolute; left: 4px; top: 14px; bottom: 12px; border-left: 2px dotted var(--border);
  }
  .step { position: relative; padding: 3px 0 3px 22px; font-variant-numeric: tabular-nums; }
  .step.walk { font-size: 13px; color: var(--muted); }
  .tl-leg { position: relative; }
  /* The ride's bar, in three pieces so it runs node to node even when a long name wraps: from
     the boarding stop's node down, through the ride line, down to the drop-off's node. */
  .tl-leg .step::after { content: ''; position: absolute; left: 1px; width: 8px; background: var(--c); }
  .tl-leg .step.stop:first-child::after { top: calc(8px + .35em); bottom: 0; border-radius: 4px 4px 0 0; }
  .tl-leg .step.ride::after { top: 0; bottom: 0; }
  .tl-leg .step.stop:last-child::after { top: 0; height: calc(8px + .35em); border-radius: 0 0 4px 4px; }
  .step.stop, .step.end { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; }
  .step.stop { cursor: pointer; }
  .step.stop .n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step.stop.full .n { white-space: normal; }
  .step.stop .t, .step.end .t { flex: none; }
  .node.end-node { background: var(--muted); border-color: var(--muted); }
  .node {
    position: absolute; left: 0; top: calc(3px + .35em); width: 10px; height: 10px; border-radius: 50%;
    background: var(--card); border: 2px solid var(--c); box-sizing: border-box; z-index: 1;
  }
  .step.ride { font-size: 13px; color: var(--muted); padding-top: 4px; padding-bottom: 4px; }
  .step.ride .toward { font-size: 12px; }
  /* Passed steps: muted text (still 4.5:1), faded node, bar and walking figure. */
  .step.done { color: var(--muted); }
  .step.done > .node, .step.done::after, .step.done .walk-icon svg { opacity: .4; }
  .step.walk.current, .step.ride.current { color: var(--text); }
  /* Walking figure on the rail (centered on it, like the route dots); the card color masks the rail. */
  .walk-icon {
    position: absolute; left: -3px; top: 3px; width: 16px; height: 18px; display: flex; align-items: center; justify-content: center;
    background: var(--card); color: var(--muted);
  }
  .walk-icon svg { width: 14px; height: 14px; fill: currentColor; }
  .step.current .walk-icon { color: var(--text); }
  .empty { color: var(--muted); padding: 16px 0; }
  .enroute-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: -4px 0 12px; font-size: 14px; color: var(--muted); }
  .enroute-bar button {
    padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); color: var(--text); font: inherit; font-size: 14px; cursor: pointer;
  }
  .en-status { flex: 1 1 0; min-width: 0; }
  .enroute-bar.wide .en-status { flex-basis: 100%; }
  .row.enroute { border-left-color: var(--border); }
  .enroute .big { color: var(--text); }
  .row.enroute.catch { border-left-color: var(--green); }
  .catch .big { color: var(--green); }
  .version { color: var(--muted); font-size: 12px; text-align: center; margin-top: 20px; }
  /* Reload prompts: a 44 px target. The new-version card sits above the footer version. */
  .big-btn { min-height: 44px; padding: 0 22px; font-size: 17px; font-weight: 600; border-radius: 12px;
    background: var(--accent); border: 1px solid var(--accent); color: #1c1f24; }
  #loadfail .big-btn { display: block; margin-top: 8px; }
  .update-card { margin-top: 20px; border: 1px solid var(--accent); border-radius: 14px; padding: 14px; text-align: center; }
  .update-card .t { font-weight: 600; margin-bottom: 10px; }
  .update-card .big-btn { width: 100%; }
  .empty .big-btn { width: 100%; }
  .empty-help { margin: 0 0 12px; }
  .empty .secondary-btn { width: 100%; min-height: 44px; margin-top: 10px; }
  /* Setup view (setup.js) */
  .setup button {
    padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font: inherit; font-size: 14px; cursor: pointer;
  }
  .setup button.primary { background: var(--accent); color: #1c1f24; border-color: var(--accent); font-weight: 600; }
  .setup button.danger { color: var(--red); }
  .setup button:disabled { opacity: .5; }
  .setup-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    /* When stuck, its own top padding keeps the buttons out of the blurred strip. */
    position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); padding: 22px 0 10px; margin-top: -22px; z-index: 1;
  }
  /* Picker: header, context line and search stick together; the header inside is a plain block. */
  .picker-top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 1; background: var(--bg);
    padding: 22px 0 8px; margin-top: -22px;
  }
  .picker-top .setup-head { position: static; padding: 0 0 10px; margin: 0; }
  .picker-top .muted { margin-top: 0; }
  .setup .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 14px 14px; margin-bottom: 12px;
  }
  .field { display: block; margin: 10px 0 0; font-size: 14px; color: var(--muted); }
  .field input { margin-top: 4px; }
  /* Auto-route: the two walk fields side by side; a picked station's "Change" at the right. */
  .field-pair { display: flex; gap: 10px; align-items: flex-end; }
  .field-pair > .field { flex: 1; min-width: 0; }
  .field > .item { margin-top: 4px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 4px; }
  .field .item .change { margin-left: auto; color: var(--accent-text); font-size: 14px; }
  .check { display: flex; gap: 8px; align-items: center; margin: 10px 0 0; font-size: 14px; }
  .setup .check input { width: auto; margin: 0; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .setup input, .setup textarea, .setup select {
    width: 100%; font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px;
  }
  .setup textarea { height: 240px; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; margin-top: 8px; }
  .leg-row { display: flex; gap: 6px; margin-top: 12px; }
  .setup .leg-row .leg-item {
    flex: 1; min-width: 0; display: flex; align-items: center; text-align: left;
    border: 1px solid var(--border); border-radius: 10px; background: var(--bg); padding: 8px 12px 10px;
  }
  .leg-main { flex: 1; min-width: 0; }
  .go { margin-left: auto; padding-left: 8px; color: var(--muted); font-size: 20px; line-height: 1; }
  .setup .trip-row .item { display: flex; align-items: center; }
  .trip-main { flex: 1; min-width: 0; }
  .leg-title { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
  .leg-text { font-size: 14px; margin-bottom: 6px; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .trip-btns, .io { margin-top: 12px; }
  .setup button.add { width: 100%; margin: 10px 0 0; }
  .setup .arrived-note { margin-top: 12px; }
  .setup button.add.accent { border-color: var(--accent); color: var(--accent-text); }
  .legs-empty {
    border: 1px dashed var(--border); border-radius: 10px; padding: 12px; margin-top: 12px;
    text-align: center; color: var(--muted); font-size: 14px;
  }
  .setup details.more { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 10px; }
  .setup details.more summary { font-size: 14px; color: var(--muted); cursor: pointer; }
  .setup .list { display: grid; gap: 6px; margin-top: 10px; }
  .setup button.item { text-align: left; width: 100%; }  .setup .item + .item { margin-top: 0; }
  .setup .list.trips { margin: 0; }
  .setup .section { margin: 20px 0 6px; }
  .setup .list .section-head { margin: 8px 0 0; font-weight: 600; }
  .setup .item .conn { color: var(--muted); font-size: 13px; margin-left: 4px; }
  .setup button.item.has-dist { display: flex; align-items: baseline; gap: 8px; }
  .setup .item.has-dist .main { flex: 1; min-width: 0; }
  .setup .item .dist { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .setup button.link { padding: 0; border: 0; background: none; color: inherit; font: inherit; text-decoration: underline; }
  .leg-routes { display: flex; flex-wrap: wrap; gap: 0 14px; margin: -2px 0 6px; }
  .leg-routes .check { margin: 0; }
  .trip-row { display: flex; gap: 6px; }

<body>

<script>
  // Shown if the module below never starts (e.g. a stale cached core.js after a deploy).
  setTimeout(() => {
