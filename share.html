<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- The page at /r/<id> (DESIGN.md "Share my ride"): the server fills in the preview text. The base keeps
     every relative URL at the site's root, whatever the link's path. -->
<base href="/">
<title>{{ogTitle}}</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="{{ogTitle}}">
<meta property="og:description" content="{{ogDescription}}">
<meta property="og:type" content="website">
<meta name="theme-color" content="#f5f5f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href='./app.css?v=67caa128b0'>
<style>
  .share-head { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; }
  .share-head h1 { margin: 0; font-size: 17px; font-weight: 600; color: var(--muted); }
  .share-live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--green); border: 1px solid var(--green); border-radius: 999px; padding: 1px 8px; }
  .share-live::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  .row.ride.amber .ride-head { color: var(--amber); }
  .row.ride.red .ride-head { color: var(--red); }
  .share-phase { margin-top: 2px; }
  .share-note { color: var(--muted); font-size: 13px; }
  .row.ride .timeline { margin-top: 10px; }
  .share-foot { text-align: center; color: var(--muted); font-size: 12px; margin: 12px 0 0; }
  .share-ended .ride-head { color: var(--text); }
</style>
</head>
<body>
<main>
  <header class="share-head"><h1 id="share-title">Shared ride</h1><span class="share-live" id="share-live" hidden>Live</span></header>
  <div id="share-map" hidden></div>
  <ul class="rows" id="share-rows"><li class="row ride"><div class="ride-head" style="color: var(--muted)">Loading…</div></li></ul>
  <p class="share-foot" id="share-foot"></p>
  <p class="sr-only" id="share-status" role="status" aria-live="polite"></p>
  <noscript><p>This page needs JavaScript.</p></noscript>
</main>
<script type="module" src='./share.js?v=a9e3999a3c'></script>
</body>
</html>
